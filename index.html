<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights — 攝影氣象預報</title>
  <link rel="stylesheet" href="./assets/app.css">

</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <h1>📸 ChaseLights</h1>
      <div class="header-right">
        <select id="country-select" onchange="switchRegion(this.value)" class="control-dropdown country-dropdown" data-i18n-aria-label="country_aria" aria-label="國家／區域">
          <option value="tw" selected data-i18n="opt_tw">🇹🇼 台灣</option>
          <option value="jp" data-i18n="opt_jp">🇯🇵 日本</option>
          <option value="us" data-i18n="opt_us">🇺🇸 美國</option>
        </select>
        <select id="lang-select" onchange="switchLanguage(this.value)" class="control-dropdown lang-dropdown">
          <option value="zh-TW" selected>🌐 繁體中文</option>
          <option value="en">🌐 English</option>
          <option value="ja">🌐 日本語</option>
        </select>
        <select id="temp-unit-select" onchange="switchTempUnit(this.value)" class="control-dropdown lang-dropdown" data-i18n-aria-label="temp_unit_aria" aria-label="溫度單位">
          <option value="C">🌡 °C</option>
          <option value="F">🌡 °F</option>
        </select>
        <a class="weather-map-link" href="./weather-map.html" data-i18n-title="weathergrid_title" title="開啟 WeatherGrid 天氣圖">🗺️ WeatherGrid</a>
        <a class="weather-map-link" href="./weather-map-v2.html" data-i18n-title="weathergrid_v2_title" title="開啟 WeatherGrid V2 實驗頁">🧪 WeatherGrid V2</a>
        <a class="weather-map-link" href="./field-intake.html" data-i18n="field_intake_link" data-i18n-title="field_intake_title" title="開啟實拍驗證">📷 實拍驗證</a>
        <div class="updated" id="update-time">載入中...</div>
      </div>
    </div>
  </header>

  <div class="filter-shell">
    <div class="filter-toolbar">
      <div class="filter-row">
        <div class="sub-nav-bar" id="sub-nav"></div>
        <input id="place-search" class="place-search" type="search" autocomplete="off"
               placeholder="搜尋景點名稱…" oninput="setPlaceSearch(this.value)">
      </div>

      <div class="filter-toolbar-secondary">
        <div class="day-nav-bar" id="day-nav">
          <button class="day-btn active" onclick="switchDay('today', this)" data-i18n="btn_today">📅 今天</button>
          <button class="day-btn" onclick="switchDay('tomorrow', this)" data-i18n="btn_tomorrow">📅 明天</button>
          <button class="day-btn" onclick="switchDay('after_tomorrow', this)" data-i18n="btn_after_tomorrow">📅 後天</button>
        </div>
        <div id="admin-filter" class="admin-filter-host" hidden></div>
        <div class="sort-control">
          <label for="spot-sort" data-i18n="sort_label">排序</label>
          <select id="spot-sort" class="sort-select" onchange="setSortMode(this.value)">
            <option value="region" data-i18n="sort_region">地區順序</option>
            <option value="score_desc" data-i18n="sort_score_desc">評分：高到低</option>
            <option value="score_asc" data-i18n="sort_score_asc">評分：低到高</option>
            <option value="distance_near" data-i18n="sort_distance_near">距離：近到遠</option>
            <option value="distance_far" data-i18n="sort_distance_far">距離：遠到近</option>
          </select>
          <span id="sort-status" class="sort-status" aria-live="polite"></span>
        </div>
        <div class="discovery-row">
          <div class="discovery-title" id="discovery-title">📍 今天去哪裡拍？</div>
          <div class="rank-summary" id="filter-result-summary"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading" data-i18n="loading">正在獲取攝影氣象數據...</div>
  <div class="container" id="spots-container"></div>

  <div class="modal-overlay" id="place-modal-overlay" onclick="closePlaceModal(event)">
    <div class="modal place-guide-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="place-modal-spot-name">📍 景點攝影資訊</div>
        <button class="close-btn" onclick="closePlaceModal()" data-i18n-aria-label="close_place" aria-label="關閉景點攝影資訊">&times;</button>
      </div>
      <div class="modal-body" id="place-modal-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modal-spot-name">📍 景點氣象分析</div>
        <button class="close-btn" onclick="closeModal()" data-i18n-aria-label="close_weather" aria-label="關閉景點氣象分析">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-summary" id="modal-summary"></div>
        <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 10px;" data-i18n="modal_subtitle">
          ⏱️ 逐時拍攝條件：過去 24 小時 + 未來 72 小時（藍底＝所選日期中相對較佳的時段；仍需看整體評分與條件）
        </div>
        <div class="timeline-table-wrap" style="overflow-x: auto;">
          <table class="terminal-table">
            <thead id="timeline-head"></thead>
            <tbody id="timeline-body"></tbody>
          </table>
        </div>
        <div class="timeline-mobile" id="timeline-mobile"></div>
      </div>
    </div>
  </div>

  <script src="./assets/app.js"></script>

</body>
</html>
