<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights — 攝影氣象預報</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./assets/site-nav.css?v=clui62">
  <link rel="stylesheet" href="./assets/app.css?v=clui77">

</head>
<body>

  <nav class="site-nav" aria-label="全站導覽">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="./index.html">📸 ChaseLights</a>
      <div class="site-nav-links">
        <a class="site-nav-item" data-nav-target="cards" data-active="page" href="./index.html" data-i18n="nav_cards">卡片</a>
        <a class="site-nav-item" data-nav-target="weather" href="./weather-map.html" data-i18n="nav_weathermap">天氣圖</a>
        <a class="site-nav-item" data-nav-target="reminders" href="./reminders.html" data-i18n="nav_reminders">提醒</a>
        <div class="site-nav-more" data-member-area>
          <span class="site-nav-item" data-member-name hidden>會員</span>
          <button class="site-nav-more-btn" type="button" data-member-toggle
                  aria-haspopup="true" aria-expanded="false" data-ma-i18n="ma_login" hidden>登入</button>
          <button class="site-nav-more-btn" type="button" data-member-logout
                  data-ma-i18n="ma_logout" hidden>登出</button>
          <div class="site-nav-menu" data-member-menu hidden>
            <a data-ma-line href="/api/v1/auth/line/start" data-ma-i18n="ma_line">使用 LINE 登入</a>
            <a data-ma-google href="/api/v1/auth/google/start" data-ma-i18n="ma_google">使用 Google 登入</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="filter-shell">
    <div class="filter-toolbar">
      <div class="control-strip" id="control-strip">
        <select id="country-select" onchange="switchRegion(this.value)" class="control-dropdown country-dropdown" data-i18n-aria-label="country_aria" aria-label="國家／區域">
          <option value="tw" selected data-i18n="opt_tw">🇹🇼 台灣</option>
          <option value="jp" data-i18n="opt_jp">🇯🇵 日本</option>
          <option value="us" data-i18n="opt_us">🇺🇸 美國</option>
        </select>
        <select id="lang-select" onchange="switchLanguage(this.value)" class="control-dropdown lang-dropdown">
          <option value="zh-TW" selected data-i18n="lang_opt_zh">🌐 繁體中文</option>
          <option value="en" data-i18n="lang_opt_en">🌐 English</option>
          <option value="ja" data-i18n="lang_opt_ja">🌐 日語</option>
        </select>
        <select id="temp-unit-select" onchange="switchTempUnit(this.value)" class="control-dropdown lang-dropdown" data-i18n-aria-label="temp_unit_aria" aria-label="溫度單位">
          <option value="C">🌡 °C</option>
          <option value="F">🌡 °F</option>
        </select>
        <div class="updated" id="update-time">載入中...</div>
      </div>
      <div class="filter-row">
        <div class="sub-nav-bar" id="sub-nav"></div>
        <input id="place-search" class="place-search" type="search" autocomplete="off"
               placeholder="搜尋景點名稱…" oninput="setPlaceSearch(this.value)">
      </div>

      <div class="filter-toolbar-secondary">
        <!-- CL-UI-46: the CL-UI-45 horizontal day strip is replaced by a picker
             in the same form-control family as 「全部地區」/「排序」 — tap the
             trigger to open a bottom sheet (mobile) / dropdown (desktop). -->
        <div class="day-picker-wrap">
          <button type="button" class="day-picker-trigger" id="day-picker-trigger"
                  data-day="today" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="day-picker-panel">📅 今天</button>
          <button type="button" class="day-picker-overlay" id="day-picker-overlay" hidden aria-label="關閉日期選擇"></button>
          <div class="day-picker-panel" id="day-picker-panel" role="listbox" data-i18n-aria-label="day_picker_label" hidden></div>
        </div>
        <div id="admin-filter" class="admin-filter-host" hidden></div>
        <div class="sort-control">
          <label for="spot-sort" data-i18n="sort_label">排序</label>
          <select id="spot-sort" class="sort-select" onchange="setSortMode(this.value)">
            <option value="region" data-i18n="sort_region">地區順序</option>
            <option value="next_window" data-i18n="sort_next_window">最近可拍</option>
            <option value="hours_desc" data-i18n="sort_hours">符合時數：高到低</option>
            <option value="distance_near" data-i18n="sort_distance_near">距離：近到遠</option>
            <option value="distance_far" data-i18n="sort_distance_far">距離：遠到近</option>
          </select>
          <span id="sort-status" class="sort-status" aria-live="polite"></span>
        </div>
        <div class="discovery-row">
          <div class="discovery-title" id="discovery-title">📍 今天去哪裡拍？</div>
          <div class="rank-summary" id="filter-result-summary"></div>
        </div>
      </div>
      <!-- CL-UI-66: status-tier tabs (列表頂部) + horizontally scrollable
           subject chips (tabs 下方). Both are rendered by app.js; the hosts
           here only reserve the layout slots. -->
      <div id="tier-tabs" class="tier-tabs"></div>
      <div id="subject-chips" class="subject-chips"></div>
    </div>
  </div>

  <div id="loading" data-i18n="loading">正在獲取攝影氣象數據...</div>
  <div class="container" id="spots-container"></div>

  <div class="modal-overlay" id="place-modal-overlay" onclick="closePlaceModal(event)">
    <div class="modal place-guide-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="place-modal-spot-name">📍 景點攝影資訊</div>
        <button class="close-btn" onclick="closePlaceModal()" data-i18n-aria-label="close_place" aria-label="關閉景點攝影資訊">&times;</button>
      </div>
      <div class="modal-body" id="place-modal-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modal-spot-name">📍 景點氣象分析</div>
        <button class="close-btn" onclick="closeModal()" data-i18n-aria-label="close_weather" aria-label="關閉景點氣象分析">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-summary" id="modal-summary"></div>
        <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 10px;" data-i18n="modal_subtitle">
          ⏱️ 逐時拍攝條件：過去 24 小時 + 未來 72 小時（藍底＝所選日期中相對較佳的時段；仍需看整體評分與條件）
        </div>
        <div class="timeline-table-wrap" style="overflow-x: auto;">
          <table class="terminal-table">
            <thead id="timeline-head"></thead>
            <tbody id="timeline-body"></tbody>
          </table>
        </div>
        <div class="timeline-mobile" id="timeline-mobile"></div>
        <!-- CL-UI-34: user-visible data provenance for the spot's evaluation.
             Deep layer only (collapsed by default); the cards stay untouched. -->
        <details class="modal-provenance" id="modal-provenance" data-prov-open="false">
          <summary data-i18n="prov_title">資料來源</summary>
          <div class="modal-provenance-body" id="modal-provenance-body"></div>
        </details>
      </div>
    </div>
  </div>

  <script src="./assets/site-nav.js?v=clui41"></script>
  <script src="./assets/app.js?v=clui77"></script>
  <!-- CL-UI-52: guest comment entry — footer-level, tertiary, never competes
       with the card grid's visual focus (chaselights-product-design). -->
  <footer class="guest-comment-footer">
    <button type="button" class="guest-comment-entry" id="guest-comment-entry"
            data-gc-open data-gc-i18n="gc_entry" aria-haspopup="dialog" aria-controls="guest-comment-overlay">💬 留言</button>
  </footer>

  <div class="guest-comment-overlay" id="guest-comment-overlay" hidden>
    <div class="guest-comment-modal" role="dialog" aria-modal="true" aria-labelledby="gc-title">
      <div class="guest-comment-head">
        <div class="guest-comment-title" id="gc-title" data-gc-i18n="gc_title">💬 留言給站長</div>
        <button type="button" class="guest-comment-close" id="guest-comment-close" data-gc-i18n-aria-label="gc_close" aria-label="關閉留言">&times;</button>
      </div>
      <form id="guest-comment-form" novalidate>
        <input type="text" id="gc-hp" name="website" class="gc-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label for="gc-nickname" data-gc-i18n="gc_nickname">暱稱（可選）</label>
        <input type="text" id="gc-nickname" name="nickname" maxlength="20" autocomplete="off">
        <div class="gc-counter" id="gc-nickname-count"></div>
        <label for="gc-message" data-gc-i18n="gc_message">留言內容</label>
        <textarea id="gc-message" name="message" maxlength="500" rows="5" required></textarea>
        <div class="gc-counter" id="gc-message-count"></div>
        <div class="gc-status" id="gc-status" role="status" aria-live="polite"></div>
        <div class="guest-comment-actions">
          <button type="button" class="guest-comment-cancel" id="guest-comment-cancel" data-gc-i18n="gc_cancel">取消</button>
          <button type="submit" class="guest-comment-submit" id="guest-comment-submit" data-gc-i18n="gc_submit">送出留言</button>
        </div>
      </form>
    </div>
  </div>

  <link rel="stylesheet" href="./assets/guest-comment.css?v=gc01">
  <script src="./assets/guest-comment.js?v=gc01"></script>
  <script src="./assets/member-auth.js?v=clui68"></script>
<script src="./assets/reminders-client.js?v=clui75"></script>
  <script src="./assets/favorites-client.js?v=clui67"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "7a3bb8a3c6ee4fcc83d5e941e0ab291e"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
