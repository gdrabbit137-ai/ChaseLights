<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights — 攝影天氣預報</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }
    .updated { font-size: 0.85rem; color: var(--muted); }
    
    /* 地區按鈕樣式 */
    .nav-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: #475569;
    }
    .nav-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .spot-name { font-size: 1.2rem; font-weight: bold; }
    .score-badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .info-row { font-size: 0.9rem; color: var(--muted); margin: 4px 0; }
    .reason {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 0.95rem;
      color: #e2e8f0;
    }
    #loading { text-align: center; font-size: 1.2rem; color: var(--muted); margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>📸 ChaseLights</h1>
      <div class="updated" id="update-time">載入中...</div>
    </div>
    
    <!-- 地區切換按鈕（已整合阿拉斯加至美國） -->
    <div class="nav-bar">
      <button class="nav-btn active" onclick="switchRegion('tw', this)">🇹🇼 台灣</button>
      <button class="nav-btn" onclick="switchRegion('jp', this)">🇯🇵 日本</button>
      <button class="nav-btn" onclick="switchRegion('us', this)">🇺🇸 美國</button>
    </div>
  </header>

  <div id="loading">正在獲取攝影氣象數據...</div>
  <div class="container" id="spots-container"></div>

  <script>
    // 各地區對應的 JSON 資料檔名 (整合 ak 至 us)
    const regionFiles = {
      'tw': './latest_weather.json',
      'jp': './japan_weather.json',
      'us': './usa_weather.json'
    };

    let currentRegion = 'tw';

    async function loadData(regionKey) {
      const container = document.getElementById('spots-container');
      const loading = document.getElementById('loading');
      
      loading.style.display = 'block';
      loading.innerText = '正在獲取最新攝影氣象數據...';
      container.innerHTML = '';

      const filePath = regionFiles[regionKey] || regionFiles['tw'];

      try {
        const res = await fetch(`${filePath}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        
        document.getElementById('update-time').innerText = `最後更新：${data.updated_at || '未提供'}`;
        loading.style.display = 'none';

        if (!data.spots || data.spots.length === 0) {
          container.innerHTML = '<p style="color: var(--muted);">目前該地區尚無景點分析資料</p>';
          return;
        }

        data.spots.forEach(spot => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <span class="spot-name">${spot.name}</span>
              <span class="score-badge">${spot.score}分</span>
            </div>
            <div class="info-row">⏱️ 最佳時段：${spot.best_time || 'N/A'}</div>
            <div class="info-row">📍 雲層結構：${spot.position || '無'}</div>
            <div class="reason">💡 ${spot.reason}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        loading.innerText = `⚠️ 尚未找到該地區的氣象資料檔 (${filePath.replace('./', '')})`;
        console.warn(`無法讀取 ${filePath}:`, err);
      }
    }

    function switchRegion(regionKey, btnElement) {
      currentRegion = regionKey;
      
      // 切換按鈕高亮狀態
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      loadData(regionKey);
    }

    // 預設載入台灣資料
    loadData('tw');
  </script>
</body>
</html>
