<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights — 攝影題材條件評估</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./assets/site-nav.css?v=clui117">
  <link rel="stylesheet" href="./assets/app.css?v=clui141">
  <style>
    /* CL-UI-93 (mockup-first Stage 3c): 題材評估頁版面重做，規格
       data/v2/audits/design-mockups/mockup-genre-eval.html（DESIGN-3
       3d455f121）逐字實作；樣式全部引用已上線 --cl-* token
       （app.css :root，CL-UI-85），本頁不重定義任何數值。 */
    .genre-shell{max-width:1100px;margin:0 auto;padding:var(--cl-sp-5) var(--cl-sp-5) 64px}
    .genre-eval-header{max-width:1100px;margin:0 auto;padding:0}
    .title-row{display:flex;align-items:baseline;gap:var(--cl-sp-3);margin:var(--cl-sp-5) 0 var(--cl-sp-2)}
    .title-row h1{font-size:var(--cl-fs-20);font-weight:600;margin:0}
    .title-row .count{margin-left:auto;font-size:var(--cl-fs-13);color:var(--cl-text-3)}
    .control-strip{display:flex;gap:var(--cl-sp-2);align-items:center;flex-wrap:wrap}
    .control-strip select.sel,.control-strip input.sel{height:var(--cl-control-h)}
    .control-strip #eval-search{flex:1;min-width:180px}
    .control-strip .updated{font-size:var(--cl-fs-12);color:var(--cl-text-3);white-space:nowrap}
    /* 日期列：8 日橫捲、選中日自動置中（mockup scroll-snap 節奏） */
    .eval-date-panel{margin-bottom:var(--cl-sp-4)}
    .date-row{display:flex;gap:var(--cl-sp-2);overflow-x:auto;scroll-snap-type:x proximity;padding:var(--cl-sp-3) 0 2px;
      scrollbar-width:none;mask-image:linear-gradient(90deg,var(--cl-ink) calc(100% - 24px),transparent)}
    .date-row::-webkit-scrollbar{height:0}
    .date-row .date-pill{min-width:132px;height:44px;scroll-snap-align:center}
    /* 總覽：符合度 tabs＋逐題材 8 日格 */
    .sum-tabs{display:flex;gap:var(--cl-sp-2);margin-bottom:var(--cl-sp-3);flex-wrap:wrap}
    .tab.t-unk.sel{border-color:var(--cl-border-strong);color:var(--cl-grey-text)}
    .tab.t-unk.sel .n{color:var(--cl-grey-text)}
    .g-row{border:1px solid var(--cl-border);border-radius:var(--cl-r-sm);background:var(--cl-bg-1);
      margin-bottom:var(--cl-sp-2);overflow:hidden}
    .g-row.sel{border-color:var(--cl-border-strong)}
    .g-head{display:flex;align-items:center;gap:var(--cl-sp-2);padding:var(--cl-sp-2) var(--cl-sp-3);cursor:pointer;min-width:0}
    .g-head:hover{background:var(--cl-bg-2)}
    .g-head .g-name{font-size:var(--cl-fs-14);font-weight:600;flex:none;color:var(--cl-text-1)}
    .g-head .g-day{font-family:var(--cl-mono);font-size:var(--cl-fs-12);color:var(--cl-text-2);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .g-head .grow{flex:1;min-width:0}
    /* 迷你 8 日格：直接可讀文字（owner annotated ruling） */
    .mini-days{display:flex;gap:2px;flex:none}
    .mday{width:64px;min-height:44px;border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);background:var(--cl-bg-2);
      padding:3px 4px;display:flex;flex-direction:column;gap:1px;cursor:pointer;text-align:center;justify-content:center}
    .mday .md-d{font-size:10px;color:var(--cl-text-3);font-family:var(--cl-mono)}
    .mday .md-f{font-size:11px;font-weight:600;line-height:1.2;color:var(--cl-text-2)}
    .mday.ok{background:var(--cl-green-bg);border-color:var(--cl-green-border)}
    .mday.ok .md-f{color:var(--cl-green-text)}
    .mday.bad{background:var(--cl-red-bg);border-color:var(--cl-red-border)}
    .mday.bad .md-f{color:var(--cl-red-text)}
    .mday.unk{background:var(--cl-grey-bg)}
    .mday.unk .md-f{color:var(--cl-grey-text)}
    .mday.cur{outline:2px solid var(--cl-text-2);outline-offset:-1px}
    /* 展開的條件明細（沿用 live-table 語義：v-pass 綠 / v-fail 紅 / v-unk 黃） */
    .g-body{display:none;border-top:1px solid var(--cl-border);padding:var(--cl-sp-3)}
    .g-row.open .g-body{display:block}
    .cond-table{width:100%;border-collapse:collapse;font-size:var(--cl-fs-12)}
    .cond-table th{text-align:left;color:var(--cl-text-3);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--cl-border)}
    .cond-table td{padding:5px 8px;border-top:1px solid var(--cl-border);color:var(--cl-text-2);vertical-align:top}
    .v-pass{color:var(--cl-green-text)}
    .v-fail{color:var(--cl-red-text)}
    .v-unk{color:var(--cl-amber-text)}
    .mono{font-family:var(--cl-mono)}
    /* 資料不足必點名（hours-absurdity sweep） */
    .unk-note{font-size:var(--cl-fs-12);color:var(--cl-grey-text);padding:6px 8px;margin:0}
    .eval-muted{color:var(--cl-text-3);font-size:var(--cl-fs-13);padding:var(--cl-sp-3) 0;margin:0}
    /* 390 節奏：8 日迷你格單行橫捲＋fade；控制列換行 */
    @media (max-width:640px){
      .genre-shell{padding:var(--cl-sp-4) 0 64px}
      .mini-days{width:100%;overflow-x:auto;scrollbar-width:none;
        mask-image:linear-gradient(90deg,var(--cl-ink) calc(100% - 16px),transparent)}
      .mini-days::-webkit-scrollbar{height:0}
      .g-head{flex-wrap:wrap}
      .g-head .g-day{flex-basis:100%;order:3}
      .title-row .count{flex-basis:100%;order:3}
    }
  </style>
</head>
<body>

          <button class="site-nav-more-btn" type="button" data-member-logout

  <header class="genre-eval-header">
    <div class="title-row">
      <h1>🌗 <span id="page-title">攝影題材條件評估</span></h1>
      <span class="count" id="eval-meta"></span>
    </div>
    <div class="control-strip">
      <select id="region-select" class="control-dropdown country-dropdown sel" aria-label="region">
        <option value="tw" selected>🇹🇼 台灣</option>
        <option value="jp">🇯🇵 日本</option>

  <div class="genre-shell">
    <div id="eval-loading" style="text-align:center;padding:40px"></div>
    <!-- 日期列：8 日 pills，today 自動置中 -->

    <!-- 總覽：符合度 tabs＋逐題材 8 日格（選中日同步） -->
