name: Field Snapshot Matrix Replay

on:
  pull_request:
    branches:
      - main
    paths:
      - "field_snapshot.py"
      - "field_snapshot_baselines_r4_2.json"
      - "test_fixtures/field_snapshot/*"
      - ".github/workflows/test_field_snapshot_matrix.yml"
  push:
    branches:
      - main
    paths:
      - "field_snapshot.py"
      - "field_snapshot_baselines_r4_2.json"
      - "test_fixtures/field_snapshot/*"
      - ".github/workflows/test_field_snapshot_matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile snapshot tool
        run: python -m py_compile field_snapshot.py

      - name: Replay all registered baselines across original and current commits
        run: |
          mkdir -p field-snapshot-matrix
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          registry = json.load(
              open("field_snapshot_baselines_r4_2.json", encoding="utf-8")
          )
          summaries = []
          for baseline in registry["baselines"]:
              snapshot_id = baseline["snapshot_id"]
              archive = baseline["archive_path"]
              output = Path("field-snapshot-matrix") / f"{snapshot_id}.json"
              with output.open("w", encoding="utf-8") as handle:
                  subprocess.run(
                      [
                          sys.executable,
                          "field_snapshot.py",
                          "matrix",
                          archive,
                          "--commits",
                          "original",
                          "current",
                      ],
                      check=True,
                      stdout=handle,
                      text=True,
                  )
              payload = json.load(output.open(encoding="utf-8"))
              rows = payload["rows"]
              if len(rows) != 2:
                  raise AssertionError(f"{snapshot_id}: expected two matrix rows")
              original, current = rows
              if original["target_commit"] != baseline["model_commit"]:
                  raise AssertionError(
                      f"{snapshot_id}: original commit mismatch "
                      f"{original['target_commit']} != {baseline['model_commit']}"
                  )
              if original["match_recorded"] is not True:
                  raise AssertionError(
                      f"{snapshot_id}: original replay no longer matches recorded output"
                  )
              if original["different_opportunity_ids"]:
                  raise AssertionError(
                      f"{snapshot_id}: original replay has unexpected differences "
                      f"{original['different_opportunity_ids']}"
                  )
              head = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()
              if current["target_commit"] != head:
                  raise AssertionError(
                      f"{snapshot_id}: current replay commit mismatch "
                      f"{current['target_commit']} != {head}"
                  )
              if not original["comparison"] or not current["comparison"]:
                  raise AssertionError(
                      f"{snapshot_id}: replay comparison must not be empty"
                  )
              summaries.append(
                  {
                      "snapshot_id": snapshot_id,
                      "forecast_local_time": baseline["forecast_local_time"],
                      "original_commit": original["target_commit"],
                      "original_match_recorded": original["match_recorded"],
                      "current_commit": current["target_commit"],
                      "current_match_recorded": current["match_recorded"],
                      "current_differences": current["different_opportunity_ids"],
                  }
              )

          Path("field-snapshot-matrix/summary.json").write_text(
              json.dumps(
                  {
                      "baseline_count": len(summaries),
                      "baselines": summaries,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summaries, indent=2))
          PY

      - name: Upload replay matrices
        uses: actions/upload-artifact@v4
        with:
          name: field-snapshot-matrix
          path: field-snapshot-matrix/
          if-no-files-found: error
