name: B32 Japan Candidate Weather QA

on:
  push:
    branches:
      - r4.2-b32-jp-research-batch01
    paths:
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - ".github/workflows/b32_jp_candidate_weather.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b32-japan-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout B32 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate live Shinhotaka provider parser
        run: |
          python - <<'PY'
          import json
          from shinhotaka_access import fetch_shinhotaka_homepage_status

          state = fetch_shinhotaka_homepage_status(timeout=15, attempts=3)
          public = {
              "parse_ok": state.get("parse_ok"),
              "no1_status": state.get("no1_status"),
              "no2_status": state.get("no2_status"),
              "visible_update_text": state.get("visible_update_text"),
              "source_url": state.get("source_url"),
              "provider_reason": state.get("provider_reason"),
          }
          print(json.dumps(public, ensure_ascii=False, indent=2))
          assert state.get("authoritative") is True, state
          if state.get("parse_ok"):
              assert state.get("checked_at_epoch") is not None, public
              assert state.get("no1_status") in {"open", "closed", "restricted"}, public
              assert state.get("no2_status") in {"open", "closed", "restricted"}, public
          else:
              # External-site/network failure must remain fail-closed rather than
              # turning a transient provider outage into a false-open state or a
              # release-blocking parser regression.
              assert state.get("checked_at_epoch") is None, public
              assert state.get("no1_status") == "unknown", public
              assert state.get("no2_status") == "unknown", public
              assert str(state.get("provider_reason") or "").startswith("fetch_failed:"), public
          PY

      - name: Validate live Yahiko provider parser
        run: |
          python - <<'PY'
          import json
          from yahiko_access import fetch_yahiko_homepage_status

          state = fetch_yahiko_homepage_status(timeout=15, attempts=3)
          public = {
              "parse_ok": state.get("parse_ok"),
              "status": state.get("status"),
              "first_ascent": state.get("first_ascent"),
              "last_ascent": state.get("last_ascent"),
              "last_descent": state.get("last_descent"),
              "source_url": state.get("source_url"),
              "provider_reason": state.get("provider_reason"),
          }
          print(json.dumps(public, ensure_ascii=False, indent=2))
          assert state.get("authoritative") is True, state
          if state.get("parse_ok"):
              assert state.get("checked_at_epoch") is not None, public
              assert state.get("status") in {"open", "closed", "restricted"}, public
              assert state.get("first_ascent"), public
              assert state.get("last_descent"), public
          else:
              assert state.get("checked_at_epoch") is None, public
              assert state.get("status") == "unknown", public
              assert str(state.get("provider_reason") or "").startswith("fetch_failed:"), public
          PY

      - name: Generate Japan candidate weather
        run: python analyze_weather.py jp

      - name: Validate B32 Japan partial-migration contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("jp_weather.json").read_text(encoding="utf-8"))
          details = json.loads(Path("jp_weather_details.json").read_text(encoding="utf-8"))
          summary_spots = summary.get("spots") if isinstance(summary, dict) else summary
          detail_spots = details.get("spots") if isinstance(details, dict) else details

          assert len(summary_spots) == 35, len(summary_spots)
          assert len(detail_spots) == 35, len(detail_spots)
          assert len({s["spot_id"] for s in summary_spots}) == 35

          shard_dir = Path("weather_details") / "jp"
          shard_files = sorted(shard_dir.glob("jp-*.json"))
          assert len(shard_files) == 35, len(shard_files)

          researched = [s for s in summary_spots if s.get("opportunities")]
          pending = [s for s in summary_spots if not s.get("opportunities")]
          assert [s["spot_id"] for s in researched] == ["jp-001", "jp-002", "jp-003", "jp-004", "jp-005", "jp-006", "jp-007", "jp-008", "jp-009", "jp-010", "jp-011", "jp-012", "jp-013", "jp-014", "jp-015", "jp-016", "jp-017", "jp-018", "jp-019", "jp-020", "jp-021", "jp-022", "jp-023", "jp-024"], [s["spot_id"] for s in researched]
          assert len(pending) == 11

          expected_opportunities = {
              "jp-001": {"jp-001-P01"},
              "jp-002": {"jp-002-P01"},
              "jp-003": {"jp-003-P01"},
              "jp-004": {"jp-004-P01"},
              "jp-005": {"jp-005-P01", "jp-005-P02"},
              "jp-006": {"jp-006-P01"},
              "jp-007": {"jp-007-P01"},
              "jp-008": {"jp-008-P01"},
              "jp-009": {"jp-009-P01"},
              "jp-010": {"jp-010-P01", "jp-010-P02"},
              "jp-011": {"jp-011-P01", "jp-011-P02"},
              "jp-012": {"jp-012-P01"},
              "jp-013": {"jp-013-P01"},
              "jp-014": {"jp-014-P01"},
              "jp-015": {"jp-015-P01"},
              "jp-016": {"jp-016-P01", "jp-016-P02"},
              "jp-017": {"jp-017-P01"},
              "jp-018": {"jp-018-P01"},
              "jp-019": {"jp-019-P01"},
              "jp-020": {"jp-020-P01"},
              "jp-021": {"jp-021-P01", "jp-021-P02"},
              "jp-022": {"jp-022-P01", "jp-022-P02", "jp-022-P03"},
              "jp-023": {"jp-023-P01"},
              "jp-024": {"jp-024-P01"},
          }
          for spot in researched:
              assert spot.get("timezone") == "Asia/Tokyo", (spot["spot_id"], spot.get("timezone"))
              actual_ids = {o["opportunity_id"] for o in spot["opportunities"]}
              assert actual_ids == expected_opportunities[spot["spot_id"]], (spot["spot_id"], actual_ids)

              days = spot.get("daily") or []
              assert days
              for day in days:
                  winner = day.get("all") or {}
                  assert not winner.get("research_pending"), (spot["spot_id"], day.get("date"), winner)
                  assert isinstance(day.get("opportunities"), dict), (spot["spot_id"], day.get("date"), day.get("opportunities"))
                  if winner.get("no_viable_opportunity"):
                      assert day["opportunities"] == {}, (spot["spot_id"], day.get("date"), day["opportunities"])
                      assert winner.get("score") is None, (spot["spot_id"], day.get("date"), winner)
                      assert not winner.get("opportunity_id"), (spot["spot_id"], day.get("date"), winner)
                      continue
                  assert day["opportunities"], (spot["spot_id"], day.get("date"), winner)
                  assert set(day["opportunities"]) == expected_opportunities[spot["spot_id"]]
                  if spot["spot_id"] == "jp-001" and winner.get("score") is not None:
                      assert winner["score"] <= 35, winner
                      assert winner.get("condition_state") == "data_insufficient", winner
                  if spot["spot_id"] == "jp-002" and winner.get("score") is not None:
                      assert winner["score"] <= 64, winner
                      assert winner.get("condition_state") == "partial_runtime_contract", winner
                  if spot["spot_id"] == "jp-004" and winner.get("score") is not None:
                      assert winner["score"] <= 64, winner
                      assert winner.get("condition_state") == "partial_runtime_contract", winner
                  if spot["spot_id"] == "jp-014" and winner.get("score") is not None:
                      assert winner["score"] == 0, winner
                      assert winner.get("condition_state") == "hold", winner
                  if spot["spot_id"] == "jp-021" and winner.get("score") is not None:
                      assert winner.get("condition_state") != "partial_runtime_contract", winner
                      if winner["score"] >= 80:
                          assert winner.get("condition_state") == "dedicated_conditions_match", winner
                  if winner.get("score") is not None and winner["score"] >= 80:
                      assert spot["spot_id"] in {"jp-003", "jp-005", "jp-006", "jp-007", "jp-008", "jp-009", "jp-010", "jp-011", "jp-012", "jp-013", "jp-015", "jp-016", "jp-017", "jp-018", "jp-019", "jp-020", "jp-021", "jp-022", "jp-023", "jp-024"}, winner
                      if winner.get("opportunity_id") in {"jp-008-P01", "jp-010-P02", "jp-013-P01", "jp-019-P01", "jp-021-P01", "jp-021-P02", "jp-022-P01", "jp-022-P02", "jp-022-P03"}:
                          assert winner.get("condition_state") == "dedicated_conditions_match", winner
                      else:
                          assert winner.get("condition_state") == "minimum_sufficient_conditions_match", winner

          pending_errors = []
          for spot in pending:
              for day in spot.get("daily") or []:
                  winner = day.get("all") or {}
                  if winner.get("score") is not None:
                      pending_errors.append((spot["spot_id"], day.get("date"), "legacy_score_leak", winner.get("score")))
                  if not winner.get("research_pending"):
                      pending_errors.append((spot["spot_id"], day.get("date"), "missing_research_pending"))
          assert pending_errors == [], pending_errors[:20]

          detail_ids = {s["spot_id"] for s in detail_spots}
          assert detail_ids == {s["spot_id"] for s in summary_spots}

          report = {
              "summary_count": len(summary_spots),
              "details_count": len(detail_spots),
              "detail_shard_count": len(shard_files),
              "researched_place_ids": [s["spot_id"] for s in researched],
              "research_pending_count": len(pending),
              "researched_timezones": {spot["spot_id"]: spot.get("timezone") for spot in researched},
              "researched_opportunity_counts": {spot["spot_id"]: len(spot["opportunities"]) for spot in researched},
          }
          Path("b32_jp_candidate_validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload B32 Japan candidate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b32-japan-candidate-weather
          path: |
            jp_weather.json
            jp_weather_details.json
            b32_jp_candidate_validation.json
          retention-days: 7
