name: B117 GFS Multilayer POC

on:
  pull_request:
    branches:
      - main
    paths:
      - "gfs_multilayer_poc.py"
      - "test_gfs_multilayer_poc.py"
      - ".github/workflows/b117_gfs_multilayer_poc.yml"
      - "B117_GFS_MULTILAYER_WEATHERGRID.md"
      - "gfs_raw_poc.py"
  workflow_dispatch:
    inputs:
      forecast_hours:
        description: "Comma-separated GFS forecast hours to render"
        required: false
        default: "0,3,6,9,12"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run offline contract tests
        run: python -m unittest -v test_gfs_raw_poc.py test_gfs_multilayer_poc.py

  live-poc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install GFS WeatherGrid dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests xarray cfgrib eccodes numpy matplotlib cartopy

      - name: Fetch and render multi-layer WeatherGrid
        run: |
          python gfs_multilayer_poc.py             --forecast-hours "${{ inputs.forecast_hours }}"             --output-dir gfs_multilayer_output

      - name: Upload multi-layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfs-taiwan-multilayer-weathergrid
          path: gfs_multilayer_output/
          if-no-files-found: error
