name: B117 GFS Multilayer POC

on:
  pull_request:
    branches:
      - main
    paths:
      - "gfs_multilayer_poc.py"
      - "test_gfs_multilayer_poc.py"
      - ".github/workflows/b117_gfs_multilayer_poc.yml"
      - "B117_GFS_MULTILAYER_WEATHERGRID.md"
      - "gfs_raw_poc.py"
      - "weathergrid_browser_bundle.py"
      - "test_weathergrid_browser_bundle.py"
      - "B118_WEATHERGRID_BROWSER_BUNDLE.md"
      - "WEATHERGRID_COVERAGE_SPEC_R4_2.md"
      - "weathergrid_coverage.py"
      - "test_weathergrid_coverage.py"
      - "weathergrid_coverage_registry_r4_2.json"
      - "audit_weathergrid_coverage.py"
      - "B121_WEATHERGRID_COVERAGE_MIGRATION.md"
      - "build_weathergrid_coverage_browser.py"
      - "test_weathergrid_coverage_browser.py"
      - "weathergrid_coverage_sample.json"
      - "assets/weather-map.js"
      - "assets/weather-map.css"
      - "weather-map.html"
      - "B122_OPPORTUNITY_AWARE_WEATHERGRID_UI.md"
      - "weathergrid_fetch_plan.py"
      - "test_weathergrid_fetch_plan.py"
      - "B123_PROVIDER_AWARE_WEATHERGRID_FETCH.md"
      - "B127_QIXINGTAN_ALL_TOPIC_COVERAGE.md"
      - "B128_QINGSHUI_ALL_TOPIC_COVERAGE.md"
      - "B129_LOCAL_SUBJECT_COVERAGE.md"
      - "B130_WAIAO_GUEISHAN_COVERAGE.md"
      - "B131_LAOMEI_GREEN_REEF_COVERAGE.md"
      - "B133_DONGYIN_LIGHTHOUSE_COVERAGE.md"
      - "B134_DUOLIANG_WEATHERGRID_COVERAGE.md"
      - "B135_KUIBISHAN_WEATHERGRID_COVERAGE.md"
      - "B138_ZHAORI_HOT_SPRING_WEATHERGRID_COVERAGE.md"
      - "B139_DONGQING_BAY_WEATHERGRID_COVERAGE.md"
      - "B140_QINBI_VILLAGE_WEATHERGRID_COVERAGE.md"
      - "B141_JINSHA_VILLAGE_WEATHERGRID_COVERAGE.md"
      - "B142_DEYUE_TOWER_WEATHERGRID_COVERAGE.md"
      - "B144_WEATHERGRID_CARTOGRAPHIC_BASEMAP.md"
      - "test_weathergrid_basemap_contract.py"
      - "B146_WEATHERGRID_OVERLAY_READABILITY.md"
      - "test_weathergrid_overlay_readability.py"
      - "B148_WEATHERGRID_WIND_VECTORS.md"
      - "test_weathergrid_wind_vectors.py"
      - "B149_WEATHERGRID_WIND_VECTOR_PROOF.md"
      - "test_weathergrid_wind_vector_proof.py"
      - "weathergrid_model_resolver.py"
      - "test_weathergrid_model_resolver.py"
      - "icon_global_cloud_poc.py"
      - "test_icon_global_cloud_poc.py"
      - "icon_weathergrid_browser_bundle.py"
      - "test_weathergrid_icon_browser_contract.py"
      - "B150_ICON_GLOBAL_CLOUD_PRIMARY.md"
      - "cwa_wrf3_poc.py"
      - "cwa_weathergrid_browser_bundle.py"
      - "test_cwa_wrf3_poc.py"
      - "test_cwa_weathergrid_browser_bundle.py"
      - "test_cwa_weathergrid_ui.py"
      - "B151_CWA_WRF3_WEATHERGRID.md"
      - "B152_CWA_CLOUD_VERTICAL_DEFINITIONS.md"
      - "test_weathergrid_cloud_vertical_definitions.py"
      - "jma_msm_cloud_poc.py"
      - "jma_msm_aws_om.py"
      - "jma_msm_weathergrid_browser_bundle.py"
      - "test_jma_msm_cloud_poc.py"
      - "test_jma_msm_weathergrid_browser_bundle.py"
      - "test_jma_msm_weathergrid_ui.py"
      - "B153_JMA_MSM_CLOUD_WEATHERGRID.md"
      - ".github/workflows/update_jma_msm_weathergrid.yml"
      - "test_jma_msm_refresh_workflow.py"
      - ".github/workflows/update_weathergrid.yml"
      - "test_weathergrid_refresh_workflow.py"
      - "B132_WEATHERGRID_SCHEDULED_REFRESH.md"
  workflow_dispatch:
    inputs:
      forecast_hours:
        description: "Comma-separated GFS forecast hours to render"
        required: false
        default: "0,3,6,9,12"
      publish_preview:
        description: "Commit compact browser/QC JSON to the WeatherGrid preview"
        required: false
        type: boolean
        default: false
      coverage_scope:
        description: "GFS geographic scope"
        required: false
        type: choice
        options:
          - region
          - opportunity
          - place
        default: region
      coverage_id:
        description: "Opportunity/Place ID for a scoped request"
        required: false
        default: ""
      strict_coverage:
        description: "Fail instead of regional fallback when coverage is incomplete"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy requests

      - name: Run offline contract tests
        run: |
          python -m unittest -v \
            test_gfs_raw_poc.py \
            test_gfs_multilayer_poc.py \
            test_weathergrid_browser_bundle.py \
            test_weathergrid_coverage.py \
            test_weathergrid_coverage_browser.py \
            test_weathergrid_fetch_plan.py \
            test_weathergrid_refresh_workflow.py \
            test_weathergrid_basemap_contract.py \
            test_weathergrid_overlay_readability.py \
            test_weathergrid_wind_vectors.py \
            test_weathergrid_wind_vector_proof.py \
            test_weathergrid_model_resolver.py \
            test_icon_global_cloud_poc.py \
            test_weathergrid_icon_browser_contract.py \
            test_cwa_wrf3_poc.py \
            test_cwa_weathergrid_browser_bundle.py \
            test_cwa_weathergrid_ui.py \
            test_weathergrid_cloud_vertical_definitions.py \
            test_jma_msm_cloud_poc.py \
            test_jma_msm_weathergrid_browser_bundle.py \
            test_jma_msm_weathergrid_ui.py \
            test_jma_msm_refresh_workflow.py
          python audit_weathergrid_coverage.py

  cwa-live-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CWA WeatherGrid dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests boto3 scipy xarray cfgrib eccodes numpy

      - name: Fetch initial live CWA WRF 3 km window
        run: |
          python cwa_wrf3_poc.py \
            --forecast-hours "0,6,12" \
            --output-dir cwa_live_smoke_output

      - name: Inspect CWA cloud and pressure-level fields
        run: |
          python - <<'PY'
          import json
          import cfgrib

          for fh in (0, 6, 12):
              path = f"cwa_live_smoke_output/cwa_wrf3_f{fh:03d}.grb2"
              rows = []
              pressure_rh = []
              for ds in cfgrib.open_datasets(path, backend_kwargs={"indexpath": ""}):
                  for name, arr in ds.data_vars.items():
                      a = arr.attrs or {}
                      level_type = str(a.get("GRIB_typeOfLevel", ""))
                      level = a.get("GRIB_level")
                      long_name = str(a.get("long_name") or a.get("GRIB_name") or "")
                      short = str(a.get("GRIB_shortName", name))
                      units = a.get("units")
                      hay = " ".join([name, short, level_type, long_name]).lower()
                      row = {
                          "name": name,
                          "short": short,
                          "level_type": level_type,
                          "level": level,
                          "long_name": long_name,
                          "units": units,
                      }
                      if any(token in hay for token in (
                          "cloud", "cld", "lcdc", "mcdc", "hcdc", "tcdc",
                          "relative humidity", "rhum", "humidity"
                      )):
                          rows.append(row)
                      if (
                          short.lower() in {"r", "rh", "rhum"}
                          and "isobaric" in level_type.lower()
                      ):
                          pressure_rh.append(row)
              print(
                  f"CWA_CLOUD_FIELD_INVENTORY_F{fh:03d}=",
                  json.dumps(rows, ensure_ascii=False, sort_keys=True),
              )
              print(
                  f"CWA_PRESSURE_RH_INVENTORY_F{fh:03d}=",
                  json.dumps(pressure_rh, ensure_ascii=False, sort_keys=True),
              )
          PY

      - name: Build compact CWA browser bundle
        run: |
          python cwa_weathergrid_browser_bundle.py \
            --input-dir cwa_live_smoke_output
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("cwa_live_smoke_output")
          bundle = json.loads(
              (root / "cwa_wrf3_tw_weather_browser.json").read_text()
          )
          assert bundle["model"] == "CWA_WRF_3KM"
          assert bundle["provenance"]["native_resolution_km"] == 3.0
          assert len(bundle["frames"]) == 3, bundle["frames"]
          assert [x["forecast_hour"] for x in bundle["frames"]] == [0, 6, 12]
          assert "temperature_2m_c" in bundle["fields"], bundle["fields"]
          assert "relative_humidity_2m_percent" in bundle["fields"], bundle["fields"]
          assert "wind_speed_10m_m_s" in bundle["fields"], bundle["fields"]
          assert "shortwave_flux_w_m2" in bundle["fields"], bundle["fields"]
          print(json.dumps({
              "cycle": bundle["cycle"],
              "bbox": bundle["bbox"],
              "grid": [
                  bundle["grid"]["rows"], bundle["grid"]["cols"]
              ],
              "fields": list(bundle["fields"]),
          }, indent=2))
          PY

      - name: Upload CWA live-smoke browser outputs
        uses: actions/upload-artifact@v4
        with:
          name: cwa-wrf3-live-smoke
          path: |
            cwa_live_smoke_output/cwa_wrf3_tw_weather_browser.json
            cwa_live_smoke_output/cwa_wrf3_tw_weather_qc.json
          if-no-files-found: error
          retention-days: 3

  jma-live-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install JMA WeatherGrid dependency
        run: |
          python -m pip install --disable-pip-version-check \
            requests numpy "omfiles>=1.2,<2" fsspec s3fs

      - name: Fetch live JMA MSM cloud sample
        run: |
          python jma_msm_cloud_poc.py \
            --forecast-hours 4 \
            --leftlon 121.4375 \
            --rightlon 121.5625 \
            --bottomlat 24.95 \
            --toplat 25.05 \
            --output-dir jma_msm_live_smoke

      - name: Build compact JMA MSM browser bundle
        run: |
          python jma_msm_weathergrid_browser_bundle.py \
            --input-dir jma_msm_live_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("jma_msm_live_smoke")
          bundle = json.loads(
              (root / "jma_msm_tw_cloud_browser.json").read_text()
          )
          assert bundle["model"] == "JMA_MSM"
          assert bundle["provenance"]["native_resolution_km"] == 5.0
          assert bundle["provenance"]["native_time_interval_hours"] == 1
          assert len(bundle["frames"]) == 4, bundle["frames"]
          assert bundle["grid"]["rows"] == 3, bundle["grid"]
          assert bundle["grid"]["cols"] == 3, bundle["grid"]
          for field in (
              "total_cloud_percent",
              "low_cloud_percent",
              "mid_cloud_percent",
              "high_cloud_percent",
          ):
              assert field in bundle["fields"], bundle["fields"]
          for field in (
              "low_cloud_percent",
              "mid_cloud_percent",
              "high_cloud_percent",
          ):
              assert bundle["fields"][field]["vertical_definition"], field
          assert bundle["provenance"]["production_transport"] == "open_meteo_aws_open_data_om"
          assert bundle["provenance"]["cycle_timestamp_available"] is True
          assert bundle["provenance"]["forecast_hour_semantics"] == "hours_from_model_cycle"
          assert bundle["provenance"]["transport_bucket"] == "openmeteo"
          assert bundle["provenance"]["transport_layout"] == "data_spatial"
          assert bundle["provenance"]["transport_anonymous"] is True
          assert bundle["provenance"]["transport_api_key_required"] is False
          print(json.dumps({
              "frames": len(bundle["frames"]),
              "grid": [bundle["grid"]["rows"], bundle["grid"]["cols"]],
              "fields": list(bundle["fields"]),
              "bbox": bundle["bbox"],
          }, indent=2))
          PY

      - name: Upload JMA MSM live-smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: jma-msm-live-smoke
          path: |
            jma_msm_live_smoke/jma_msm_tw_cloud_browser.json
            jma_msm_live_smoke/jma_msm_tw_cloud_qc.json
          if-no-files-found: error
          retention-days: 3

  jma-regional-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify production-sized JMA native-grid plan
        run: |
          python jma_msm_cloud_poc.py \
            --forecast-hours 40 \
            --dry-run > /tmp/jma-plan.json
          python - <<'PY'
          import json
          plan = json.load(open("/tmp/jma-plan.json"))
          assert plan["grid"] == [64, 40], plan
          assert plan["points"] == 2560, plan
          assert plan["forecast_hours"] == 40, plan
          assert plan["native_cells"] == 2560, plan
          assert plan["transport"] == "open_meteo_aws_open_data_om", plan
          assert plan["fields"] == [
              "total_cloud_percent",
              "low_cloud_percent",
              "mid_cloud_percent",
              "high_cloud_percent",
          ], plan
          print(json.dumps(plan, indent=2))
          PY

  live-poc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install WeatherGrid dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo
          python -m pip install --upgrade pip
          python -m pip install requests boto3 scipy xarray netCDF4 cfgrib eccodes numpy matplotlib cartopy

      - name: Cache DWD ICON remap weights
        uses: actions/cache@v4
        with:
          path: .cache/dwd-icon-cdo
          key: dwd-icon-global-0125-cdo-v1

      - name: Validate publish mode
        run: |
          if [[ "${{ inputs.publish_preview }}" == "true" && "${{ inputs.coverage_scope }}" != "region" ]]; then
            echo "publish_preview=true is allowed only for the full regional snapshot."
            exit 1
          fi
          if [[ "${{ inputs.coverage_scope }}" != "region" && -z "${{ inputs.coverage_id }}" ]]; then
            echo "coverage_id is required for place/opportunity scope."
            exit 1
          fi

      - name: Fetch and render multi-layer WeatherGrid
        run: |
          args=(
            --forecast-hours "${{ inputs.forecast_hours }}"
            --output-dir gfs_multilayer_output
            --coverage-scope "${{ inputs.coverage_scope }}"
          )
          if [[ -n "${{ inputs.coverage_id }}" ]]; then
            args+=(--coverage-id "${{ inputs.coverage_id }}")
          fi
          if [[ "${{ inputs.strict_coverage }}" == "true" ]]; then
            args+=(--strict-coverage)
          fi
          python gfs_multilayer_poc.py "${args[@]}"

      - name: Build compact GFS browser bundle and QC
        run: |
          python weathergrid_browser_bundle.py \
            --input-dir gfs_multilayer_output

      - name: Fetch ICON Global cloud WeatherGrid
        if: inputs.coverage_scope == 'region'
        id: icon_cloud
        continue-on-error: true
        run: |
          python icon_global_cloud_poc.py \
            --forecast-hours "${{ inputs.forecast_hours }}" \
            --output-dir icon_cloud_output \
            --cdo-cache-dir .cache/dwd-icon-cdo

      - name: Build ICON cloud browser bundle and QC
        if: inputs.coverage_scope == 'region' && steps.icon_cloud.outcome == 'success'
        run: |
          python icon_weathergrid_browser_bundle.py \
            --input-dir icon_cloud_output

      - name: Fetch CWA WRF 3 km WeatherGrid
        if: inputs.coverage_scope == 'region'
        id: cwa_wrf3
        continue-on-error: true
        run: |
          python cwa_wrf3_poc.py \
            --forecast-hours "0,6,12" \
            --output-dir cwa_wrf3_output

      - name: Build CWA WRF 3 km browser bundle and QC
        if: inputs.coverage_scope == 'region' && steps.cwa_wrf3.outcome == 'success'
        run: |
          python cwa_weathergrid_browser_bundle.py \
            --input-dir cwa_wrf3_output

      - name: Fetch JMA MSM 5 km cloud WeatherGrid
        if: inputs.coverage_scope == 'region'
        id: jma_msm
        continue-on-error: true
        run: |
          python jma_msm_cloud_poc.py \
            --forecast-hours 40 \
            --batch-size 100 \
            --output-dir jma_msm_output

      - name: Build JMA MSM 5 km browser bundle and QC
        if: inputs.coverage_scope == 'region' && steps.jma_msm.outcome == 'success'
        run: |
          python jma_msm_weathergrid_browser_bundle.py \
            --input-dir jma_msm_output

      - name: Build subject-aware coverage browser bundle
        run: |
          python build_weathergrid_coverage_browser.py \
            --output gfs_multilayer_output/weathergrid_coverage_browser.json

      - name: Publish compact WeatherGrid preview snapshot
        if: inputs.publish_preview == true
        run: |
          mkdir -p weathergrid
          cp gfs_multilayer_output/gfs_tw_weather_browser.json weathergrid/gfs_tw_weather_browser.json
          cp gfs_multilayer_output/gfs_tw_weather_qc.json weathergrid/gfs_tw_weather_qc.json
          cp gfs_multilayer_output/weathergrid_coverage_browser.json weathergrid/weathergrid_coverage_browser.json
          if [[ -f icon_cloud_output/icon_tw_cloud_browser.json ]]; then
            cp icon_cloud_output/icon_tw_cloud_browser.json weathergrid/icon_tw_cloud_browser.json
            cp icon_cloud_output/icon_tw_cloud_qc.json weathergrid/icon_tw_cloud_qc.json
          else
            rm -f weathergrid/icon_tw_cloud_browser.json weathergrid/icon_tw_cloud_qc.json
          fi
          if [[ -f cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json ]]; then
            cp cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json weathergrid/cwa_wrf3_tw_weather_browser.json
            cp cwa_wrf3_output/cwa_wrf3_tw_weather_qc.json weathergrid/cwa_wrf3_tw_weather_qc.json
          else
            rm -f weathergrid/cwa_wrf3_tw_weather_browser.json weathergrid/cwa_wrf3_tw_weather_qc.json
          fi
          if [[ -f jma_msm_output/jma_msm_tw_cloud_browser.json ]]; then
            cp jma_msm_output/jma_msm_tw_cloud_browser.json weathergrid/jma_msm_tw_cloud_browser.json
            cp jma_msm_output/jma_msm_tw_cloud_qc.json weathergrid/jma_msm_tw_cloud_qc.json
          else
            rm -f weathergrid/jma_msm_tw_cloud_browser.json weathergrid/jma_msm_tw_cloud_qc.json
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A \
            weathergrid/gfs_tw_weather_browser.json \
            weathergrid/gfs_tw_weather_qc.json \
            weathergrid/weathergrid_coverage_browser.json \
            weathergrid/icon_tw_cloud_browser.json \
            weathergrid/icon_tw_cloud_qc.json \
            weathergrid/cwa_wrf3_tw_weather_browser.json \
            weathergrid/cwa_wrf3_tw_weather_qc.json \
            weathergrid/jma_msm_tw_cloud_browser.json \
            weathergrid/jma_msm_tw_cloud_qc.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WeatherGrid preview snapshot [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          else
            echo "WeatherGrid preview snapshot unchanged."
          fi

      - name: Upload multi-layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-provider-aware-weathergrid
          path: |
            gfs_multilayer_output/
            icon_cloud_output/
            cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json
            cwa_wrf3_output/cwa_wrf3_tw_weather_qc.json
            jma_msm_output/jma_msm_tw_cloud_browser.json
            jma_msm_output/jma_msm_tw_cloud_qc.json
          if-no-files-found: error
