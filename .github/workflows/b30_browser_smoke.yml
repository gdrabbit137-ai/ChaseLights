              hagi_nav = hagi_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert hagi_nav.get_attribute("data-navigation-mode") == "verified"
              hagi_href = hagi_nav.get_attribute("href")
              hagi_url = urlparse(hagi_href)
              assert "/maps/dir/" in hagi_url.path, hagi_href
              assert parse_qs(hagi_url.query).get("destination") == ["34.4119363,131.3932271"], hagi_href
              assert "菊屋" not in hagi_href

              pending_jp_cards = [c for c in jp_cards if not any(name in c.text for name in researched_names)]
              assert len(pending_jp_cards) == 0
              pending_jp_scores = [c.find_element(By.CSS_SELECTOR, ".score-badge").text.strip() for c in pending_jp_cards]
              assert all(x in {"", "—"} for x in pending_jp_scores), pending_jp_scores[:20]
              assert all("攝影研究待補" in c.text for c in pending_jp_cards), "non-migrated Japan card leaked legacy scoring"

              driver.execute_script("document.getElementById('spots-container').innerHTML = ''")
              Select(driver.find_element(By.ID, "country-select")).select_by_value("us")
              wait.until(lambda d: d.execute_script("return currentRegion === 'us' && currentSpots.length > 0 && String(currentSpots[0].spot_id || '').startsWith('us-')"))
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, "#spots-container .card")) > 0)
              driver.execute_script("document.querySelectorAll('.deferred-group').forEach(x => x.open = true)")
              us_cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              report["us_cards"] = len(us_cards)
              assert len(us_cards) == 70, len(us_cards)
              researched_us_names = {"大峽谷國家公園", "馬蹄灣", "羚羊峽谷", "紀念碑谷", "拱門國家公園", "布萊斯峽谷國家公園", "錫安國家公園", "優勝美地半圓頂", "優勝美地隧道觀景臺", "黃石國家公園 大稜鏡溫泉", "大提頓國家公園", "雷尼爾山國家公園", "火山口湖國家公園", "死亡谷國家公園", "舊金山金門大橋", "拉斯維加斯大道", "聖海倫斯火山", "冰川國家公園", "奧林匹克國家公園", "紅木國家公園", "峽谷地國家公園 梅薩拱門", "約書亞樹國家公園", "巨人柱國家公園", "西雅圖太空針塔", "聖莫尼卡碼頭", "西雅圖派克市場", "鋸齒山脈", "洛杉磯格里斐斯天文台", "白沙國家公園", "芝加哥天際線", "落磯山國家公園", "紐奧良法國區", "丹佛天際線", "聖路易斯大拱門", "沃斯堡牲畜市場", "紐約曼哈頓天際線", "尼加拉瀑布", "大霧山國家公園", "邁阿密海灘", "波士頓天際線", "迪納利國家公園", "費爾班克斯極光", "珍娜溫泉", "安克拉治", "蘇華德", "哈徹山口", "馬塔努斯卡冰河", "波蒂奇冰河", "瓦爾迪茲", "朱諾", "門登霍爾冰河", "荷馬沙嘴", "凱奇侃", "史卡威", "威朗格利-聖埃利亞斯國家公園", "布魯克斯山脈", "北極圈地標", "諾姆", "卡特邁國家公園", "冰河灣國家公園", "柯迪亞克島", "埃克盧特納湖", "塔爾基特納", "艾利耶斯卡", "楚加奇州立公園", "白令陸橋國家保護區", "育空河", "諾阿塔克河", "克拉克湖國家公園", "獨立礦山"}
              researched_us_cards = [c for c in us_cards if any(name in c.text for name in researched_us_names)]
              assert len(researched_us_cards) == 70, [c.text for c in researched_us_cards]
              assert all("攝影研究待補" not in c.text for c in researched_us_cards), [c.text for c in researched_us_cards]
              pending_us_cards = [c for c in us_cards if not any(name in c.text for name in researched_us_names)]
              assert len(pending_us_cards) == 0
              pending_us_scores = [c.find_element(By.CSS_SELECTOR, ".score-badge").text.strip() for c in pending_us_cards]
              assert all(x in {"", "—"} for x in pending_us_scores), pending_us_scores[:20]
              assert all("攝影研究待補" in c.text for c in pending_us_cards), "non-migrated US card leaked legacy scoring"

              favorite_migration = driver.execute_script("""
                const spot = currentSpots[0];
                const names = [...Object.values(spot.name_i18n || {}), spot.name_local].filter(Boolean);
                const legacyName = names[0];
                const unresolved = '__chaselights_unmatched_legacy_probe__';
                favorites = [];
                legacyFavorites = [legacyName, unresolved];
                favoriteMigrationRegions = [];
                localStorage.removeItem('chaselights_favs_v2');
                localStorage.setItem('chaselights_favs', JSON.stringify(legacyFavorites));
                localStorage.removeItem(FAVORITE_MIGRATION_KEY);

                migrateFavorites(currentRegion);
                const first = {
                  region: currentRegion,
                  migrated: [...favorites],
                  legacy: [...legacyFavorites],
                  sentinels: [...favoriteMigrationRegions]
                };
                migrateFavorites(currentRegion);
                const second = {
                  migrated: [...favorites],
                  legacy: [...legacyFavorites],
                  sentinels: [...favoriteMigrationRegions]
                };

                localStorage.removeItem('chaselights_favs_v2');
                localStorage.removeItem('chaselights_favs');
                localStorage.removeItem(FAVORITE_MIGRATION_KEY);
                favorites = [];
                legacyFavorites = [];
                favoriteMigrationRegions = [];
                return {spotId: spot.spot_id, unresolved, first, second};
              """)
              report["favorite_migration_sentinel"] = favorite_migration
              assert favorite_migration["spotId"] in favorite_migration["first"]["migrated"], favorite_migration
              assert favorite_migration["first"]["legacy"] == [favorite_migration["unresolved"]], favorite_migration
              assert favorite_migration["first"]["region"] in favorite_migration["first"]["sentinels"], favorite_migration
              assert favorite_migration["second"]["migrated"] == favorite_migration["first"]["migrated"], favorite_migration
              assert favorite_migration["second"]["legacy"] == favorite_migration["first"]["legacy"], favorite_migration
              assert favorite_migration["second"]["sentinels"] == favorite_migration["first"]["sentinels"], favorite_migration

              # B119 WeatherGrid preview: the PR does not publish live data,
              # so the page must gracefully load its explicit demo fixture.
              driver.get("http://127.0.0.1:8000/weather-map.html")
              wait.until(lambda d: d.execute_script("return window.__weatherGridPreviewReady === true"))
              weather_preview = driver.execute_script("""
                return {
                  source: document.getElementById('source-state').textContent,
                  layers: [...document.querySelectorAll('#layer-select option')].map(x => x.value),
                  frames: Number(document.getElementById('time-slider').max) + 1,
                  spots: document.querySelectorAll('#spot-select option').length - 1,
                  canvasWidth: document.getElementById('weather-canvas').width,
                  canvasHeight: document.getElementById('weather-canvas').height
                };
              """)
              report["weathergrid_preview"] = weather_preview
              assert "DEMO" in weather_preview["source"], weather_preview
              assert "low_cloud_percent" in weather_preview["layers"], weather_preview
              assert "visibility_km" in weather_preview["layers"], weather_preview
              assert "wind_direction_10m_deg" in weather_preview["layers"], weather_preview
              assert weather_preview["frames"] == 3, weather_preview
              assert weather_preview["spots"] == 4, weather_preview
              assert weather_preview["canvasWidth"] > 0 and weather_preview["canvasHeight"] > 0, weather_preview

              Select(driver.find_element(By.ID, "layer-select")).select_by_value("visibility_km")
              slider = driver.find_element(By.ID, "time-slider")
              driver.execute_script("arguments[0].value='2'; arguments[0].dispatchEvent(new Event('input',{bubbles:true}));", slider)
              Select(driver.find_element(By.ID, "spot-select")).select_by_value("demo-hualien")
              opportunity_select = Select(driver.find_element(By.ID, "opportunity-select"))
              assert len(opportunity_select.options) == 3, [x.text for x in opportunity_select.options]
              opportunity_select.select_by_value("demo-hualien-P01")
              wait.until(lambda d: d.execute_script(
                  "return window.__weatherGridCoverageDebug && window.__weatherGridCoverageDebug.opportunityId === 'demo-hualien-P01'"
              ))
              weather_interaction = driver.execute_script("""
                return {
                  layer: document.getElementById('layer-select').value,
                  frame: document.getElementById('time-slider').value,
                  spot: document.getElementById('spot-select').value,
                  opportunity: document.getElementById('opportunity-select').value,
                  spotName: document.getElementById('spot-name').textContent,
                  spotValue: document.getElementById('spot-value').textContent,
                  coverageText: document.getElementById('coverage-status').textContent,
                  debug: window.__weatherGridCoverageDebug,
                  ready: window.__weatherGridPreviewReady
                };
              """)
              report["weathergrid_interaction"] = weather_interaction
              assert weather_interaction["layer"] == "visibility_km", weather_interaction
              assert weather_interaction["frame"] == "2", weather_interaction
              assert weather_interaction["spot"] == "demo-hualien", weather_interaction
              assert weather_interaction["opportunity"] == "demo-hualien-P01", weather_interaction
              assert "花蓮" in weather_interaction["spotName"], weather_interaction
              assert "km" in weather_interaction["spotValue"], weather_interaction
              assert "provisional" in weather_interaction["coverageText"], weather_interaction
              assert weather_interaction["debug"]["coverageSource"] == "demo", weather_interaction
              assert weather_interaction["debug"]["view"]["toplat"] <= 24.31, weather_interaction
              assert weather_interaction["debug"]["view"]["bottomlat"] >= 23.92, weather_interaction
              assert weather_interaction["ready"] is True, weather_interaction

              opportunity_select.select_by_value("demo-hualien-P02")
              wait.until(lambda d: "needs research" in d.find_element(By.ID, "coverage-status").text.lower())
              pending_coverage = driver.find_element(By.ID, "coverage-status").text
              report["weathergrid_pending_coverage"] = pending_coverage
              assert "coverage requires subject or environment geometry" in pending_coverage, pending_coverage

              driver.get("http://127.0.0.1:8000/index.html")
              # Region selection is persisted by the main app. Earlier smoke steps
              # intentionally switch to US, so a reload must not assume Taiwan.
              wait.until(lambda d: d.execute_script(
                  "return currentData && currentSpots && currentSpots.length > 0"
              ))
              weather_link = driver.find_element(By.CSS_SELECTOR, ".header-right .weather-map-link")
              assert weather_link.get_attribute("href").endswith("/weather-map.html"), weather_link.get_attribute("href")

              print(json.dumps(report, ensure_ascii=False, indent=2))
          finally:
              driver.quit()
