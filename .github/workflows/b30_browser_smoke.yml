name: B30 Browser Smoke
# B35 rerun after catalog count and B34 ID collision fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/app.css"
      - "weather-map.html"
      - "assets/weather-map.js"
      - "assets/weather-map.css"
      - "weathergrid_sample.json"
      - "weathergrid_coverage_sample.json"
      - "weathergrid_coverage_registry_r4_2.json"
      - "build_weathergrid_coverage_browser.py"
      - "regions.py"
      - "ci_weather_impact.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "runtime_catalog_manifest_r4_2.json"
      - "runtime_catalog_v004_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_event_calendar_r4_2.json"
      - "runtime_dependencies.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "johnston_ridge_access.py"
      - "denali_access.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "aurora_state.py"
      - "taxonomy_v004.py"
      - ".github/workflows/b30_browser_smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: b30-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Detect impacted weather regions
        id: weather_regions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ci_weather_impact.py

      - name: Generate impacted PR weather
        if: github.event_name == 'pull_request' && steps.weather_regions.outputs.regenerate == 'true'
        run: |
          for region in ${{ steps.weather_regions.outputs.regions }}; do
            python analyze_weather.py "$region"
          done

      - name: Generate all weather for manual runs
        if: github.event_name != 'pull_request'
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp
          python analyze_weather.py us

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run browser smoke
        run: |
          # A published LIVE WeatherGrid snapshot is now part of main. Validate
          # that artifact first, then temporarily hide it so the browser smoke
          # can deterministically exercise the DEMO fallback contract as well.
          if [ -f weathergrid/gfs_tw_weather_browser.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("weathergrid/gfs_tw_weather_browser.json").read_text(encoding="utf-8"))
          assert live.get("provider") == "NOAA/NCEP NOMADS", live.get("provider")
          assert live.get("model") == "GFS", live.get("model")
          assert len(live.get("frames") or []) > 0, "LIVE WeatherGrid has no frames"
          assert len(live.get("spots") or []) > 0, "LIVE WeatherGrid has no spots"
          required = {"low_cloud_percent", "visibility_km", "wind_direction_10m_deg"}
          assert required.issubset(set((live.get("fields") or {}).keys())), live.get("fields")
          print(json.dumps({
              "live_weathergrid_frames": len(live["frames"]),
              "live_weathergrid_spots": len(live["spots"]),
              "live_weathergrid_fields": sorted(live["fields"].keys()),
          }, ensure_ascii=False))
          PY
            mkdir -p /tmp/chaselights-live-weathergrid
            for f in               weathergrid/gfs_tw_weather_browser.json               weathergrid/gfs_tw_weather_qc.json               weathergrid/weathergrid_coverage_browser.json; do
              if [ -f "$f" ]; then
                mv "$f" /tmp/chaselights-live-weathergrid/
              fi
            done
          fi

          python -m http.server 8000 --bind 127.0.0.1 >/tmp/chaselights-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT

          server_ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              server_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::local HTTP server exited before becoming ready"
              cat /tmp/chaselights-http.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$server_ready" -ne 1 ]; then
            echo "::error::local HTTP server did not become ready"
            cat /tmp/chaselights-http.log || true
            exit 1
          fi

          python - <<'PY'
          import json
          from urllib.parse import urlparse, parse_qs
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.common.exceptions import TimeoutException

          opts = webdriver.ChromeOptions()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")
          opts.set_capability("goog:loggingPrefs", {"browser": "ALL"})

          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 30)
          report = {}

          try:
              # Last Updated must follow the user's device/browser timezone,
              # independently from each Place's local shooting-time timezone.
              driver.execute_cdp_cmd("Emulation.setTimezoneOverride", {"timezoneId": "America/Los_Angeles"})
              driver.get("http://127.0.0.1:8000/index.html")

              wait.until(lambda d: d.execute_script(
                  "return currentData && currentRegion === 'tw' && currentSpots.length === 83"
              ))
              cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              report["initial_day_empty"] = not bool(cards)
              if not cards:
                  empty_states = driver.find_elements(By.CSS_SELECTOR, "#spots-container .empty-state")
                  assert empty_states, "loaded 83 Taiwan spots but neither cards nor empty-state rendered"
                  driver.execute_script("switchDay('tomorrow')")
                  cards = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, "#spots-container .card"))
              report["validated_day_filter"] = driver.execute_script("return currentDayFilter")
              report["taiwan_rendered_cards"] = len(cards)
              assert len(cards) == 83, f"expected 83 Taiwan cards on a forecast day, got {len(cards)}"

              # B136/B107: UI verdicts are subject-aware rather than generic
              # Place-level engineering copy. Candidate/low-confidence states
              # remain explicitly probabilistic.
              verdict_contract = driver.execute_script("""
                return {
                  suitable: opportunityVerdict(
                    {status_key:'OPPORTUNITY_SIMPLE_MATCH', score_confidence:'high', theme:'mountain_view'},
                    '山景'
                  ).primary,
                  chance: opportunityVerdict(
                    {status_key:'OPPORTUNITY_MIST_CANDIDATE', score_confidence:'low', theme:'fog_mist'},
                    '晨霧'
                  ).primary,
                  unfavorable: opportunityVerdict(
                    {status_key:'OPPORTUNITY_SIMPLE_MISS', score_confidence:'high', theme:'mountain_view'},
                    '山景'
                  ).primary,
                  outside: opportunityVerdict(
                    {status_key:'OPPORTUNITY_OUTSIDE_TIME_WINDOW', score_confidence:'high', theme:'sunset'},
                    '日落'
                  ).primary
                };
              """)
              report["verdict_contract"] = verdict_contract
              assert "適合拍攝山景" in verdict_contract["suitable"], verdict_contract
              assert "有機會拍到晨霧" in verdict_contract["chance"], verdict_contract
              assert "不利於拍攝山景" in verdict_contract["unfavorable"], verdict_contract
              assert "不是拍攝日落的建議時段" in verdict_contract["outside"], verdict_contract
              assert "基本好拍條件已成立" not in driver.page_source

              # B108: Taiwan geography is a complete 22-area county/city picker.
              # The older broad island groups are removed from the Taiwan primary nav,
              # and the country selector lives with the low-frequency global controls.
              admin_contract = driver.execute_script("""
                const active = currentSpots.filter(s => s.active_in_catalog !== false);
                const buttons = [...document.querySelectorAll('#admin-filter [data-admin-area]')];
                return {
                  missing: active.filter(s => !Array.isArray(s.admin_areas) || !s.admin_areas.length).map(s => s.spot_id),
                  available: availableAdminAreas(),
                  hostHidden: document.getElementById('admin-filter').hidden,
                  navKeys: [...document.querySelectorAll('#sub-nav .sub-btn')].map(x => x.dataset.key),
                  countryInHeader: !!document.querySelector('.header-right #country-select'),
                  countryInFilter: !!document.querySelector('.filter-toolbar #country-select'),
                  disabled: buttons.filter(x => x.disabled).map(x => x.dataset.adminArea),
                  counts: Object.fromEntries(buttons.map(x => [x.dataset.adminArea, Number(x.querySelector('span')?.textContent || 0)]))
                };
              """)
              report["taiwan_admin_contract"] = admin_contract
              assert admin_contract["missing"] == [], admin_contract
              assert len(admin_contract["available"]) == 22, admin_contract
              assert admin_contract["available"] == [
                  "台北市","新北市","基隆市","桃園市","新竹市","新竹縣","苗栗縣","台中市",
                  "彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","台南市","高雄市","屏東縣",
                  "宜蘭縣","花蓮縣","台東縣","澎湖縣","金門縣","連江縣"
              ], admin_contract
              assert admin_contract["hostHidden"] is False, admin_contract
              assert admin_contract["navKeys"] == ["__fav__"], admin_contract
              assert admin_contract["countryInHeader"] is True, admin_contract
              assert admin_contract["countryInFilter"] is False, admin_contract
              assert admin_contract["counts"]["金門縣"] > 0, admin_contract
              assert admin_contract["counts"]["連江縣"] > 0, admin_contract
              assert admin_contract["counts"]["澎湖縣"] > 0, admin_contract
              assert admin_contract["counts"]["雲林縣"] == 0, admin_contract
              assert admin_contract["counts"]["嘉義市"] == 0, admin_contract
              assert "雲林縣" in admin_contract["disabled"], admin_contract
              assert "嘉義市" in admin_contract["disabled"], admin_contract

              # B109: Taiwan has no explicit All button. Favorites is an
              # independent on/off filter and composes with county selection.
              favorite_toggle = driver.execute_script("""
                const btn = document.querySelector('#sub-nav [data-key="__fav__"]');
                const firstActive = currentSpots.find(s => s.active_in_catalog !== false && getMetric(s));
                favorites = firstActive ? [firstActive.spot_id] : [];
                currentCategoryKey = '__all__';
                currentAdminAreas.clear();
                renderSubNav();
                filterAndRender();
                const before = document.querySelectorAll('#spots-container .card').length;
                document.querySelector('#sub-nav [data-key="__fav__"]').click();
                const on = document.querySelector('#sub-nav [data-key="__fav__"]');
                const filtered = document.querySelectorAll('#spots-container .card').length;
                return {
                  buttonCount: document.querySelectorAll('#sub-nav .sub-btn').length,
                  before,
                  filtered,
                  pressed: on.getAttribute('aria-pressed'),
                  currentCategoryKey
                };
              """)
              report["favorite_toggle"] = favorite_toggle
              assert favorite_toggle["buttonCount"] == 1, favorite_toggle
              assert favorite_toggle["pressed"] == "true", favorite_toggle
              assert favorite_toggle["currentCategoryKey"] == "__fav__", favorite_toggle
              assert favorite_toggle["filtered"] == 1, favorite_toggle
              assert favorite_toggle["before"] > favorite_toggle["filtered"], favorite_toggle

              # Toggle off returns naturally to all places.
              favorite_toggle_off = driver.execute_script("""
                document.querySelector('#sub-nav [data-key="__fav__"]').click();
                return {
                  pressed: document.querySelector('#sub-nav [data-key="__fav__"]').getAttribute('aria-pressed'),
                  currentCategoryKey,
                  actual: document.querySelectorAll('#spots-container .card').length
                };
              """)
              report["favorite_toggle_off"] = favorite_toggle_off
              assert favorite_toggle_off["pressed"] == "false", favorite_toggle_off
              assert favorite_toggle_off["currentCategoryKey"] == "__all__", favorite_toggle_off
              assert favorite_toggle_off["actual"] == 83, favorite_toggle_off

              # Multi-select UX: selecting one county must not collapse the picker.
              # Re-query buttons after each click because filtering re-renders the picker.
              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
                filterAndRender();
                document.querySelector('.admin-filter').open = true;
              """)
              driver.find_element(By.CSS_SELECTOR, '[data-admin-area="花蓮縣"]').click()
              assert driver.find_element(By.CSS_SELECTOR, ".admin-filter").get_attribute("open"), "county picker closed after first selection"
              driver.find_element(By.CSS_SELECTOR, '[data-admin-area="台東縣"]').click()
              assert driver.find_element(By.CSS_SELECTOR, ".admin-filter").get_attribute("open"), "county picker closed after second selection"

              multi_admin_filter = driver.execute_script("""
                const selected = currentAdminAreas;
                const expected = currentSpots.filter(
                  s => s.active_in_catalog !== false &&
                       (s.admin_areas || []).some(a => selected.has(a)) &&
                       getMetric(s)
                ).length;
                const summary = document.querySelector('#admin-filter summary')?.textContent || '';
                return {
                  selected: [...selected].sort(),
                  expected,
                  actual: document.querySelectorAll('#spots-container .card').length,
                  summary,
                  open: document.querySelector('.admin-filter').open
                };
              """)
              report["multi_admin_filter"] = multi_admin_filter
              assert multi_admin_filter["selected"] == ["台東縣", "花蓮縣"], multi_admin_filter
              assert multi_admin_filter["actual"] == multi_admin_filter["expected"], multi_admin_filter
              assert "2" in multi_admin_filter["summary"], multi_admin_filter
              assert multi_admin_filter["open"] is True, multi_admin_filter

              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
                filterAndRender();
              """)
              cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              assert len(cards) == 83, len(cards)

              # B137: Japan and the U.S. use the same Favorites + first-level
              # administrative-area picker interaction as Taiwan. Macro regions
              # are browsing groups only; the selected identities are
              # prefectures / states.
              driver.execute_script("switchRegion('jp')")
              wait.until(lambda d: d.execute_script(
                  "return currentData && currentRegion === 'jp' && currentSpots.length === 35"
              ))
              jp_admin = driver.execute_script("""
                const active = currentSpots.filter(s => s.active_in_catalog !== false);
                const buttons = [...document.querySelectorAll('#admin-filter [data-admin-area]')];
                return {
                  available: availableAdminAreas(),
                  missing: active.filter(s => !spotAdminAreas(s).length).map(s => s.spot_id),
                  navKeys: [...document.querySelectorAll('#sub-nav .sub-btn')].map(x => x.dataset.key),
                  groupCount: document.querySelectorAll('#admin-filter [data-admin-group]').length,
                  hasSearch: !!document.querySelector('#admin-filter [data-admin-search]'),
                  hostHidden: document.getElementById('admin-filter').hidden,
                  disabled: buttons.filter(x => x.disabled).map(x => x.dataset.adminArea),
                  counts: Object.fromEntries(buttons.map(x => [x.dataset.adminArea, Number(x.querySelector('span')?.textContent || 0)]))
                };
              """)
              report["japan_admin_contract"] = jp_admin
              assert len(jp_admin["available"]) == 47, jp_admin
              assert jp_admin["missing"] == [], jp_admin
              assert jp_admin["navKeys"] == ["__fav__"], jp_admin
              assert jp_admin["groupCount"] == 8, jp_admin
              assert jp_admin["hasSearch"] is True, jp_admin
              assert jp_admin["hostHidden"] is False, jp_admin
              assert jp_admin["counts"]["山梨県"] > 0, jp_admin
              assert jp_admin["counts"]["東京都"] > 0, jp_admin

              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
                filterAndRender();
                document.querySelector('.admin-filter').open = true;
              """)
              driver.find_element(By.CSS_SELECTOR, '[data-admin-area="山梨県"]').click()
              jp_filter = driver.execute_script("""
                const expected = currentSpots.filter(
                  s => s.active_in_catalog !== false &&
                       spotAdminAreas(s).includes('山梨県') &&
                       getMetric(s)
                ).length;
                return {
                  selected: [...currentAdminAreas],
                  expected,
                  actual: document.querySelectorAll('#spots-container .card').length,
                  containsFuji: currentSpots.some(
                    s => s.spot_id === 'jp-010' && spotAdminAreas(s).includes('山梨県')
                  )
                };
              """)
              report["japan_admin_filter"] = jp_filter
              assert jp_filter["selected"] == ["山梨県"], jp_filter
              assert jp_filter["actual"] == jp_filter["expected"], jp_filter
              assert jp_filter["containsFuji"] is True, jp_filter

              # Clean the smoke-test selection while still in Japan so later
              # Japan assertions start from the user's unfiltered state.
              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
              """)
              driver.execute_script("switchRegion('us')")
              wait.until(lambda d: d.execute_script(
                  "return currentData && currentRegion === 'us' && currentSpots.length === 70"
              ))
              us_admin = driver.execute_script("""
                const active = currentSpots.filter(s => s.active_in_catalog !== false);
                const buttons = [...document.querySelectorAll('#admin-filter [data-admin-area]')];
                return {
                  available: availableAdminAreas(),
                  missing: active.filter(s => !spotAdminAreas(s).length).map(s => s.spot_id),
                  navKeys: [...document.querySelectorAll('#sub-nav .sub-btn')].map(x => x.dataset.key),
                  groupCount: document.querySelectorAll('#admin-filter [data-admin-group]').length,
                  hasSearch: !!document.querySelector('#admin-filter [data-admin-search]'),
                  hostHidden: document.getElementById('admin-filter').hidden,
                  disabled: buttons.filter(x => x.disabled).map(x => x.dataset.adminArea),
                  counts: Object.fromEntries(buttons.map(x => [x.dataset.adminArea, Number(x.querySelector('span')?.textContent || 0)]))
                };
              """)
              report["us_admin_contract"] = us_admin
              assert len(us_admin["available"]) == 51, us_admin
              assert "District of Columbia" in us_admin["available"], us_admin
              assert us_admin["missing"] == [], us_admin
              assert us_admin["navKeys"] == ["__fav__"], us_admin
              assert us_admin["groupCount"] == 4, us_admin
              assert us_admin["hasSearch"] is True, us_admin
              assert us_admin["hostHidden"] is False, us_admin
              assert us_admin["counts"]["California"] > 0, us_admin
              assert us_admin["counts"]["Alaska"] > 0, us_admin
              assert us_admin["counts"]["District of Columbia"] == 0, us_admin
              assert "District of Columbia" in us_admin["disabled"], us_admin

              driver.execute_script("""
                currentAdminAreas = new Set(['Nevada']);
                persistAdminAreas();
                filterAndRender();
              """)
              us_filter = driver.execute_script("""
                const expectedIds = currentSpots.filter(
                  s => s.active_in_catalog !== false &&
                       spotAdminAreas(s).includes('Nevada') &&
                       getMetric(s)
                ).map(s => s.spot_id);
                return {
                  selected: [...currentAdminAreas],
                  expected: expectedIds.length,
                  expectedIds,
                  actual: document.querySelectorAll('#spots-container .card').length,
                  deathValleyAreas: spotAdminAreas(currentSpots.find(s => s.spot_id === 'us-014'))
                };
              """)
              report["us_admin_filter"] = us_filter
              assert us_filter["selected"] == ["Nevada"], us_filter
              assert us_filter["actual"] == us_filter["expected"], us_filter
              assert "us-014" in us_filter["expectedIds"], us_filter
              assert us_filter["deathValleyAreas"] == ["California", "Nevada"], us_filter

              # Clean the smoke-test Nevada selection before leaving the US.
              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
              """)

              # Restore Taiwan for the rest of the existing Browser Smoke.
              driver.execute_script("switchRegion('tw')")
              wait.until(lambda d: d.execute_script(
                  "return currentData && currentRegion === 'tw' && currentSpots.length === 83"
              ))
              driver.execute_script("""
                currentAdminAreas.clear();
                persistAdminAreas();
                currentCategoryKey = '__all__';
                renderSubNav();
                filterAndRender();
              """)
              cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              assert len(cards) == 83, len(cards)

              # B102 desktop contract: no-opportunity cards are present but
              # collapsed by default, filters stay sticky, and wide screens
              # expand to four columns.
              deferred = driver.find_elements(By.CSS_SELECTOR, "#spots-container .deferred-group")
              report["deferred_groups"] = len(deferred)
              assert all(not x.get_attribute("open") for x in deferred), "no-opportunity group must be collapsed by default"
              sticky_position = driver.execute_script(
                  "return getComputedStyle(document.querySelector('.filter-shell')).position"
              )
              report["filter_shell_position"] = sticky_position
              assert sticky_position == "sticky", sticky_position
              driver.set_window_size(1800, 1200)
              column_count = driver.execute_script("""
                const grid = document.getElementById('spots-container');
                return getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;
              """)
              report["desktop_grid_columns"] = column_count
              assert column_count == 4, column_count
              driver.set_window_size(1440, 1200)

              # Open deferred cards for the remaining data-contract assertions.
              driver.execute_script("document.querySelectorAll('.deferred-group').forEach(x => x.open = true)")
              cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")

              # R4.2 navigation contract: ambiguous keyword search is forbidden.
              # 加羅湖 needs a verified hiking arrival point, so its navigation
              # control must be disabled rather than searching the place name.
              jialuo_card = next(c for c in cards if "加羅湖" in c.text)
              jialuo_nav = jialuo_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert jialuo_nav.get_attribute("data-navigation-mode") == "needs_review", jialuo_card.text
              assert jialuo_nav.tag_name.lower() == "span"
              assert not jialuo_nav.get_attribute("href")

              # A legacy exact Camera/Place anchor may still be useful as a
              # coordinate map pin, but it must not be labeled as verified nav
              # and must never pass map_query text to Google Maps.
              nanya_card = next(c for c in cards if "南雅奇岩" in c.text)
              nanya_nav = nanya_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert nanya_nav.get_attribute("data-navigation-mode") == "provisional-map-pin", nanya_card.text
              nanya_href = nanya_nav.get_attribute("href")
              nanya_url = urlparse(nanya_href)
              assert "/maps/search/" in nanya_url.path, nanya_href
              nanya_query = parse_qs(nanya_url.query).get("query")
              assert nanya_query == ["25.11982,121.89314"], nanya_href
              assert "南雅" not in nanya_href

              title = driver.find_element(By.ID, "discovery-title").text
              report["discovery_title"] = title
              expected_title = "明天去哪裡拍" if report["validated_day_filter"] == "tomorrow" else "今天去哪裡拍"
              assert expected_title in title, (expected_title, title)

              browser_tz = driver.execute_script("return Intl.DateTimeFormat().resolvedOptions().timeZone")
              updated_at = driver.execute_script("return currentData.updated_at")
              update_text = driver.find_element(By.ID, "update-time").text
              expected_update = driver.execute_script("""
                const dt = new Date(currentData.updated_at);
                return new Intl.DateTimeFormat('zh-TW',{
                  month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZoneName:'short'
                }).format(dt);
              """)
              report["browser_timezone"] = browser_tz
              report["last_updated_text"] = update_text
              assert browser_tz == "America/Los_Angeles", browser_tz
              assert expected_update in update_text, (expected_update, update_text, updated_at)

              # Do not require the currently selected forecast day to have a
              # best window: late-day CI runs can legitimately have no remaining
              # opportunity window. Use a real generated Place timezone, then
              # exercise fmtWindow() with a deterministic local-time sample.
              place_window = driver.execute_script("""
                let selected = null;
                for (const spot of currentSpots) {
