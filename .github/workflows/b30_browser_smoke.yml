name: B30 Browser Smoke

on:
  push:
    branches:
      - r4.2-b28-p0-missing-places
      - r4.2-b31-place-weather-details
      - r4.2-b32-jp-research-batch01
      - r4.2-b33-hualien-places
      - r4.2-b32-jp025-hagi
      - codex/jp026
    paths:
      - "index.html"
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - "runtime_catalog_v004_r4_2_b33_hualien_additions.json"
      - ".github/workflows/b30_browser_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b30-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Taiwan and Japan candidate weather
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run browser smoke
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/chaselights-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from urllib.parse import urlparse, parse_qs
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.support import expected_conditions as EC

          opts = webdriver.ChromeOptions()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")

          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 30)
          report = {}

          try:
              # Last Updated must follow the user's device/browser timezone,
              # independently from each Place's local shooting-time timezone.
              driver.execute_cdp_cmd("Emulation.setTimezoneOverride", {"timezoneId": "America/Los_Angeles"})
              driver.get("http://127.0.0.1:8000/index.html")

              cards = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, "#spots-container .card"))
              report["taiwan_rendered_cards"] = len(cards)
              assert len(cards) == 84, f"expected 84 Taiwan cards, got {len(cards)}"

              # R4.2 navigation contract: ambiguous keyword search is forbidden.
              # 加羅湖 needs a verified hiking arrival point, so its navigation
              # control must be disabled rather than searching the place name.
              jialuo_card = next(c for c in cards if "加羅湖" in c.text)
              jialuo_nav = jialuo_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert jialuo_nav.get_attribute("data-navigation-mode") == "needs_review", jialuo_card.text
              assert jialuo_nav.tag_name.lower() == "span"
              assert not jialuo_nav.get_attribute("href")

              # A legacy exact Camera/Place anchor may still be useful as a
              # coordinate map pin, but it must not be labeled as verified nav
              # and must never pass map_query text to Google Maps.
              nanya_card = next(c for c in cards if "南雅奇岩" in c.text)
              nanya_nav = nanya_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert nanya_nav.get_attribute("data-navigation-mode") == "provisional-map-pin", nanya_card.text
              nanya_href = nanya_nav.get_attribute("href")
              nanya_url = urlparse(nanya_href)
              assert "/maps/search/" in nanya_url.path, nanya_href
              nanya_query = parse_qs(nanya_url.query).get("query")
              assert nanya_query == ["25.11982,121.89314"], nanya_href
              assert "南雅" not in nanya_href

              title = driver.find_element(By.ID, "discovery-title").text
              report["discovery_title"] = title
              assert "今天去哪裡拍" in title, title

              browser_tz = driver.execute_script("return Intl.DateTimeFormat().resolvedOptions().timeZone")
              updated_at = driver.execute_script("return currentData.updated_at")
              update_text = driver.find_element(By.ID, "update-time").text
              expected_update = driver.execute_script("""
                const dt = new Date(currentData.updated_at);
                return new Intl.DateTimeFormat('zh-TW',{
                  month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZoneName:'short'
                }).format(dt);
              """)
              report["browser_timezone"] = browser_tz
              report["last_updated_text"] = update_text
              assert browser_tz == "America/Los_Angeles", browser_tz
              assert expected_update in update_text, (expected_update, update_text, updated_at)

              place_window = driver.execute_script("""
                const spot = currentSpots.find(s => {
                  const m = getMetric(s);
                  return m && m.window_start && m.window_end && m.timezone_abbr;
                });
                const metric = spot ? getMetric(spot) : null;
                return metric ? {
                  spot_id: spot.spot_id,
                  timezone_abbr: metric.timezone_abbr,
                  formatted: fmtWindow(metric)
                } : null;
              """)
              assert place_window, "no local-time best window found"
              report["place_window_timezone"] = place_window
              assert place_window["timezone_abbr"] in place_window["formatted"], place_window
              assert "PDT" not in place_window["formatted"], place_window

              body_text = driver.find_element(By.TAG_NAME, "body").text
              assert "96H 明細" not in body_text
              assert "96H details" not in body_text

              first = cards[0]
              tools = first.find_elements(By.CSS_SELECTOR, ".card-footer-tools .tool-link")
              report["tool_count"] = len(tools)
              assert len(tools) == 3, [x.text for x in tools]
              assert first.find_elements(By.CSS_SELECTOR, "[data-weather]"), "weather tool missing"

              hrefs = [x.get_attribute("href") or "" for x in tools]
              report["tool_hrefs"] = hrefs
              assert any("google.com/maps/search" in h for h in hrefs), hrefs
              assert any("radar" in (x.text or "").lower() or "雷達" in (x.text or "") for x in tools), [x.text for x in tools]

              first.find_element(By.CSS_SELECTOR, ".card-header").click()
              wait.until(lambda d: d.find_element(By.ID, "place-modal-overlay").value_of_css_property("display") != "none")
              opp_cards = driver.find_elements(By.CSS_SELECTOR, "#place-modal-body .opportunity-card")
              report["place_guide_opportunity_cards"] = len(opp_cards)
              assert opp_cards, "researched Place Guide did not render Opportunity cards"
              guide_text = driver.find_element(By.ID, "place-modal-body").text
              assert "這裡適合拍什麼" in guide_text
              assert "景點當地時區" in guide_text, guide_text
              assert "適合時間（景點當地時間）" in guide_text, guide_text
              driver.execute_script("closePlaceModal()")

              cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              weather = cards[0].find_element(By.CSS_SELECTOR, "[data-weather]")
              driver.execute_script("arguments[0].click()", weather)
              wait.until(lambda d: d.find_element(By.ID, "modal-overlay").value_of_css_property("display") != "none")
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, "#timeline-body tr")) > 0)
              report["weather_rows"] = len(driver.find_elements(By.CSS_SELECTOR, "#timeline-body tr"))
              weather_title = driver.find_element(By.ID, "modal-spot-name").text
              report["weather_title"] = weather_title
              assert "天氣預報" in weather_title
              driver.execute_script("closeModal()")

              # Use a complete future local day for score assertions. The current
              # day may legitimately have no remaining daylight Opportunities.
              driver.execute_script("switchDay('tomorrow')")
              wait.until(lambda d: d.execute_script("return currentDayFilter === 'tomorrow'"))

              driver.execute_script("document.getElementById('spots-container').innerHTML = ''")
              Select(driver.find_element(By.ID, "country-select")).select_by_value("jp")
              wait.until(lambda d: d.execute_script("return currentRegion === 'jp' && currentSpots.length > 0 && String(currentSpots[0].spot_id || '').startsWith('jp-')"))
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, "#spots-container .card")) > 0)
              jp_cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              report["jp_cards"] = len(jp_cards)
              assert len(jp_cards) == 35, len(jp_cards)

              researched_jp_ids = driver.execute_script("""
                return currentSpots
                  .filter(s => Array.isArray(s.opportunities) && s.opportunities.length)
                  .map(s => s.spot_id);
              """)
              report["researched_jp_ids"] = researched_jp_ids
              assert researched_jp_ids == [f"jp-{i:03d}" for i in range(1, 27)], researched_jp_ids

              researched_names = {"美瑛青池", "旭岳", "釧路濕原", "函館山夜景", "小樽運河", "摩周湖", "十和田湖", "松島", "磐梯山", "富士山 (河口湖)", "東京鐵塔", "鎌倉大佛", "諏訪湖", "等等力溪谷", "皇居外苑二重橋", "橫濱山下公園", "金澤兼六園", "名古屋城", "濱名湖", "橫濱港未來21", "新穗高・西穗高口展望台", "彌彥山", "京都清水寺", "大阪城公園", "萩城下町・菊屋橫町", "出雲大社"}
              researched_cards = [c for c in jp_cards if any(name in c.text for name in researched_names)]
              assert len(researched_cards) == 26
              researched_scores = [c.find_element(By.CSS_SELECTOR, ".score-badge").text.strip() for c in researched_cards]
              for card, score_text in zip(researched_cards, researched_scores):
                  if score_text in {"", "—"}:
                      assert "今天剩餘時段沒有合適的已研究拍攝機會" in card.text, card.text
                  else:
                      assert score_text.replace("🔥 ", "").isdigit(), card.text
              assert all("攝影研究待補" not in c.text for c in researched_cards)

              hakodate_card = next(c for c in researched_cards if "函館山夜景" in c.text)
              hakodate_score_text = hakodate_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert hakodate_score_text not in {"", "—"}
              assert int(hakodate_score_text) <= 64, hakodate_card.text

              blue_pond_card = next(c for c in researched_cards if "美瑛青池" in c.text)
              blue_pond_score_text = blue_pond_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert blue_pond_score_text not in {"", "—"}
              assert int(blue_pond_score_text) <= 35, blue_pond_card.text

              asahidake_card = next(c for c in researched_cards if "旭岳" in c.text)
              asahidake_score_text = asahidake_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert asahidake_score_text not in {"", "—"}
              assert int(asahidake_score_text) <= 64, asahidake_card.text

              mashu_card = next(c for c in researched_cards if "摩周湖" in c.text)
              mashu_score_text = mashu_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert mashu_score_text not in {"", "—"}
              assert "攝影研究待補" not in mashu_card.text

              towada_card = next(c for c in researched_cards if "十和田湖" in c.text)
              towada_score_text = towada_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert towada_score_text not in {"", "—"}
              assert "攝影研究待補" not in towada_card.text

              matsushima_card = next(c for c in researched_cards if "松島" in c.text)
              matsushima_score_text = matsushima_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              if matsushima_score_text in {"", "—"}:
                  assert "今天剩餘時段沒有合適的已研究拍攝機會" in matsushima_card.text
              else:
                  assert matsushima_score_text.isdigit(), matsushima_card.text
              assert "攝影研究待補" not in matsushima_card.text

              bandai_card = next(c for c in researched_cards if "磐梯山" in c.text)
              bandai_score_text = bandai_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert bandai_score_text not in {"", "—"}
              assert "攝影研究待補" not in bandai_card.text

              fuji_card = next(c for c in researched_cards if "富士山 (河口湖)" in c.text)
              fuji_score_text = fuji_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert fuji_score_text not in {"", "—"}
              assert "攝影研究待補" not in fuji_card.text

              suwa_card = next(c for c in researched_cards if "諏訪湖" in c.text)
              suwa_score_text = suwa_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert suwa_score_text not in {"", "—"}
              assert "攝影研究待補" not in suwa_card.text

              todoroki_card = next(c for c in researched_cards if "等等力溪谷" in c.text)
              todoroki_score_text = todoroki_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert todoroki_score_text == "0", todoroki_card.text
              assert "攝影研究待補" not in todoroki_card.text

              todoroki_nav = todoroki_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert todoroki_nav.get_attribute("data-navigation-mode") == "verified"
              todoroki_href = todoroki_nav.get_attribute("href")
              todoroki_url = urlparse(todoroki_href)
              assert "/maps/dir/" in todoroki_url.path, todoroki_href
              assert parse_qs(todoroki_url.query).get("destination") == ["35.607857,139.646545"], todoroki_href
              assert "等々力" not in todoroki_href

              hamanako_card = next(c for c in researched_cards if "濱名湖" in c.text)
              hamanako_score_text = hamanako_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert hamanako_score_text not in {"", "—"}
              assert "攝影研究待補" not in hamanako_card.text

              nijubashi_card = next(c for c in researched_cards if "皇居外苑二重橋" in c.text)
              nijubashi_score_text = nijubashi_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert nijubashi_score_text not in {"", "—"}
              assert "攝影研究待補" not in nijubashi_card.text
              assert "東京皇居" not in nijubashi_card.text

              kamakura_card = next(c for c in researched_cards if "鎌倉大佛" in c.text)
              kamakura_score_text = kamakura_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert kamakura_score_text not in {"", "—"}
              assert "攝影研究待補" not in kamakura_card.text

              tokyo_tower_card = next(c for c in researched_cards if "東京鐵塔" in c.text)
              tokyo_tower_score_text = tokyo_tower_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert tokyo_tower_score_text not in {"", "—"}
              assert "攝影研究待補" not in tokyo_tower_card.text

              yamashita_card = next(c for c in researched_cards if "橫濱山下公園" in c.text)
              yamashita_score_text = yamashita_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert yamashita_score_text not in {"", "—"}
              assert "攝影研究待補" not in yamashita_card.text

              kenroku_card = next(c for c in researched_cards if "金澤兼六園" in c.text)
              kenroku_score_text = kenroku_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert kenroku_score_text not in {"", "—"}
              assert "攝影研究待補" not in kenroku_card.text

              nagoya_card = next(c for c in researched_cards if "名古屋城" in c.text)
              nagoya_score_text = nagoya_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert nagoya_score_text not in {"", "—"}
              assert "攝影研究待補" not in nagoya_card.text

              minato_card = next(c for c in researched_cards if "橫濱港未來21" in c.text)
              minato_score_text = minato_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert minato_score_text not in {"", "—"}
              assert "攝影研究待補" not in minato_card.text

              shinhotaka_card = next(c for c in researched_cards if "新穗高・西穗高口展望台" in c.text)
              shinhotaka_score_text = shinhotaka_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert shinhotaka_score_text not in {"", "—"}
              assert shinhotaka_score_text.isdigit(), shinhotaka_card.text
              if int(shinhotaka_score_text) >= 80:
                  assert "此拍攝題材的關鍵條件目前符合" in shinhotaka_card.text, shinhotaka_card.text
              assert "攝影研究待補" not in shinhotaka_card.text

              kiyomizu_card = next(c for c in researched_cards if "京都清水寺" in c.text)
              kiyomizu_score_text = kiyomizu_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert kiyomizu_score_text not in {"", "—"}
              assert "攝影研究待補" not in kiyomizu_card.text

              osaka_card = next(c for c in researched_cards if "大阪城公園" in c.text)
              osaka_score_text = osaka_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert osaka_score_text not in {"", "—"}
              assert "攝影研究待補" not in osaka_card.text

              hagi_card = next(c for c in researched_cards if "萩城下町・菊屋橫町" in c.text)
              hagi_score_text = hagi_card.find_element(By.CSS_SELECTOR, ".score-badge").text.strip().replace("🔥 ", "")
              assert hagi_score_text not in {"", "—"}
              assert hagi_score_text.isdigit(), hagi_card.text
              assert "攝影研究待補" not in hagi_card.text

              hagi_nav = hagi_card.find_element(By.CSS_SELECTOR, "[data-navigation-mode]")
              assert hagi_nav.get_attribute("data-navigation-mode") == "verified"
              hagi_href = hagi_nav.get_attribute("href")
              hagi_url = urlparse(hagi_href)
              assert "/maps/dir/" in hagi_url.path, hagi_href
              assert parse_qs(hagi_url.query).get("destination") == ["34.4119363,131.3932271"], hagi_href
              assert "菊屋" not in hagi_href

              pending_jp_cards = [c for c in jp_cards if not any(name in c.text for name in researched_names)]
              assert len(pending_jp_cards) == 9
              pending_jp_scores = [c.find_element(By.CSS_SELECTOR, ".score-badge").text.strip() for c in pending_jp_cards]
              assert all(x in {"", "—"} for x in pending_jp_scores), pending_jp_scores[:20]
              assert all("攝影研究待補" in c.text for c in pending_jp_cards), "non-migrated Japan card leaked legacy scoring"

              driver.execute_script("document.getElementById('spots-container').innerHTML = ''")
              Select(driver.find_element(By.ID, "country-select")).select_by_value("us")
              wait.until(lambda d: d.execute_script("return currentRegion === 'us' && currentSpots.length > 0 && String(currentSpots[0].spot_id || '').startsWith('us-')"))
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, "#spots-container .card")) > 0)
              us_cards = driver.find_elements(By.CSS_SELECTOR, "#spots-container .card")
              report["us_cards"] = len(us_cards)
              us_scores = [c.find_element(By.CSS_SELECTOR, ".score-badge").text.strip() for c in us_cards]
              assert all(x in {"", "—"} for x in us_scores), us_scores[:20]
              assert any("攝影研究待補" in c.text for c in us_cards), "US research-pending card notice missing"

              print(json.dumps(report, ensure_ascii=False, indent=2))
          finally:
              driver.quit()
          PY
