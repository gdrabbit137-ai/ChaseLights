name: Update Live WeatherGrid Preview

on:
  schedule:
    # GFS runs at 00/06/12/18Z. Refresh ~5h20m later so f000-f012
    # products are normally available while candidate_runs() still falls back
    # to older cycles if NOAA publication is delayed.
    - cron: '20 5,11,17,23 * * *'
  push:
    branches:
      - main
    paths:
      - "gfs_multilayer_poc.py"
      - "weathergrid_browser_bundle.py"
      - "icon_global_cloud_poc.py"
      - "icon_weathergrid_browser_bundle.py"
      - "cwa_wrf3_poc.py"
      - "cwa_weathergrid_browser_bundle.py"
      - "build_weathergrid_coverage_browser.py"
      - ".github/workflows/update_weathergrid.yml"
  workflow_dispatch:
    inputs:
      forecast_hours:
        description: "Comma-separated GFS forecast hours to publish"
        required: false
        default: "0,3,6,9,12"

concurrency:
  group: chaselights-weathergrid-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-weathergrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install WeatherGrid dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo
          python -m pip install --upgrade pip
          python -m pip install requests boto3 scipy xarray netCDF4 cfgrib eccodes numpy matplotlib cartopy

      - name: Cache DWD ICON remap weights
        uses: actions/cache@v4
        with:
          path: .cache/dwd-icon-cdo
          key: dwd-icon-global-0125-cdo-v1

      - name: Fetch regional live GFS WeatherGrid
        env:
          FORECAST_HOURS: ${{ inputs.forecast_hours || '0,3,6,9,12' }}
        run: |
          python gfs_multilayer_poc.py \
            --forecast-hours "$FORECAST_HOURS" \
            --output-dir gfs_multilayer_output \
            --coverage-scope region

      - name: Build compact GFS browser bundle and QC
        run: |
          python weathergrid_browser_bundle.py \
            --input-dir gfs_multilayer_output

      - name: Fetch ICON Global cloud WeatherGrid
        id: icon_cloud
        continue-on-error: true
        env:
          FORECAST_HOURS: ${{ inputs.forecast_hours || '0,3,6,9,12' }}
        run: |
          python icon_global_cloud_poc.py \
            --forecast-hours "$FORECAST_HOURS" \
            --output-dir icon_cloud_output \
            --cdo-cache-dir .cache/dwd-icon-cdo

      - name: Build ICON cloud browser bundle and QC
        if: steps.icon_cloud.outcome == 'success'
        run: |
          python icon_weathergrid_browser_bundle.py \
            --input-dir icon_cloud_output

      - name: Fetch CWA WRF 3 km WeatherGrid
        id: cwa_wrf3
        continue-on-error: true
        env:
          CWA_FORECAST_HOURS: "0,6,12"
        run: |
          python cwa_wrf3_poc.py \
            --forecast-hours "$CWA_FORECAST_HOURS" \
            --output-dir cwa_wrf3_output

      - name: Build CWA WRF 3 km browser bundle and QC
        if: steps.cwa_wrf3.outcome == 'success'
        run: |
          python cwa_weathergrid_browser_bundle.py \
            --input-dir cwa_wrf3_output

      - name: Build subject-aware coverage browser bundle
        run: |
          python build_weathergrid_coverage_browser.py \
            --output gfs_multilayer_output/weathergrid_coverage_browser.json

      - name: Validate publish payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("gfs_multilayer_output")
          browser = json.loads((out / "gfs_tw_weather_browser.json").read_text())
          qc = json.loads((out / "gfs_tw_weather_qc.json").read_text())
          coverage = json.loads((out / "weathergrid_coverage_browser.json").read_text())

          assert browser.get("frames"), "browser bundle has no forecast frames"
          assert browser.get("spots"), "browser bundle has no Places"
          assert qc.get("frame_count") == len(browser["frames"]), (qc, len(browser["frames"]))

          icon_path = Path("icon_cloud_output/icon_tw_cloud_browser.json")
          icon_qc_path = Path("icon_cloud_output/icon_tw_cloud_qc.json")
          icon_summary = {"published": False}
          if icon_path.exists():
              icon = json.loads(icon_path.read_text())
              icon_qc = json.loads(icon_qc_path.read_text())
              assert icon.get("model") == "ICON_GLOBAL", icon.get("model")
              assert icon.get("frames"), "ICON bundle has no forecast frames"
              assert icon_qc.get("frame_count") == len(icon["frames"])
              gfs_times = {x["valid_time_utc"] for x in browser["frames"]}
              icon_times = {x["valid_time_utc"] for x in icon["frames"]}
              overlap = sorted(gfs_times & icon_times)
              assert overlap, "ICON/GFS bundles have no matching valid time"
              icon_summary = {
                  "published": True,
                  "frames": len(icon["frames"]),
                  "matching_valid_times": len(overlap),
                  "native_resolution_km": icon.get("provenance", {}).get(
                      "native_resolution_km"
                  ),
              }

          cwa_path = Path("cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json")
          cwa_qc_path = Path("cwa_wrf3_output/cwa_wrf3_tw_weather_qc.json")
          cwa_summary = {"published": False}
          if cwa_path.exists():
              cwa = json.loads(cwa_path.read_text())
              cwa_qc = json.loads(cwa_qc_path.read_text())
              assert cwa.get("model") == "CWA_WRF_3KM", cwa.get("model")
              assert cwa.get("frames"), "CWA bundle has no forecast frames"
              assert cwa_qc.get("frame_count") == len(cwa["frames"])
              provenance = cwa.get("provenance", {})
              assert provenance.get("native_resolution_km") == 3.0, provenance
              assert provenance.get("model_output_interval_hours") == 1, provenance
              assert provenance.get("model_forecast_horizon_hours") == 126, provenance
              assert provenance.get("public_product_interval_hours") == 6, provenance
              assert provenance.get("public_product_horizon_hours") == 84, provenance
              assert "temperature_2m_c" in cwa.get("fields", {}), cwa.get("fields")
              assert "wind_speed_10m_m_s" in cwa.get("fields", {}), cwa.get("fields")
              cwa_summary = {
                  "published": True,
                  "frames": len(cwa["frames"]),
                  "native_resolution_km": provenance.get("native_resolution_km"),
                  "model_output_interval_hours": provenance.get(
                      "model_output_interval_hours"
                  ),
                  "public_product_interval_hours": provenance.get(
                      "public_product_interval_hours"
                  ),
                  "bbox": cwa.get("bbox"),
              }

          by_spot = {x["spot_id"]: x for x in coverage.get("spots", [])}
          for spot_id in ("tw-073", "tw-075"):
              assert spot_id in by_spot, (spot_id, list(by_spot))
              assert by_spot[spot_id]["all_topics_complete"] is True, by_spot[spot_id]

          print(json.dumps({
              "cycle": qc.get("cycle"),
              "frames": len(browser["frames"]),
              "spots": len(browser["spots"]),
              "coverage_spots": len(coverage.get("spots", [])),
              "tw_073_complete": by_spot["tw-073"]["all_topics_complete"],
              "tw_075_complete": by_spot["tw-075"]["all_topics_complete"],
              "icon": icon_summary,
              "cwa_wrf3": cwa_summary,
          }, indent=2))
          PY

      - name: Publish compact live snapshot
        run: |
          mkdir -p weathergrid
          cp gfs_multilayer_output/gfs_tw_weather_browser.json weathergrid/gfs_tw_weather_browser.json
          cp gfs_multilayer_output/gfs_tw_weather_qc.json weathergrid/gfs_tw_weather_qc.json
          cp gfs_multilayer_output/weathergrid_coverage_browser.json weathergrid/weathergrid_coverage_browser.json

          if [[ -f icon_cloud_output/icon_tw_cloud_browser.json ]]; then
            cp icon_cloud_output/icon_tw_cloud_browser.json weathergrid/icon_tw_cloud_browser.json
            cp icon_cloud_output/icon_tw_cloud_qc.json weathergrid/icon_tw_cloud_qc.json
          else
            # Never leave a stale ICON bundle active after a failed refresh.
            # The browser will immediately fall back to the fresh GFS bundle.
            rm -f weathergrid/icon_tw_cloud_browser.json weathergrid/icon_tw_cloud_qc.json
          fi

          if [[ -f cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json ]]; then
            cp cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json weathergrid/cwa_wrf3_tw_weather_browser.json
            cp cwa_wrf3_output/cwa_wrf3_tw_weather_qc.json weathergrid/cwa_wrf3_tw_weather_qc.json
          else
            # CWA is manually selectable. Never leave an old regional run
            # selectable when the current refresh failed.
            rm -f weathergrid/cwa_wrf3_tw_weather_browser.json weathergrid/cwa_wrf3_tw_weather_qc.json
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A \
            weathergrid/gfs_tw_weather_browser.json \
            weathergrid/gfs_tw_weather_qc.json \
            weathergrid/weathergrid_coverage_browser.json \
            weathergrid/icon_tw_cloud_browser.json \
            weathergrid/icon_tw_cloud_qc.json \
            weathergrid/cwa_wrf3_tw_weather_browser.json \
            weathergrid/cwa_wrf3_tw_weather_qc.json

          if git diff --cached --quiet; then
            echo "WeatherGrid live snapshot unchanged."
            exit 0
          fi

          git commit -m "Auto-update live WeatherGrid preview [skip ci]"
          for i in {1..5}; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish WeatherGrid snapshot after retries."
          exit 1

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-weathergrid-preview
          path: |
            gfs_multilayer_output/
            icon_cloud_output/
            cwa_wrf3_output/cwa_wrf3_tw_weather_browser.json
            cwa_wrf3_output/cwa_wrf3_tw_weather_qc.json
          if-no-files-found: error
          retention-days: 7
