name: V2 Integration
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: V2 real merged-tree 444-case Research-only Beta acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W5_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      W5_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout actual proposed merge or merged main (full Git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /AGENTS.md
            /RESEARCH_EVIDENCE_SPEC_R4_2.md
            /NAVIGATION_SPEC_R4_2.md
            /CNAME
            /index.html
            /assets/
            /weather-map.html
            /genre-eval.html
            /field-intake.html
            # Root modules imported by packages/core-v2 tests via sys.path[ROOT]
            /lunar_ephemeris.py
            /runtime_catalog_v004_r4_2.json
            # CL-CI-11: opportunity_runtime._load_event_calendar reads this root
            # data file at import time; a missing file truncates the
            # lunar_ephemeris -> fetch_data -> opportunity_runtime chain and
            # fails the ASTRO_SAMPLING_PROVENANCE import (w3 loader errors).
            /runtime_event_calendar_r4_2.json
            /tw_weather.json
            /jp_weather.json
            /us_weather.json
            # Root modules imported by w3 astro tests and w4 node tests.
            # CL-CI-09: astro_hourly lazily does `from fetch_data import
            # _radec_to_altaz` (moon_target_separation path), and fetch_data
            # imports the full runtime-module chain below — every transitive
            # root module must be in this list or the sparse checkout fails
            # the ASTRO_SAMPLING_PROVENANCE import with a truncated tree.
            /fetch_data.py
            /opportunity_runtime.py
            /access_state.py
            /astrophotography_environment.py
            /aurora_state.py
            /denali_access.py
            /johnston_ridge_access.py
            /marine_state.py
            /photography_environment.py
            /photography_transparency.py
            /runtime_dependencies.py
            /shinhotaka_access.py
            /spatial_weather.py
            /tide_state.py
            /viirs_nightlights_weathergrid.py
            /yahiko_access.py
            /scripts/
            /weathergrid/
            /specs/v2/
            /data/v2/
            /packages/core-v2/
            /packages/models-v2/
            /apps/web-v2/
            /ops/v2/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install schema and Chromium tooling
        run: |
          python -m pip install 'jsonschema==4.26.0' 'PyYAML==6.0.3' 'tzdata==2025.3'
          npm install --prefix .ci/tooling --no-save --package-lock=false playwright@1.57.0
          .ci/tooling/node_modules/.bin/playwright install --with-deps chromium
          node -e 'const p=require("node:path"); const m=p.resolve(".ci/tooling/node_modules/playwright"); const c=require(m).chromium; console.log("PLAYWRIGHT_MODULE="+m); console.log("CHROMIUM_EXECUTABLE="+c.executablePath());' >> "$GITHUB_ENV"
      - name: Require exact W1–W4 trees, real browse sources and all 444 checks
        run: |
          python ops/v2/postmerge_verify.py --root . --logs-dir .ci/postmerge-logs
      # CL-CI-17: make postmerge failures diagnosable without CI log access.
      # Emits one-line JSON for the overall result and per-group results, GitHub
      # error annotations for FAIL groups, and a full markdown step summary.
      - name: Report postmerge summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib

          logs = pathlib.Path('.ci/postmerge-logs')
          summary_path = logs / 'postmerge-summary.json'
          step_summary = pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])

          if not summary_path.exists():
              step_summary.write_text('postmerge summary missing\n')
              print('postmerge summary missing')
          else:
              report = json.loads(summary_path.read_text())

              overall = {
                  'status': report.get('status'),
                  'error': report.get('error'),
                  'counts': report.get('counts'),
              }
              print(json.dumps(overall))

              for group in report.get('groups', []):
                  counts = group.get('counts') or {}
                  line = {
                      'name': group.get('name'),
                      'status': group.get('status'),
                      'tests': counts.get('tests'),
                      'pass': counts.get('pass'),
                      'fail': counts.get('fail'),
                      'error': counts.get('error'),
                      'gate_error': group.get('gate_error'),
                  }
                  print(json.dumps(line))

              summary_lines = []
              summary_lines.append('# Postmerge summary')
              summary_lines.append('')
              summary_lines.append('```json')
              summary_lines.append(json.dumps(overall))
              summary_lines.append('```')
              summary_lines.append('')
              summary_lines.append('| name | status | tests | pass | fail | error | gate_error |')
              summary_lines.append('| --- | --- | --- | --- | --- | --- | --- |')
              for group in report.get('groups', []):
                  counts = group.get('counts') or {}
                  gate = (group.get('gate_error') or '').replace('|', '\\|')
                  summary_lines.append(
                      '| {name} | {status} | {tests} | {passed} | {fail} | {error} | {gate} |'.format(
                          name=group.get('name'),
                          status=group.get('status'),
                          tests=counts.get('tests'),
                          passed=counts.get('pass'),
                          fail=counts.get('fail'),
                          error=counts.get('error'),
                          gate=gate,
                      ))

              for group in report.get('groups', []):
                  if group.get('status') != 'FAIL':
                      continue
                  gate = (group.get('gate_error') or 'no gate_error captured').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error::group={group.get('name')} gate_error={gate}")

                  # CL-CI-17c: surface the tail of each FAIL group's TAP log as an
                  # annotation, since check-run annotations are the only output
                  # readable without repository/CI-log access.
                  faillog_name = group.get('name') or 'unknown'
                  log_path = logs / f"{faillog_name}.log"
                  faillog = ''
                  if log_path.exists():
                      faillog = '\n'.join(
                          log_path.read_text(errors='replace').splitlines()[-6:])
                  if len(faillog) > 900:
                      faillog = faillog[:899] + '\u2026'
                  faillog = faillog.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error::FAILLOG {faillog_name} {faillog}")

                  # CL-CI-17d: for any FAIL group with fail>0, emit the failing
                  # test names ('not ok' TAP lines) and cl-data-12 grep hits.
                  try:
                      fail_count = int((group.get('counts') or {}).get('fail') or 0)
                  except (TypeError, ValueError):
                      fail_count = 0
                  if fail_count > 0 and log_path.exists():
                      dlog_lines = log_path.read_text(errors='replace').splitlines()
                      notok = [ln[:180] for ln in dlog_lines if ln.startswith('not ok')][:8]
                      notok = [ln.replace('%', '%25').replace('\r', '%0D') for ln in notok]
                      print(f"::error::FAILNOTOK {faillog_name} " + '%0A'.join(notok))
                      cl12 = [ln[:150] for ln in dlog_lines if 'cl-data-12' in ln.lower()][:2]
                      cl12_count = sum(1 for ln in dlog_lines if 'cl-data-12' in ln.lower())
                      cl12 = [ln.replace('%', '%25').replace('\r', '%0D') for ln in cl12]
                      print(f"::error::CL12GREP count={cl12_count} " + '%0A'.join(cl12))

                  if faillog_name == 'w4-node':
                      # CL-CI-17c: w4-node pin diagnostics — how many *.test.mjs
                      # files CI globs (postmerge_verify globs apps/web-v2/tests)
                      # and whether the CL-DATA-12 contract-fixes test is present.
                      w4_files = sorted((pathlib.Path.cwd() / 'apps/web-v2/tests').glob('*.test.mjs'))
                      has_cl_data_12 = any(p.name == 'cl-data-12-contract-fixes.test.mjs' for p in w4_files)
                      print(f"::error::W4FILES count={len(w4_files)} has_cl_data_12={has_cl_data_12}")

                  # CL-CI-17b: per-FAIL-group diagnostics — log head/tail into the
                  # step summary (collapsed) and the tail into the step log.
                  name = group.get('name')
                  log_path = logs / (str(name) + '.log')
                  first_line = ''
                  tail_lines = []
                  if log_path.exists():
                      lines = log_path.read_text(errors='replace').splitlines()
                      if lines:
                          first_line = lines[0]
                      tail_lines = lines[-40:]
                  else:
                      tail_lines = ['(log file missing: ' + str(log_path) + ')']
                  summary_lines.append('')
                  summary_lines.append('<details>')
                  summary_lines.append('<summary>FAIL group ' + str(name) + ' log (first line + last 40 lines)</summary>')
                  summary_lines.append('')
                  summary_lines.append('```')
                  summary_lines.append('first line: ' + first_line)
                  for tail_line in tail_lines:
                      summary_lines.append(tail_line)
                  summary_lines.append('```')
                  summary_lines.append('</details>')
                  if name == 'w4-node':
                      import glob
                      test_files = sorted(glob.glob('apps/web-v2/tests/*.test.mjs'))
                      summary_lines.append('')
                      summary_lines.append('w4-node apps/web-v2/tests/*.test.mjs file count: ' + str(len(test_files)))
                      summary_lines.append('')
                      summary_lines.append('```')
                      for test_file in test_files:
                          summary_lines.append(test_file)
                      summary_lines.append('```')
                  for tail_line in tail_lines:
                      print('FAILLOG[' + str(name) + '] ' + tail_line)

              step_summary.write_text('\n'.join(summary_lines) + '\n')
          PY
      - name: Preserve real git-source provenance and full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-merged-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/postmerge-logs/
          if-no-files-found: error
          retention-days: 14
