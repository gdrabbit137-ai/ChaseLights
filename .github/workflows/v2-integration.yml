name: V2 Integration
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - ops/pages/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - ops/pages/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: V2 real merged-tree 444-case Research-only Beta acceptance
    # CL-CI-37: ubuntu-latest resolved to the ubuntu-26.04 image (2026-11 rollout,
    # ubuntu26/20261111.196) which playwright@1.57.0 cannot provision chromium on
    # ("Playwright does not support chromium on ubuntu26.04-x64"); pin the
    # playwright-supported ubuntu-24.04 image until playwright supports 26.04.
    runs-on: ubuntu-24.04
    # CL-I18N-01: the merged-tree suite outgrew the 20-minute job budget —
    # the 2026-11-21 runs were cancelled mid-w4-node at 20:19-20:21, so the
    # gate could never report a real verdict. Raised to 45 minutes.
    timeout-minutes: 45
    env:
      W5_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      W5_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout actual proposed merge or merged main (full Git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /AGENTS.md
            /RESEARCH_EVIDENCE_SPEC_R4_2.md
            /NAVIGATION_SPEC_R4_2.md
            /index.html
            # CL-PAGES-01: 404.html is part of the publish whitelist; absent
            # from the checkout it silently drops out of dist and the build
            # contract reds (it also keeps index.html fallback off the site).
            /404.html
            # CL-PAGES-01: the publish contract (ops/pages/test_build_dist.py)
            # builds dist/ from this checkout; without ops/pages the step dies
            # with ENOENT instead of guarding the whitelist.
            /ops/pages/
            /assets/
            /weather-map.html
            /genre-eval.html
            /field-intake.html
            # CL-CI-37: reminders.html is read by cl-ui-28-site-nav.test.mjs
            # (w4-node); missing here fails that file at module load in CI
            # (11 tests unregistered -> 600-11+1 file-fail = 590 total).
            /reminders.html
            # CL-CI-38: sources.html is read at module load by
            # cl-ui-28-site-nav.test.mjs and cl-ui-101-sources-page.test.mjs
            # (w4-node); missing here fails BOTH files with ENOENT
            /sources.html
            # CL-CI-37: cl-ui-58-reminders.test.mjs reads
            # workers/api/src/index.js and cl-ui-57-favorites-isolation-profile
            # .test.mjs reads workers/api/src/{index,auth}.js plus pins the
            # existence of migrations/0006_users_profile.sql — both files fail
            # in CI when /workers/ or /migrations/ are absent from the sparse
            # tree (load throw -> whole-file fail, 10 tests unregistered).
            /workers/
            /migrations/
            # Root modules imported by packages/core-v2 tests via sys.path[ROOT]
            /lunar_ephemeris.py
            # CL-CI-25: test_cl_data_23 lazily does `import regions` (5km
            # differentiation vs the live tw catalog) and discover_spots.py
            # rerun does the same inside its subprocess — regions ->
            # opportunities -> opportunity_runtime / taxonomy_v004 must all be
            # in the sparse tree or only these two tests go red in CI.
            /regions.py
            /opportunities.py
            /taxonomy_v004.py
            /runtime_catalog_v004_r4_2.json
            # CL-CI-25: opportunities.py imports this manifest at module load
            # (regions.py -> opportunities -> _load_catalog_manifest); missing
            # here reproduces the CI-only test_cl_data_23 ERROR/FAIL pair.
            /runtime_catalog_manifest_r4_2.json
            # CL-CI-11: opportunity_runtime._load_event_calendar reads this root
            # data file at import time; a missing file truncates the
            # lunar_ephemeris -> fetch_data -> opportunity_runtime chain and
            # fails the ASTRO_SAMPLING_PROVENANCE import (w3 loader errors).
            /runtime_event_calendar_r4_2.json
            /tw_weather.json
            /jp_weather.json
            /us_weather.json
            # Root modules imported by w3 astro tests and w4 node tests.
            # CL-CI-09: astro_hourly lazily does `from fetch_data import
            # _radec_to_altaz` (moon_target_separation path), and fetch_data
            # imports the full runtime-module chain below — every transitive
            # root module must be in this list or the sparse checkout fails
            # the ASTRO_SAMPLING_PROVENANCE import with a truncated tree.
            /fetch_data.py
            /opportunity_runtime.py
            /access_state.py
            /astrophotography_environment.py
            /aurora_state.py
            /denali_access.py
            /johnston_ridge_access.py
            /marine_state.py
            /photography_environment.py
            /photography_transparency.py
            /runtime_dependencies.py
            /shinhotaka_access.py
            /spatial_weather.py
            /tide_state.py
            /viirs_nightlights_weathergrid.py
            /yahiko_access.py
            /scripts/
            # CL-I18N-01: locale sidecars and the i18n glossary are read by
            # build_static.py's packaged locales mirror and by the i18n static
            # checks; absent from the sparse tree -> static-build ENOENT
            # (locales/en/catalog.json) and 6 candidate-build-browser fails.
            /locales/
            /i18n/
            /test_i18n_sidecar_static.py
            /weathergrid/
            /specs/v2/
            /data/v2/
            /packages/core-v2/
            /packages/models-v2/
            /apps/web-v2/
            # CL-CI-34: cl-ui-52-guest-comment.test.mjs reads
            # templates/gas_sheet_bridge.js (root /templates/ dir); missing
            # here fails w4-node 1 test (532/1/533 vs pin 540).
            /templates/
            /ops/v2/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # CL-PAGES-06: weather_details/ is no longer committed (948 MiB, rewritten
      # every run). The modal fetches ./weather_details/<region>/<spot>.json, so
      # hydrate the tree from R2 before the tests run — without it every browser
      # test that opens a card paints an EMPTY timeline forever (measured in CI:
      # modalOpen true, timelineGroupsChildren 0 after a 90s wait). Runs after
      # setup-python on purpose: the image's bare python3 has no pip.
      - name: Hydrate weather_details from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          python ops/pages/r2_pull.py --prefix weather_details/ --dest . --workers 32
          # CL-PAGES-09: weathergrid/ left git too (the public data repo owns
          # it). More than cl-wg-12 depends on the tree — the GFS u/v sidecar
          # contract reads all five regional bundles — so pull the whole prefix
          # (~231 MiB, ~30 s) instead of guessing which keys a test needs.
          python ops/pages/r2_pull.py --prefix weathergrid/ --dest . --workers 32
      - name: Install schema and Chromium tooling
        run: |
          python -m pip install 'jsonschema==4.26.0' 'PyYAML==6.0.3' 'tzdata==2025.3'
          npm install --prefix .ci/tooling --no-save --package-lock=false playwright@1.57.0
          # CL-CI-37: CJK font metrics — the ubuntu runner image lacks
          # Noto CJK, so zh/ja label fallback fonts overflow layout probes
          # (CL-UI-78 (7) 1280px zero-horizontal-scroll reds CI-only).
          sudo apt-get install -y fonts-noto-cjk
          .ci/tooling/node_modules/.bin/playwright install --with-deps chromium
          node -e 'const p=require("node:path"); const m=p.resolve(".ci/tooling/node_modules/playwright"); const c=require(m).chromium; console.log("PLAYWRIGHT_MODULE="+m); console.log("CHROMIUM_EXECUTABLE="+c.executablePath());' >> "$GITHUB_ENV"
      # CL-CI-39: three map-dependent browser tests fail only in CI. Record the
      # runner's actual WebGL capability first, so the verdict is evidence-backed:
      # a null context makes every MapLibre assertion downstream meaningless,
      # while a working context means the red is contention, not capability.
      - name: Probe headless Chromium WebGL capability (informational)
        run: node ops/v2/webgl_probe.mjs


      - name: Require exact W1–W4 trees, real browse sources and all 444 checks
        run: |
          python ops/v2/postmerge_verify.py --root . --logs-dir .ci/postmerge-logs
      # CL-E2E-131: the semantic sweep gate. The 2,100-test suite asserts
      # implementation shape; it still shipped 「15:00 日出」 and a modal listing
      # 「昨天」 to a real phone. This gate replays a Taiwan user at 10:00 and
      # 23:00 Asia/Taipei and asserts on the RENDERED DOM — 7 aligned daily
      # rows, no impossible sunrise, no 「✓ 推薦」 on a dead day, the tw camera
      # on mainland Taiwan, and zero engineering tokens in visible copy.
      # Blocking on purpose: a red here means the product lies to a user.
      - name: Gate — E2E semantic sweep (CL-E2E-131)
        run: node --test --test-timeout=180000 apps/web-v2/tests/cl-e2e-131-semantic-sweep.test.mjs
      # CL-CI-17: make postmerge failures diagnosable without CI log access.
      # Emits one-line JSON for the overall result and per-group results, GitHub
      # error annotations for FAIL groups, and a full markdown step summary.
      - name: Report postmerge summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib

          logs = pathlib.Path('.ci/postmerge-logs')
          summary_path = logs / 'postmerge-summary.json'
          step_summary = pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])

          if not summary_path.exists():
              step_summary.write_text('postmerge summary missing\n')
              print('postmerge summary missing')
          else:
              report = json.loads(summary_path.read_text())

              overall = {
                  'status': report.get('status'),
                  'error': report.get('error'),
                  'counts': report.get('counts'),
              }
              print(json.dumps(overall))

              for group in report.get('groups', []):
                  counts = group.get('counts') or {}
                  line = {
                      'name': group.get('name'),
                      'status': group.get('status'),
                      'tests': counts.get('tests'),
                      'pass': counts.get('pass'),
                      'fail': counts.get('fail'),
                      'error': counts.get('error'),
                      'gate_error': group.get('gate_error'),
                  }
                  print(json.dumps(line))

              summary_lines = []
              summary_lines.append('# Postmerge summary')
              summary_lines.append('')
              summary_lines.append('```json')
              summary_lines.append(json.dumps(overall))
              summary_lines.append('```')
              summary_lines.append('')
              summary_lines.append('| name | status | tests | pass | fail | error | gate_error |')
              summary_lines.append('| --- | --- | --- | --- | --- | --- | --- |')
              for group in report.get('groups', []):
                  counts = group.get('counts') or {}
                  gate = (group.get('gate_error') or '').replace('|', '\\|')
                  summary_lines.append(
                      '| {name} | {status} | {tests} | {passed} | {fail} | {error} | {gate} |'.format(
                          name=group.get('name'),
                          status=group.get('status'),
                          tests=counts.get('tests'),
                          passed=counts.get('pass'),
                          fail=counts.get('fail'),
                          error=counts.get('error'),
                          gate=gate,
                      ))

              for group in report.get('groups', []):
                  if group.get('status') != 'FAIL':
                      continue
                  gate = (group.get('gate_error') or 'no gate_error captured').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error::group={group.get('name')} gate_error={gate}")

                  # CL-CI-17c: surface the tail of each FAIL group's TAP log as an
                  # annotation, since check-run annotations are the only output
                  # readable without repository/CI-log access.
                  faillog_name = group.get('name') or 'unknown'
                  log_path = logs / f"{faillog_name}.log"
                  faillog = ''
                  if log_path.exists():
                      faillog = '\n'.join(
                          log_path.read_text(errors='replace').splitlines()[-6:])
                  if len(faillog) > 900:
                      faillog = faillog[:899] + '\u2026'
                  faillog = faillog.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error::FAILLOG {faillog_name} {faillog}")

                  # CL-CI-17d: for any FAIL group with fail>0, emit the failing
                  # test names ('not ok' TAP lines) and cl-data-12 grep hits.
                  try:
                      fail_count = int((group.get('counts') or {}).get('fail') or 0)
                  except (TypeError, ValueError):
                      fail_count = 0
                  if fail_count > 0 and log_path.exists():
                      dlog_lines = log_path.read_text(errors='replace').splitlines()
                      notok = [ln[:180] for ln in dlog_lines if ln.startswith('not ok')][:8]
                      # Python unittest groups log 'FAIL: test_x' / 'ERROR: test_x'
                      # lines instead of TAP 'not ok' — include them (CL-CI-22).
                      notok += [ln[:180] for ln in dlog_lines
                                if ln.startswith('FAIL: ') or ln.startswith('ERROR: ')][:8]
                      notok = [ln.replace('%', '%25').replace('\r', '%0D') for ln in notok]
                      print(f"::error::FAILNOTOK {faillog_name} " + '%0A'.join(notok))
                      cl12 = [ln[:150] for ln in dlog_lines if 'cl-data-12' in ln.lower()][:2]
                      cl12_count = sum(1 for ln in dlog_lines if 'cl-data-12' in ln.lower())
                      cl12 = [ln.replace('%', '%25').replace('\r', '%0D') for ln in cl12]
                      print(f"::error::CL12GREP count={cl12_count} " + '%0A'.join(cl12))

                  if faillog_name == 'w4-node':
                      # CL-CI-17c: w4-node pin diagnostics — how many *.test.mjs
                      # files CI globs (postmerge_verify globs apps/web-v2/tests)
                      # and whether the CL-DATA-12 contract-fixes test is present.
                      w4_files = sorted((pathlib.Path.cwd() / 'apps/web-v2/tests').glob('*.test.mjs'))
                      has_cl_data_12 = any(p.name == 'cl-data-12-contract-fixes.test.mjs' for p in w4_files)
                      print(f"::error::W4FILES count={len(w4_files)} has_cl_data_12={has_cl_data_12}")

                  # CL-CI-17b: per-FAIL-group diagnostics — log head/tail into the
                  # step summary (collapsed) and the tail into the step log.
                  name = group.get('name')
                  log_path = logs / (str(name) + '.log')
                  first_line = ''
                  tail_lines = []
                  if log_path.exists():
                      lines = log_path.read_text(errors='replace').splitlines()
                      if lines:
                          first_line = lines[0]
                      tail_lines = lines[-40:]
                  else:
                      tail_lines = ['(log file missing: ' + str(log_path) + ')']
                  summary_lines.append('')
                  summary_lines.append('<details>')
                  summary_lines.append('<summary>FAIL group ' + str(name) + ' log (first line + last 40 lines)</summary>')
                  summary_lines.append('')
                  summary_lines.append('```')
                  summary_lines.append('first line: ' + first_line)
                  for tail_line in tail_lines:
                      summary_lines.append(tail_line)
                  summary_lines.append('```')
                  summary_lines.append('</details>')
                  if name == 'w4-node':
                      import glob
                      test_files = sorted(glob.glob('apps/web-v2/tests/*.test.mjs'))
                      summary_lines.append('')
                      summary_lines.append('w4-node apps/web-v2/tests/*.test.mjs file count: ' + str(len(test_files)))
                      summary_lines.append('')
                      summary_lines.append('```')
                      for test_file in test_files:
                          summary_lines.append(test_file)
                      summary_lines.append('```')
                  for tail_line in tail_lines:
                      print('FAILLOG[' + str(name) + '] ' + tail_line)

              step_summary.write_text('\n'.join(summary_lines) + '\n')
          PY
      # CL-PAGES-01: whitelist publish contract. The static origin must carry
      # only the runtime surface — this is the guard that keeps
      # workers/api/src/*, specs/, AGENTS.md and data/v2/staging off the site.
      - name: Contract — Cloudflare Pages whitelist publish
        run: python ops/pages/test_build_dist.py

      - name: Preserve real git-source provenance and full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-merged-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/postmerge-logs/
          if-no-files-found: error
          retention-days: 14
