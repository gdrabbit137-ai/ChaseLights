name: V2 Integration
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-integration.yml
      - ops/v2/**
      - specs/v2/**
      - data/v2/**
      - packages/core-v2/**
      - packages/models-v2/**
      - apps/web-v2/**
      - AGENTS.md
      - '*SPEC_R4_2.md'
      - index.html
      - assets/app.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: V2 real merged-tree 157-case research-only, solar WINDOW and NOAA source acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout actual proposed merge or merged main (full Git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/v2-integration.yml
            /AGENTS.md
            /RESEARCH_EVIDENCE_SPEC_R4_2.md
            /NAVIGATION_SPEC_R4_2.md
            /CNAME
            /index.html
            /assets/app.js
            /specs/v2/
            /data/v2/
            /packages/core-v2/
            /packages/models-v2/
            /apps/web-v2/
            /ops/v2/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install schema and Chromium tooling
        run: |
          python -m pip install 'jsonschema==4.26.0'
          npm install --prefix .ci/tooling --no-save --package-lock=false playwright@1.57.0
          .ci/tooling/node_modules/.bin/playwright install --with-deps chromium
          node -e 'const p=require("node:path"); const m=p.resolve(".ci/tooling/node_modules/playwright"); const c=require(m).chromium; console.log("PLAYWRIGHT_MODULE="+m); console.log("CHROMIUM_EXECUTABLE="+c.executablePath());' >> "$GITHUB_ENV"
      - name: Require W1–W4 source trees, research-only safety, 14 solar plus 15 NWS raw-source tests and all 157 checks
        run: |
          python ops/v2/postmerge_verify.py --root . --logs-dir .ci/postmerge-logs
      - name: Preserve real git-source provenance and full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-merged-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/postmerge-logs/
          if-no-files-found: error
          retention-days: 14
