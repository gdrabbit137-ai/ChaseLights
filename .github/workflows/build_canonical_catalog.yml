name: Build canonical runtime catalog

on:
  push:
    branches:
      - refactor/canonical-runtime-catalog
    paths:
      - "tools/build_canonical_runtime_catalog.py"
      - "opportunities.py"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - "runtime_catalog_v004_r4_2_b28_additions.json"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - "runtime_catalog_v004_r4_2_b33_hualien_additions.json"
      - "runtime_catalog_v004_r4_2_b34_liushishishan_additions.json"
      - "runtime_catalog_v004_r4_2_b35_liyu_subjects.json"
      - ".github/workflows/build_canonical_catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-runtime-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build canonical catalog
        run: python tools/build_canonical_runtime_catalog.py
      - name: Validate JSON and current adapter
        run: |
          python -m json.tool runtime_catalog_v004_r4_2.json >/dev/null
          python test_opportunity_adapter.py
      - name: Commit canonical catalog
        run: |
          if git diff --quiet -- runtime_catalog_v004_r4_2.json && git ls-files --error-unmatch runtime_catalog_v004_r4_2.json >/dev/null 2>&1; then
            echo "Canonical catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_catalog_v004_r4_2.json
          git commit -m "Generate canonical R4.2 runtime catalog"
          git push origin HEAD:refactor/canonical-runtime-catalog
