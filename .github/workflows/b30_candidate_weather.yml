name: B30 Taiwan Candidate Weather QA

on:
  push:
    branches:
      - r4.2-b28-p0-missing-places
      - r4.2-b31-place-weather-details
      - r4.2-b32-jp-research-batch01
      - r4.2-b32-jp025-hagi
    paths:
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "access_state.py"
      - "taxonomy_v004.py"
      - "runtime_catalog_v004_r4_2_b28_additions.json"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - ".github/workflows/b30_candidate_weather.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b30-taiwan-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Taiwan candidate weather
        run: python analyze_weather.py tw

      - name: Validate B30 candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("tw_weather.json").read_text(encoding="utf-8"))
          details = json.loads(Path("tw_weather_details.json").read_text(encoding="utf-8"))

          summary_spots = summary.get("spots") if isinstance(summary, dict) else summary
          detail_spots = details.get("spots") if isinstance(details, dict) else details
          assert summary.get("schema_version") == 10, summary.get("schema_version")
          assert details.get("schema_version") == 10, details.get("schema_version")
          assert isinstance(summary_spots, list), type(summary_spots)
          assert isinstance(detail_spots, list), type(detail_spots)

          assert len(summary_spots) == 80, f"summary expected 80, got {len(summary_spots)}"
          assert len(detail_spots) == 80, f"details expected 80, got {len(detail_spots)}"

          sids = [s["spot_id"] for s in summary_spots]
          dids = [s["spot_id"] for s in detail_spots]
          assert len(set(sids)) == 80
          assert len(set(dids)) == 80
          assert "tw-063" not in sids
          assert "tw-063" not in dids
          assert set(sids) == set(dids)

          valid_nav_states = {"verified", "provisional_camera_anchor", "needs_review", "multiple_access_routes"}
          assert all((s.get("navigation_target") or {}).get("status") in valid_nav_states for s in summary_spots)

          jialuo = next(s for s in summary_spots if s.get("name_i18n", {}).get("zh-TW") == "加羅湖")
          assert jialuo["navigation_target"]["status"] == "needs_review", jialuo["navigation_target"]
          assert "lat" not in jialuo["navigation_target"]
          assert "lon" not in jialuo["navigation_target"]

          nanya = next(s for s in summary_spots if "南雅奇岩" in s.get("name_i18n", {}).get("zh-TW", ""))
          assert nanya["navigation_target"]["status"] == "provisional_camera_anchor", nanya["navigation_target"]
          assert nanya["navigation_target"]["lat"] == nanya["lat"]
          assert nanya["navigation_target"]["lon"] == nanya["lon"]

          shard_dir = Path("weather_details") / "tw"
          shard_files = sorted(shard_dir.glob("tw-*.json"))
          assert len(shard_files) == 80, f"expected 80 Taiwan detail shards, got {len(shard_files)}"
          shard_ids = []
          for shard_path in shard_files:
              shard = json.loads(shard_path.read_text(encoding="utf-8"))
              assert shard.get("updated_at") == summary.get("updated_at"), (
                  shard_path.name,
                  shard.get("updated_at"),
                  summary.get("updated_at"),
              )
              detail = shard.get("spot") or {}
              assert shard.get("spot_id") == detail.get("spot_id"), shard_path.name
              assert detail.get("spot_id"), shard_path.name
              shard_ids.append(detail["spot_id"])
          assert set(shard_ids) == set(sids)
          assert "tw-063" not in shard_ids

          pending = []
          winner_errors = []
          no_viable_days = []
          high_score_days = []
          for spot in summary_spots:
              opportunities = spot.get("opportunities") or []
              if not opportunities:
                  pending.append(spot["spot_id"])
                  continue
              days = spot.get("daily") or []
              if not days:
                  winner_errors.append((spot["spot_id"], "no_daily"))
                  continue
              for day in days:
                  winner = day.get("all") or {}
                  if winner.get("research_pending"):
                      winner_errors.append((spot["spot_id"], day.get("date"), "unexpected_research_pending"))
                  if winner.get("no_viable_opportunity"):
                      no_viable_days.append((spot["spot_id"], day.get("date")))
                      if winner.get("opportunity_id"):
                          winner_errors.append((spot["spot_id"], day.get("date"), "no_viable_has_opportunity_id"))
                      if winner.get("research_pending"):
                          winner_errors.append((spot["spot_id"], day.get("date"), "no_viable_marked_research_pending"))
                      continue
                  if not winner.get("opportunity_id"):
                      winner_errors.append((spot["spot_id"], day.get("date"), "no_opportunity_id"))
                  if not isinstance(day.get("opportunities"), dict) or not day["opportunities"]:
                      winner_errors.append((spot["spot_id"], day.get("date"), "no_daily_opportunities"))
                  if winner.get("temporal_eligible") is False:
                      winner_errors.append((spot["spot_id"], day.get("date"), "temporally_impossible_winner"))
                  if winner.get("access_open") is False:
                      winner_errors.append((spot["spot_id"], day.get("date"), "closed_access_winner"))
                  score = winner.get("score")
                  if isinstance(score, (int, float)) and score >= 80:
                      high_score_days.append((spot["spot_id"], day.get("date"), score))
                      if winner.get("status_key") not in {"OPPORTUNITY_MATCH", "OPPORTUNITY_SIMPLE_MATCH"}:
                          winner_errors.append((spot["spot_id"], day.get("date"), "high_score_bad_status", winner.get("status_key")))
                      if winner.get("condition_state") not in {"dedicated_conditions_match", "minimum_sufficient_conditions_match"}:
                          winner_errors.append((spot["spot_id"], day.get("date"), "high_score_bad_condition_state", winner.get("condition_state")))

          assert pending == [], f"Taiwan research-pending Places: {pending}"
          assert winner_errors == [], f"Opportunity winner errors: {winner_errors[:20]}"

          stale = [s["spot_id"] for s in summary_spots if s.get("data_stale")]
          report = {
              "summary_count": len(summary_spots),
              "details_count": len(detail_spots),
              "detail_shard_count": len(shard_files),
              "stale_spot_count": len(stale),
              "stale_spots": stale,
              "retired_tw_063_present": False,
              "research_pending_count": len(pending),
              "no_viable_day_count": len(no_viable_days),
              "high_score_day_count": len(high_score_days),
              "winner_error_count": len(winner_errors),
          }
          Path("b30_candidate_validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload B30 candidate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b30-taiwan-candidate-weather
          path: |
            tw_weather.json
            tw_weather_details.json
            b30_candidate_validation.json
          retention-days: 7
