name: B105 Qingshui Morning Snapshot Capture

on:
  push:
    branches:
      - b105-qingshui-morning-window-baseline
    paths:
      - "B105_CAPTURE_TRIGGER.md"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified production commit
        uses: actions/checkout@v4
        with:
          ref: 808a585ba2c3f087c6d49a60d6a3d1bcb39ca9e6
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Capture Qingshui 06:00 forecast snapshot
        run: |
          rm -rf captured_snapshot
          mkdir -p captured_snapshot
          env -u GITHUB_SHA python field_snapshot.py capture \
            --place tw-034 \
            --valid-at 2026-09-29T06:00:00+08:00 \
            --output-dir captured_snapshot
          SNAPSHOT="$(ls captured_snapshot/FVS-*.json | head -n 1)"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

      - name: Validate and show snapshot
        run: |
          env -u GITHUB_SHA python field_snapshot.py validate "$SNAPSHOT"
          env -u GITHUB_SHA python field_snapshot.py show "$SNAPSHOT"

      - name: Replay against original production commit
        run: |
          env -u GITHUB_SHA python field_snapshot.py replay "$SNAPSHOT" --original > captured_snapshot/replay-original.json
          cat captured_snapshot/replay-original.json

      - name: Record capture metadata
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["SNAPSHOT"])
          s = json.loads(p.read_text())
          metadata = {
              "snapshot_file": p.name,
              "snapshot_id": s["snapshot_id"],
              "place_id": s["place_id"],
              "captured_at": s["captured_at"],
              "forecast_valid_at": s["forecast_valid_at"],
              "forecast_local_date": s["normalized_input"].get("local_date"),
              "forecast_local_time": s["normalized_input"].get("local_time"),
              "git_commit": s["provenance"]["git_commit"],
              "payload_sha256": s["integrity"]["payload_sha256"],
              "observation_status": s["observation"]["status"],
          }
          Path("captured_snapshot/capture-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Upload immutable snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingshui-b105-morning-snapshot
          path: captured_snapshot/
          if-no-files-found: error
          retention-days: 90

      - name: Commit permanent compressed replay fixture
        run: |
          SNAPSHOT_BASENAME="$(basename "$SNAPSHOT")"
          FIXTURE_DIR="test_fixtures/field_snapshot"
          ARCHIVE_NAME="$SNAPSHOT_BASENAME.gz.b64"
          METADATA_NAME="${SNAPSHOT_BASENAME%.json}.metadata.json"

          mkdir -p /tmp/b105-fixture
          gzip -c "$SNAPSHOT" | base64 -w 76 > "/tmp/b105-fixture/$ARCHIVE_NAME"
          cp captured_snapshot/capture-metadata.json "/tmp/b105-fixture/$METADATA_NAME"

          git fetch origin b105-qingshui-morning-window-baseline
          git checkout -B b105-qingshui-morning-window-baseline origin/b105-qingshui-morning-window-baseline
          mkdir -p "$FIXTURE_DIR"
          cp "/tmp/b105-fixture/$ARCHIVE_NAME" "$FIXTURE_DIR/$ARCHIVE_NAME"
          cp "/tmp/b105-fixture/$METADATA_NAME" "$FIXTURE_DIR/$METADATA_NAME"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$FIXTURE_DIR/$ARCHIVE_NAME" "$FIXTURE_DIR/$METADATA_NAME"
          git commit -m "B105 archive Qingshui 06:00 forecast snapshot"
          git push origin HEAD:b105-qingshui-morning-window-baseline
