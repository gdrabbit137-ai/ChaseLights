name: Update ChaseLights Weather Data
# Production weather refresh: canonical runtime inputs + 3-hour schedule

on:
  push:
    branches:
      - main
    paths:
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "runtime_catalog_v004_r4_2.json"
      - "runtime_event_calendar_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "aurora_state.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "johnston_ridge_access.py"
      - "denali_access.py"
      - "taxonomy_v004.py"
  schedule:
    # 每 3 小時更新一次攝影氣象資料
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 避免前一次更新尚未完成時又啟動新的排程
concurrency:
  group: chaselights-weather-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-weather:
    # CL-PAGES-07: the heavy refreshes can run on Richard's Windows box
    # (C:\actions-runner-chaselights) without spending hosted minutes. Unset
    # repository variable CL_RUNNER = current behaviour (ubuntu-latest), so this
    # is a one-keystroke rollback rather than a rewrite.
    runs-on: ${{ vars.CL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Weather Analysis for All Regions
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp
          python analyze_weather.py us

      # CL-PAGES-06: weather_details/ is 948 MiB of per-spot 96h shards that
      # churn every run. It is served from R2 (data.chaselights.app) and is no
      # longer committed, so the only copy is the one this step publishes.
      - name: Publish weather_details to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          python ops/pages/r2_sync.py --apply --only weather_details --from-disk --workers 12
          # fail loudly if the shard count regressed (an analyze_weather.py
          # crash would otherwise publish a half-empty tree)
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("weather_details")
          counts = {r.name: len(list(r.glob("*.json"))) for r in sorted(root.iterdir()) if r.is_dir()}
          print("published shards:", counts)
          empty = [r for r, n in counts.items() if n == 0]
          if empty:
              sys.exit(f"region(s) produced no shards: {empty}")
          PY

      - name: Commit and Push Updated Weather Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Score V5/B45：區域 summary；per-Place 96H shards 已改走 R2（不再 commit）
          git add tw_weather.json jp_weather.json us_weather.json
          git rm -f --ignore-unmatch tw_weather_details.json jp_weather_details.json us_weather_details.json
          git rm -f --ignore-unmatch usa_weather.json

          # 清除 Score V4 以前不再使用的多語系 JSON（若不存在則忽略）
          git rm -f --ignore-unmatch             *_weather_zh-TW.json             *_weather_en.json             *_weather_ja.json

          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update ChaseLights weather data [skip ci]"
            pushed=false
            for i in {1..5}; do
              if git pull --rebase && git push; then
                pushed=true
                break
              fi
              if [ "$i" -lt 5 ]; then
                sleep 5
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to publish refreshed weather data after 5 attempts."
              exit 1
            fi
          else
            echo "No weather data changes found."
          fi
