name: Update ChaseLights Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        region: [tw, jp, us]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weather analysis for ${{ matrix.region }}
        run: |
          python analyze_weather.py ${{ matrix.region }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase
          git add *_weather.json
          git diff-index --quiet HEAD || git commit -m "Auto-update ${{ matrix.region }} weather data [skip ci]"
          git push
