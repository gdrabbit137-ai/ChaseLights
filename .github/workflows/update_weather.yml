name: Update ChaseLights Data

on:
  schedule:
    - cron: '0 */3 * * *'  # 每 3 小時自動執行一次
  workflow_dispatch:       # 支援手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 必須開啟寫入權限以 Commit/Push 檔案

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weather analysis
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp
          python analyze_weather.py us

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          git add latest_weather.json japan_weather.json usa_weather.json
          git diff-index --quiet HEAD || git commit -m "Auto-update weather data [skip ci]"
          git push
