name: Update ChaseLights Weather Data

on:
  schedule:
    # 每 3 小時自動執行一次氣象數據更新
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動觸發執行

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Weather Analysis for All Regions
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp
          python analyze_weather.py us

      - name: Commit and Push Updated Weather Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 💡 重要：加入 *_weather_*.json 以涵蓋所有多語系產出的 JSON 檔
          git add *_weather_*.json *_weather.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update multi-language weather data [skip ci]"
            for i in {1..5}; do
              git pull --rebase && git push && break || sleep 5
            done
          else
            echo "No weather data changes found."
          fi
