name: Update ChaseLights Weather Data
# Production weather refresh: canonical runtime inputs + 3-hour schedule

on:
  push:
    branches:
      - main
    paths:
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "runtime_catalog_v004_r4_2.json"
      - "runtime_event_calendar_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "aurora_state.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "johnston_ridge_access.py"
      - "taxonomy_v004.py"
  schedule:
    # 每 3 小時更新一次攝影氣象資料
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 避免前一次更新尚未完成時又啟動新的排程
concurrency:
  group: chaselights-weather-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Weather Analysis for All Regions
        run: |
          python analyze_weather.py tw
          python analyze_weather.py jp
          python analyze_weather.py us

      - name: Commit and Push Updated Weather Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Score V5/B45：區域 summary + per-Place 96H shards
          git add tw_weather.json jp_weather.json us_weather.json weather_details/
          git rm -f --ignore-unmatch tw_weather_details.json jp_weather_details.json us_weather_details.json
          git rm -f --ignore-unmatch usa_weather.json

          # 清除 Score V4 以前不再使用的多語系 JSON（若不存在則忽略）
          git rm -f --ignore-unmatch             *_weather_zh-TW.json             *_weather_en.json             *_weather_ja.json

          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update ChaseLights weather data [skip ci]"
            for i in {1..5}; do
              git pull --rebase && git push && break || sleep 5
            done
          else
            echo "No weather data changes found."
          fi
