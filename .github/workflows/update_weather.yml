name: Update ChaseLights Data

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 執行氣象分析腳本
      run: |
        python analyze_weather.py tw

    - name: 自動 Commit 與 Push 變更
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add latest_weather.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: ⏱️ ChaseLights 自動更新即時氣象預報 [skip ci]" && git push)
