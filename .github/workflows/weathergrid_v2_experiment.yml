name: WeatherGrid V2 Experiment

on:
  pull_request:
    paths:
      - "weather-map-v2.html"
      - "assets/weather-map-v2.js"
      - "assets/weather-map-v2-tile-loader.js"
      - "test_weathergrid_v2_browser_tiles.py"
      - "assets/weather-map-v2.css"
      - "test_weathergrid_v2_experiment.py"
      - "test_weathergrid_viewport_fetch.py"
      - "weathergrid_viewport_fetch.py"
      - "weathergrid_native_viewport.py"
      - "weathergrid_v2_cache_index.py"
      - "test_weathergrid_v2_cache_index.py"
      - "weathergrid_v2_capacity.py"
      - "weathergrid_v2_tile_export.py"
      - "weathergrid_v2_publish.py"
      - "test_weathergrid_v2_publish.py"
      - "test_weathergrid_v2_tile_export.py"
      - "test_weathergrid_v2_capacity.py"
      - ".github/workflows/weathergrid_v2_experiment.yml"
      - "weathergrid_v2_public_smoke.py"
  push:
    branches: [main]
    paths:
      - "weather-map-v2.html"
      - "assets/weather-map-v2.js"
      - "assets/weather-map-v2-tile-loader.js"
      - "assets/weather-map-v2.css"
      - "weathergrid/v2/**"
      - "weathergrid_v2_public_smoke.py"
      - ".github/workflows/weathergrid_v2_experiment.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Static V2 contract
        run: |
          python -m py_compile weathergrid_v2_public_smoke.py
          python test_weathergrid_v2_experiment.py
      - name: Native viewport contract
        run: python -m unittest -v test_weathergrid_viewport_fetch.py
      - name: Static regional cache contract
        run: |
          python -m unittest -v test_weathergrid_v2_cache_index.py
          python weathergrid_v2_cache_index.py --output /tmp/weathergrid-v2-index.json
          python -m unittest -v test_weathergrid_v2_capacity.py
          python -m unittest -v test_weathergrid_v2_tile_export.py
          python -m unittest -v test_weathergrid_v2_publish.py
          python -m unittest -v test_weathergrid_v2_browser_tiles.py
          python -c 'import json; d=json.load(open("/tmp/weathergrid-v2-index.json")); assert d["regions"]["jp"]["cells"]'
      - name: Static site smoke
        run: |
          python -m http.server 8000 >/tmp/weathergrid-v2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/weather-map-v2.html > /tmp/weather-map-v2.html; then
              break
            fi
            sleep 1
          done
          grep -q "WeatherGrid V2" /tmp/weather-map-v2.html
          grep -q "weather-map-v2.js" /tmp/weather-map-v2.html


  deployed-smoke:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Wait for V2 GitHub Pages publication
        run: |
          expected_html_sha="$(sha256sum weather-map-v2.html | awk '{print $1}')"
          expected_js_sha="$(sha256sum assets/weather-map-v2.js | awk '{print $1}')"
          ready=0
          for i in {1..24}; do
            nonce="${GITHUB_SHA}-${i}-$(date +%s)"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/weather-map-v2.html?pages_probe=${nonce}" -o /tmp/v2.html || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/assets/weather-map-v2.js?pages_probe=${nonce}" -o /tmp/v2.js || true
            if [[ -s /tmp/v2.html && -s /tmp/v2.js ]] && [[ "$(sha256sum /tmp/v2.html | awk '{print $1}')" == "$expected_html_sha" ]] && [[ "$(sha256sum /tmp/v2.js | awk '{print $1}')" == "$expected_js_sha" ]]; then ready=1; break; fi
            sleep 15
          done
          test "$ready" -eq 1
      - name: Run deployed V2 browser smoke
        run: |
          mkdir -p artifacts
          python weathergrid_v2_public_smoke.py --screenshot artifacts/weathergrid-v2-public-smoke.png | tee artifacts/weathergrid-v2-public-smoke.json
      - name: Upload V2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weathergrid-v2-public-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
