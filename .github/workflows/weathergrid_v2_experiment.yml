name: WeatherGrid V2 Experiment

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "assets/weather-map-v2-tile-loader.js"
      - "assets/weather-map-v2-sampling.js"
      - "test_weathergrid_v2_browser_tiles.py"
      - "test_weathergrid_v2_experiment.py"
      - "test_weathergrid_v2_geo.mjs"
      - "test_weathergrid_viewport_fetch.py"
      - "weathergrid_viewport_fetch.py"
      - "weathergrid_native_viewport.py"
      - "weathergrid_v2_cache_index.py"
      - "test_weathergrid_v2_cache_index.py"
      - "weathergrid_v2_capacity.py"
      - "weathergrid_v2_tile_export.py"
      - "weathergrid_v2_publish.py"
      - "test_weathergrid_v2_publish.py"
      - "weathergrid_v2_cwa_publish.py"
      - "test_weathergrid_v2_cwa_publish.py"
      - "cwa_weathergrid_derived.py"
      - "test_weathergrid_v2_tile_export.py"
      - "test_weathergrid_v2_capacity.py"
      - ".github/workflows/weathergrid_v2_experiment.yml"
      - "weathergrid_v2_public_smoke.py"
  push:
    branches: [main]
    paths:
      - "assets/weather-map-v2-tile-loader.js"
      - "assets/weather-map-v2-sampling.js"
      - "weathergrid/v2/**"
      - "weathergrid_v2_public_smoke.py"
      - ".github/workflows/weathergrid_v2_experiment.yml"
  workflow_run:
    workflows: ["Update WeatherGrid V2 JMA Native Tiles", "Update WeatherGrid V2 CWA Derived Tiles"]
    types: [completed]
  workflow_dispatch:

jobs:
  contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Static V2 contract
        run: |
          python -m py_compile weathergrid_v2_public_smoke.py
          python test_weathergrid_v2_experiment.py
          node test_weathergrid_v2_geo.mjs
      - name: Native viewport contract
        run: python -m unittest -v test_weathergrid_viewport_fetch.py
      - name: Static regional cache contract
        run: |
          python -m unittest -v test_weathergrid_v2_cache_index.py
          python weathergrid_v2_cache_index.py --output /tmp/weathergrid-v2-index.json
          python -m unittest -v test_weathergrid_v2_capacity.py
          python -m unittest -v test_weathergrid_v2_tile_export.py
          python -m unittest -v test_weathergrid_v2_publish.py
          python -m unittest -v test_weathergrid_v2_cwa_publish.py
          python -m unittest -v test_weathergrid_v2_browser_tiles.py
          python -c 'import json; d=json.load(open("/tmp/weathergrid-v2-index.json")); assert d["regions"]["jp"]["cells"]'
      - name: Static site smoke
        run: |
          python -m http.server 8000 >/tmp/weathergrid-v2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/assets/weather-map-v2-tile-loader.js > /tmp/v2-loader.js \
              && curl --fail --silent http://127.0.0.1:8000/assets/weather-map-v2-sampling.js > /tmp/v2-sampling.js; then
              break
            fi
            sleep 1
          done
          test -s /tmp/v2-loader.js
          test -s /tmp/v2-sampling.js
          grep -q "coverageContainsViewport" /tmp/v2-loader.js
          grep -q "sampleGrid\|chunkPoints" /tmp/v2-sampling.js


  deployed-smoke:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Wait for V2 GitHub Pages publication
        run: |
          expected_loader_sha="$(sha256sum assets/weather-map-v2-tile-loader.js | awk '{print $1}')"
          expected_sampling_sha="$(sha256sum assets/weather-map-v2-sampling.js | awk '{print $1}')"
          expected_index_sha="$(sha256sum weathergrid/v2/index.json | awk '{print $1}')"
          expected_jma_manifest_sha="$(sha256sum weathergrid/v2/jma/current/manifest.json | awk '{print $1}')"
          ready=0
          for i in {1..60}; do
            nonce="${GITHUB_SHA}-${i}-$(date +%s)"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/assets/weather-map-v2-tile-loader.js?pages_probe=${nonce}" -o /tmp/v2-loader.js || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/assets/weather-map-v2-sampling.js?pages_probe=${nonce}" -o /tmp/v2-sampling.js || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/weathergrid/v2/index.json?pages_probe=${nonce}" -o /tmp/v2-index.json || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://chaselights.app/weathergrid/v2/jma/current/manifest.json?pages_probe=${nonce}" -o /tmp/v2-jma-manifest.json || true
            if [[ -s /tmp/v2-loader.js && -s /tmp/v2-sampling.js && -s /tmp/v2-index.json && -s /tmp/v2-jma-manifest.json ]] \
              && [[ "$(sha256sum /tmp/v2-loader.js | awk '{print $1}')" == "$expected_loader_sha" ]] \
              && [[ "$(sha256sum /tmp/v2-sampling.js | awk '{print $1}')" == "$expected_sampling_sha" ]] \
              && [[ "$(sha256sum /tmp/v2-index.json | awk '{print $1}')" == "$expected_index_sha" ]] \
              && [[ "$(sha256sum /tmp/v2-jma-manifest.json | awk '{print $1}')" == "$expected_jma_manifest_sha" ]]; then ready=1; break; fi
            sleep 15
          done
          test "$ready" -eq 1
      - name: Deployed V2 page browser smoke (removed with page)
        run: |
          echo "weather-map-v2.html was removed (CL-WG-06); tile publication checks above cover the retained artifacts."
          echo "weathergrid_v2_public_smoke.py is kept for tile-pipeline work but has no deployed page to drive."
