name: V2 NOAA NWS Live Raw Source Probe
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2_nws_live_probe.yml
      - ops/v2/nws_live_probe.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-noaa-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  one-shot-source:
    name: Actual NOAA gridpoint TLS/interval/provenance, never photo scoring
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /specs/v2/schema/weather-source-record-v0.1.schema.json
            /packages/core-v2/adapters/nws_gridpoint.py
            /ops/v2/nws_live_probe.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raw-source validation dependency
        run: python -m pip install 'jsonschema==4.26.0'
      - name: One official NWS /points to gridpoint live read
        run: |
          python ops/v2/nws_live_probe.py --output .ci/nws-live-probe.json
      - name: Preserve source URI/hash, actual validity and explicit unknowns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-nws-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/nws-live-probe.json
          if-no-files-found: error
          retention-days: 14
