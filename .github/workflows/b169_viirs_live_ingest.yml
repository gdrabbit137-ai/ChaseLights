name: B169 VIIRS Live WeatherGrid Ingest (GIBS daily DNB)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Observation date (YYYY-MM-DD); empty = yesterday UTC"
        required: false
        default: ""
      region:
        description: "Region to ingest (tw | jp | us | ak | hi)"
        required: true
        default: "tw"
      bbox:
        description: "left,bottom,right,top (empty = region default)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  live-ingest:
    runs-on: ubuntu-latest
    # CL-CI-20: GIBS public WMTS needs no credentials; the us bbox still pulls
    # ~90 tiles at level 6, so keep a generous timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve region parameters
        id: region
        run: |
          # CL-CI-20: region-parameterized GIBS daily DNB ingest. Outputs follow
          # viirs_nightlights_<region>_browser.json, matching
          # assets/weather-map.js REGION_SOURCE_CATALOG.viirs.file().
          case "${{ inputs.region }}" in
            jp)
              default_bbox="122,24,146,46";;
            us)
              default_bbox="-125,25,-70.5,49.5";;
            ak)
              default_bbox="-158,55,-132,69.5";;
            hi)
              default_bbox="-160.3,18.8,-154.8,22.4";;
            *)
              default_bbox="119.5,21.5,122.5,25.5";;
          esac
          if [ -n "${{ inputs.bbox }}" ]; then
            echo "bbox=${{ inputs.bbox }}" >> "$GITHUB_OUTPUT"
          else
            echo "bbox=$default_bbox" >> "$GITHUB_OUTPUT"
          fi
          echo "browser=viirs_nightlights_${{ inputs.region }}_browser.json" >> "$GITHUB_OUTPUT"
          echo "qc=viirs_nightlights_${{ inputs.region }}_qc.json" >> "$GITHUB_OUTPUT"
      - name: Resolve observation date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            date="${{ inputs.date }}"
          else
            date="$(date -u -d yesterday +%F)"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - name: Download GIBS NOAA-20 DNB tiles (fail-closed)
        run: |
          python viirs_gibs_download.py \
            --date="${{ steps.date.outputs.date }}" \
            --region="${{ inputs.region }}" \
            --bbox="${{ steps.region.outputs.bbox }}" \
            --output-dir .cache/viirs_gibs
      - name: Build WeatherGrid mosaic
        run: |
          python viirs_nightlights_ingest.py \
            --tiles-manifest .cache/viirs_gibs/manifest.json \
            --bbox="${{ steps.region.outputs.bbox }}" \
            --output "weathergrid/${{ steps.region.outputs.browser }}" \
            --qc-output "weathergrid/${{ steps.region.outputs.qc }}"
      - name: Validate artifact semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          browser = "${{ steps.region.outputs.browser }}"
          data=json.loads(Path(f"weathergrid/{browser}").read_text())
          qcj=json.loads(Path("weathergrid/${{ steps.region.outputs.qc }}").read_text())
          assert data["source"]=="nasa_gibs_viirs_noaa20_dnb"
          assert "nighttime_lights_radiance_nw_cm2_sr" in data["fields"]
          prov=data["provenance"]
          assert prov["source_layer"]=="VIIRS_NOAA20_DayNightBand_At_Sensor_Radiance"
          assert prov["distribution"].startswith("NASA EOSDIS GIBS public WMTS")
          assert "cloud contamination" in prov["cloud_caveat"]
          assert "not Bortle class" in prov["semantics"]
          assert "dead end" in prov["laads_dead_end"]
          assert "cloud contamination" in qcj["limitations"][0]
          assert not qcj["flags"], qcj
          print({"browser":browser,"rows":data["grid"]["rows"],"cols":data["grid"]["cols"],"radiance":qcj["radiance"]})
          PY
      - name: Publish QC-passing VIIRS snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- "weathergrid/${{ steps.region.outputs.browser }}" "weathergrid/${{ steps.region.outputs.qc }}"
          if git diff --cached --quiet; then
            echo "VIIRS snapshot unchanged."
          else
            git commit -m "Auto-update GIBS VIIRS nighttime-light snapshot [skip ci]"
            for i in {1..5}; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep 20
            done
            echo "::error::Failed to publish VIIRS snapshot after retries."
            exit 1
          fi
