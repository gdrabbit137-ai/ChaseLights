name: B169 VIIRS Live WeatherGrid Ingest

on:
  workflow_dispatch:
    inputs:
      year:
        description: "VNP46A4 composite year"
        required: true
        default: "2025"
      region:
        description: "Region to ingest (tw | us)"
        required: true
        default: "tw"
      bbox:
        description: "left,bottom,right,top (empty = region default)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  live-ingest:
    runs-on: ubuntu-latest
    # CL-DATA-07: the us window pulls ~18 VNP46A4 tiles (~1 GB+); 30 minutes
    # let a slow LAADS transfer cancel the whole ingest silently.
    timeout-minutes: 60
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require Earthdata token secret
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::Configure repository secret EARTHDATA_TOKEN before running live VIIRS ingest."
            exit 1
          fi
      - name: Install HDF5 reader
        run: python -m pip install --disable-pip-version-check h5py
      - name: Resolve region parameters
        id: region
        run: |
          # CL-DATA-07: the ingest is region-parameterized. us uses the us
          # region bbox (125-70.5°W / 25-49.5°N, the GFS us convention);
          # tw keeps its historical default. Outputs follow
          # viirs_nightlights_<region>_browser.json, matching
          # assets/weather-map.js REGION_SOURCE_CATALOG.viirs.file().
          if [ "${{ inputs.region }}" = "us" ]; then
            default_bbox="125,25,-70.5,49.5"
            browser="viirs_nightlights_us_browser.json"
            qc="viirs_nightlights_us_qc.json"
            label="US"
          else
            default_bbox="119.5,21.5,122.5,25.5"
            browser="viirs_nightlights_tw_browser.json"
            qc="viirs_nightlights_tw_qc.json"
            label="Taiwan"
          fi
          if [ -n "${{ inputs.bbox }}" ]; then
            echo "bbox=${{ inputs.bbox }}" >> "$GITHUB_OUTPUT"
          else
            echo "bbox=$default_bbox" >> "$GITHUB_OUTPUT"
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "qc=$qc" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - name: Discover and download VNP46A4
        run: |
          python viirs_lads_download.py \
            --year "${{ inputs.year }}" \
            --bbox "${{ steps.region.outputs.bbox }}" \
            --output-dir .cache/viirs
      - name: Build WeatherGrid mosaic
        shell: bash
        run: |
          mapfile -t files < <(find .cache/viirs -maxdepth 1 -name 'VNP46A4*.h5' -type f | sort)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "::error::No VNP46A4 source tiles were downloaded for the requested ${{ steps.region.outputs.label }} bbox."
            exit 1
          fi
          args=()
          for file in "${files[@]}"; do
            args+=(--input-h5 "$file")
          done
          python viirs_nightlights_ingest.py \
            "${args[@]}" \
            --year "${{ inputs.year }}" \
            --bbox "${{ steps.region.outputs.bbox }}" \
            --output "weathergrid/${{ steps.region.outputs.browser }}" \
            --qc-output "weathergrid/${{ steps.region.outputs.qc }}"
      - name: Validate artifact semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          browser = "${{ steps.region.outputs.browser }}"
          data=json.loads(Path(f"weathergrid/{browser}").read_text())
          qcj=json.loads(Path("weathergrid/${{ steps.region.outputs.qc }}").read_text())
          assert data["source"]=="nasa_black_marble_vnp46a4"
          assert "nighttime_lights_radiance_nw_cm2_sr" in data["fields"]
          assert data["provenance"]["doi"]=="10.5067/VIIRS/VNP46A4.002"
          assert "not Bortle class" in data["provenance"]["semantics"]
          assert not qcj["flags"], qcj
          print({"browser":browser,"rows":data["grid"]["rows"],"cols":data["grid"]["cols"],"qc":qcj["quality_counts"]})
          PY
      - name: Publish QC-passing VIIRS snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- "weathergrid/${{ steps.region.outputs.browser }}" "weathergrid/${{ steps.region.outputs.qc }}"
          if git diff --cached --quiet; then
            echo "VIIRS snapshot unchanged."
          else
            git commit -m "Auto-update VIIRS nighttime-light snapshot [skip ci]"
            for i in {1..5}; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            echo "Failed to publish VIIRS snapshot after retries."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: viirs-nightlights-${{ inputs.region }}-${{ inputs.year }}
          path: |
            weathergrid/${{ steps.region.outputs.browser }}
            weathergrid/${{ steps.region.outputs.qc }}
