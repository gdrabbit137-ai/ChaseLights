name: Test v0.04 Opportunity Adapter
# B35 rerun after catalog count and B34 ID collision fixes
# Production validation for Opportunity runtime changes.

on:
  pull_request:
    branches:
      - main
    paths:
      - "opportunities.py"
      - "runtime_catalog_manifest_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "test_fixtures/shinhotaka_home_*.html"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - "runtime_catalog_v004_r4_2_b33_hualien_additions.json"
      - "runtime_catalog_v004_r4_2_b34_liushishishan_additions.json"
      - "runtime_catalog_v004_r4_2_b35_liyu_subjects.json"
      - "taxonomy_v004.py"
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "index.html"
      - "test_opportunity_adapter.py"
      - ".github/workflows/test_opportunity_adapter.yml"
  push:
    branches:
      - main
      - v0.04-opportunity-adapter-r3
      - v0.04-opportunity-adapter-r4
      - r4.2-b28-p0-missing-places
      - r4.2-b31-place-weather-details
      - r4.2-b32-jp-research-batch01
      - r4.2-b33-hualien-places
      - r4.2-b32-jp025-hagi
      - codex/jp026
      - codex/b34-liushishishan
      - codex/b35-liyu-subject-model
      - hotfix-weather-catalog-resilience
    paths:
      - "opportunities.py"
      - "runtime_catalog_manifest_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "access_state.py"
      - "shinhotaka_access.py"
      - "yahiko_access.py"
      - "test_fixtures/shinhotaka_home_*.html"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - "runtime_catalog_v004_r4_2_b32_jp_batch01.json"
      - "runtime_catalog_v004_r4_2_b33_hualien_additions.json"
      - "runtime_catalog_v004_r4_2_b34_liushishishan_additions.json"
      - "runtime_catalog_v004_r4_2_b35_liyu_subjects.json"
      - "taxonomy_v004.py"
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "index.html"
      - "test_opportunity_adapter.py"
      - ".github/workflows/test_opportunity_adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile
        run: python -m py_compile opportunities.py opportunity_runtime.py runtime_dependencies.py spatial_weather.py marine_state.py tide_state.py access_state.py shinhotaka_access.py yahiko_access.py taxonomy_v004.py regions.py analyze_weather.py fetch_data.py test_opportunity_adapter.py
      - name: Run adapter tests
        run: |
          set -o pipefail
          python test_opportunity_adapter.py 2>&1 | tee adapter-test.log
      - name: Upload adapter failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-test-log
          path: adapter-test.log
