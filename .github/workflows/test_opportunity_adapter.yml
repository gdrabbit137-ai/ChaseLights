name: Test v0.04 Opportunity Adapter\n# B26 retired-place contract\n# B26 dependency cleanup

on:
  push:
    branches:
      - v0.04-opportunity-adapter-r3
      - v0.04-opportunity-adapter-r4
      - r4.2-b28-p0-missing-places
      - r4.2-b31-place-weather-details
      - r4.2-b31b-remove-weather-monolith
      - hotfix-weather-catalog-resilience
    paths:
      - "opportunities.py"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - "access_state.py"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - "taxonomy_v004.py"
      - "regions.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "index.html"
      - "test_opportunity_adapter.py"
      - ".github/workflows/test_opportunity_adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile
        run: python -m py_compile opportunities.py opportunity_runtime.py runtime_dependencies.py spatial_weather.py marine_state.py tide_state.py access_state.py taxonomy_v004.py regions.py analyze_weather.py fetch_data.py test_opportunity_adapter.py
      - name: Run adapter tests
        run: |
          set -o pipefail
          python test_opportunity_adapter.py 2>&1 | tee adapter-test.log
      - name: Upload adapter failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-test-log
          path: adapter-test.log
