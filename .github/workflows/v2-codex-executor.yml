name: V2 Bounded Codex Executor

on:
  pull_request:
    branches: [main]
    paths:
      - ops/v2/automation/**
      - .github/workflows/v2-codex-executor.yml
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [assess_ci, run_pilot]
        default: assess_ci
        required: true
      approved_task_id:
        description: Exactly w5-provenance-receipt-v1
        type: string
        required: true
      approved_main_sha:
        description: Full latest main SHA explicitly approved by the owner
        type: string
        required: true
      approval_pr:
        description: Merged activation-policy PR number
        type: string
        required: true
      approval_comment_id:
        description: Owner-authored explicit single-pilot approval comment ID
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: v2-bounded-codex-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  bounded-executor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run failure, refusal, budget, ownership and CI decision tests (not live E2E)
        run: |
          python ops/v2/automation/test_runner.py --out work/task-p-tests.json
          python ops/v2/automation/test_pilot_guard.py --out work/task-t-tests.json
      - name: Real credential-free preflight must report BLOCKED, never successful E2E
        run: |
          set +e
          python ops/v2/automation/runner.py --preflight --out work/task-p-preflight.json
          result=$?
          set -e
          test "$result" -eq 2
          python -c 'import json; r=json.load(open("work/task-p-preflight.json")); assert r["status"]=="BLOCKED" and r["live_model_e2e"]=="NOT_RUN"'
      - name: Preserve actual test and preflight results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-p-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/task-p-*.json
            work/task-t-*.json
          if-no-files-found: error
          retention-days: 30

  live-executor:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: bounded-executor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      V2_OPERATION: ${{ inputs.operation }}
      V2_TASK_ID: ${{ inputs.approved_task_id }}
      V2_APPROVED_MAIN_SHA: ${{ inputs.approved_main_sha }}
      V2_APPROVAL_PR: ${{ inputs.approval_pr }}
      V2_APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
    steps:
      - name: Read trusted executor and task policy from latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check activation and required configuration without exposing values
        id: activation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_APP_ID: ${{ vars.V2_CODEX_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.V2_CODEX_APP_PRIVATE_KEY }}
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: |
          python ops/v2/automation/activate.py --policy ops/v2/automation/single-pilot-policy.json --out work/task-t-activation.json
      - name: Mint short-lived token for this repository only
        if: steps.activation.outputs.ready == 'true'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.V2_CODEX_APP_ID }}
          private-key: ${{ secrets.V2_CODEX_APP_PRIVATE_KEY }}
          owner: gdrabbit137-ai
          repositories: ChaseLights
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - name: Run one reviewed task or bounded exact-head CI assessment
        if: steps.activation.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python ops/v2/automation/runner.py --policy ops/v2/automation/single-pilot-policy.json --live --out work/task-t-live.json
      - name: Explicit disabled or missing-configuration result
        if: steps.activation.outputs.ready != 'true'
        run: |
          cat work/task-t-activation.json
          exit 2
      - name: Preserve execution evidence, including BLOCKED/FAIL/ERROR
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-p-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/task-t-*.json
          if-no-files-found: error
          retention-days: 30
