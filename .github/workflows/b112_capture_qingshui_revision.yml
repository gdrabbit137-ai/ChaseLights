name: B112 Qingshui 06:00 Revision Capture

on:
  push:
    branches:
      - b112-qingshui-0600-revision-6
    paths:
      - "B112_CAPTURE_TRIGGER.md"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4
        with:
          ref: ac6726360cef60fe9e77219af5ece92cfd670c7b
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Capture sixth Qingshui 06:00 revision
        run: |
          rm -rf captured_snapshot
          mkdir -p captured_snapshot
          env -u GITHUB_SHA python field_snapshot.py capture             --place tw-034             --valid-at 2026-09-29T06:00:00+08:00             --output-dir captured_snapshot
          SNAPSHOT="$(ls captured_snapshot/FVS-*.json | head -n 1)"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

      - name: Validate and replay original
        run: |
          env -u GITHUB_SHA python field_snapshot.py validate "$SNAPSHOT"
          env -u GITHUB_SHA python field_snapshot.py show "$SNAPSHOT"
          env -u GITHUB_SHA python field_snapshot.py replay "$SNAPSHOT" --original > captured_snapshot/replay-original.json
          cat captured_snapshot/replay-original.json

      - name: Record metadata
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["SNAPSHOT"])
          s = json.loads(p.read_text())
          metadata = {
              "snapshot_file": p.name,
              "snapshot_id": s["snapshot_id"],
              "place_id": s["place_id"],
              "captured_at": s["captured_at"],
              "forecast_valid_at": s["forecast_valid_at"],
              "forecast_local_date": s["normalized_input"].get("local_date"),
              "forecast_local_time": s["normalized_input"].get("local_time"),
              "git_commit": s["provenance"]["git_commit"],
              "payload_sha256": s["integrity"]["payload_sha256"],
              "observation_status": s["observation"]["status"],
          }
          Path("captured_snapshot/capture-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingshui-b112-0600-revision
          path: captured_snapshot/
          if-no-files-found: error
          retention-days: 90

      - name: Commit permanent compressed revision fixture
        run: |
          SNAPSHOT_BASENAME="$(basename "$SNAPSHOT")"
          FIXTURE_DIR="test_fixtures/field_snapshot"
          ARCHIVE_NAME="$SNAPSHOT_BASENAME.gz.b64"
          METADATA_NAME="${SNAPSHOT_BASENAME%.json}.metadata.json"

          mkdir -p /tmp/b112-fixture
          gzip -c "$SNAPSHOT" | base64 -w 76 > "/tmp/b112-fixture/$ARCHIVE_NAME"
          cp captured_snapshot/capture-metadata.json "/tmp/b112-fixture/$METADATA_NAME"

          git fetch origin b112-qingshui-0600-revision-6
          git checkout -B b112-qingshui-0600-revision-6 origin/b112-qingshui-0600-revision-6
          mkdir -p "$FIXTURE_DIR"
          cp "/tmp/b112-fixture/$ARCHIVE_NAME" "$FIXTURE_DIR/$ARCHIVE_NAME"
          cp "/tmp/b112-fixture/$METADATA_NAME" "$FIXTURE_DIR/$METADATA_NAME"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$FIXTURE_DIR/$ARCHIVE_NAME" "$FIXTURE_DIR/$METADATA_NAME"
          git commit -m "B112 archive sixth Qingshui 06:00 forecast revision"
          git push origin HEAD:b112-qingshui-0600-revision-6
