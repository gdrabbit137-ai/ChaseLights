name: B167 CAMS AOD + PM2.5 WeatherGrid

on:
  pull_request:
    paths:
      - "cams_aod_weathergrid.py"
      - "test_cams_aod_weathergrid.py"
      - "assets/weather-map.js"
      - "weather-map.html"
      - "PHOTOGRAPHY_ENVIRONMENT_LAYERS_ROADMAP.md"
      - "B166_CAMS_AOD_WEATHERGRID.md"
      - ".github/workflows/b166_cams_aod_weathergrid.yml"
  push:
    branches:
      - main
    paths:
      - "cams_aod_weathergrid.py"
      - "assets/weather-map.js"
      - "weather-map.html"
      - ".github/workflows/b166_cams_aod_weathergrid.yml"
  schedule:
    - cron: "40 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: b166-cams-aod-weathergrid
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install requests
      - run: python -m unittest -v test_cams_aod_weathergrid.py test_weathergrid_ui_polish.py

  live-publish:
    if: github.event_name != 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    # CL-CI-09: the CL-CI-08 ReadTimeout retry (up to 6 attempts x 300s read
    # timeout + backoff per batch) trades a fast crash for a long but legitimate
    # refresh; 15 minutes let the job-timeout cancel it mid-run. The publish
    # step itself stays short — 30 minutes gives the fetch retry chain room
    # to complete instead of being silently cancelled and leaving stale data.
    # CL-DATA-07: the refresh now fetches BOTH tw and us (CL-WG-13 widened the
    # tw window to ~150 request batches, and us adds ~145 more); a polite 8s
    # batch delay plus 8 retries (CL-DATA-07: a 2s delay exhausted the
    # Open-Meteo free-tier quota mid-run with a 429) put the expected wall
    # clock near 50 minutes, so the window is 75.
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install requests
      - name: Fetch CAMS Global AOD via Open-Meteo
        run: |
          python cams_aod_weathergrid.py \
            --forecast-hours 120 \
            --batch-delay-s 8 \
            --retries 8 \
            --output-dir cams_aod_output
          # CL-DATA-07: us region (125–70.5°W / 25–49.5°N) same CAMS pipeline.
          # Non-fatal: the Open-Meteo free tier enforces a daily request
          # quota (~10k location-calls) that both full-width sweeps cannot
          # always fit; a quota-limited day publishes tw only and the next
          # scheduled run retries us. Never let the us failure kill the tw
          # refresh.
          if python cams_aod_weathergrid.py \
            --region us \
            --forecast-hours 120 \
            --batch-delay-s 8 \
            --retries 8 \
            --output-dir cams_aod_output_us; then
            echo "us CAMS fetch succeeded"
          else
            echo "::warning::us CAMS fetch failed (likely free-tier quota); publishing tw only"
          fi
      - name: Validate live bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("cams_aod_output/cams_global_tw_aod_browser.json")
          q=Path("cams_aod_output/cams_global_tw_aod_qc.json")
          data=json.loads(p.read_text())
          qc=json.loads(q.read_text())
          assert data["model"]=="CAMS_GLOBAL"
          assert data["frames"]
          assert "aerosol_optical_depth_550nm" in data["fields"]
          assert "pm2_5_ug_m3" in data["fields"]
          assert data["fields"]["pm2_5_ug_m3"]["unit"]=="µg/m³"
          assert data["provenance"]["native_resolution_km"]==45.0
          assert data["provenance"]["native_time_interval_hours"]==3
          assert qc["frame_count"]==len(data["frames"])
          for field in ("aerosol_optical_depth_550nm","pm2_5_ug_m3"):
              all_missing=[x for x in qc["flags"] if x["flag"]=="all_missing" and x["field"]==field]
              assert len(all_missing) < qc["frame_count"], f"all CAMS {field} frames are missing"
          print(json.dumps({
              "frames":len(data["frames"]),
              "grid":[data["grid"]["rows"],data["grid"]["cols"]],
              "provider_cells":qc["returned_provider_cell_count"],
          },indent=2))
          PY
      - name: Validate live us bundle
        if: hashFiles('cams_aod_output_us/cams_global_us_aod_browser.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("cams_aod_output_us/cams_global_us_aod_browser.json")
          q=Path("cams_aod_output_us/cams_global_us_aod_qc.json")
          data=json.loads(p.read_text())
          qc=json.loads(q.read_text())
          assert data["model"]=="CAMS_GLOBAL"
          assert data["frames"]
          assert "aerosol_optical_depth_550nm" in data["fields"]
          assert "pm2_5_ug_m3" in data["fields"]
          assert data["fields"]["pm2_5_ug_m3"]["unit"]=="µg/m³"
          assert data["provenance"]["native_resolution_km"]==45.0
          assert data["provenance"]["native_time_interval_hours"]==3
          # CL-DATA-07: the us bundle window must fully cover the us region
          # bbox (125–70.5°W / 25–49.5°N) or the dropdown must not offer it.
          assert data["bbox"]["leftlon"] <= -125.0
          assert data["bbox"]["rightlon"] >= -70.5
          assert data["bbox"]["bottomlat"] <= 25.0
          assert data["bbox"]["toplat"] >= 49.5
          assert qc["frame_count"]==len(data["frames"])
          for field in ("aerosol_optical_depth_550nm","pm2_5_ug_m3"):
              all_missing=[x for x in qc["flags"] if x["flag"]=="all_missing" and x["field"]==field]
              assert len(all_missing) < qc["frame_count"], f"all CAMS us {field} frames are missing"
          print(json.dumps({
              "region":"us",
              "frames":len(data["frames"]),
              "grid":[data["grid"]["rows"],data["grid"]["cols"]],
              "provider_cells":qc["returned_provider_cell_count"],
          },indent=2))
          PY
      - name: Publish AOD browser bundle
        run: |
          mkdir -p weathergrid
          cp cams_aod_output/cams_global_tw_aod_browser.json weathergrid/cams_global_tw_aod_browser.json
          cp cams_aod_output/cams_global_tw_aod_qc.json weathergrid/cams_global_tw_aod_qc.json
          # CL-DATA-07: publish the us bundle only when this run produced one
          # (quota-limited days publish tw only — honest degradation).
          if [ -f cams_aod_output_us/cams_global_us_aod_browser.json ]; then
            cp cams_aod_output_us/cams_global_us_aod_browser.json weathergrid/cams_global_us_aod_browser.json
            cp cams_aod_output_us/cams_global_us_aod_qc.json weathergrid/cams_global_us_aod_qc.json
          fi
          # CL-DATA-07: keep the us coverage manifest (the us region layer
          # list) in sync with the actually-published us bundles.
          python build_weathergrid_coverage_browser.py \
            --region us \
            --output weathergrid/weathergrid_coverage_us_browser.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weathergrid/cams_global_tw_aod_browser.json weathergrid/cams_global_tw_aod_qc.json weathergrid/weathergrid_coverage_us_browser.json
          for f in weathergrid/cams_global_us_aod_browser.json weathergrid/cams_global_us_aod_qc.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "CAMS AOD WeatherGrid unchanged."
            exit 0
          fi
          git commit -m "Auto-update CAMS AOD WeatherGrid [skip ci]"
          for i in {1..5}; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: cams-aod-weathergrid
          path: cams_aod_output/
          retention-days: 7
