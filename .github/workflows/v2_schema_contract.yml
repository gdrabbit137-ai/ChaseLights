name: ChaseLights V2 Schema Contract

on:
  push:
    branches:
      - 'v2/worker1-schema-foundation-*'
    paths:
      - 'specs/v2/**'
      - '.github/workflows/v2_schema_contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'specs/v2/**'
      - '.github/workflows/v2_schema_contract.yml'

permissions:
  contents: read

jobs:
  schema:
    name: v2-schema-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Validate canonical schema
        run: python specs/v2/tests/validate_contract.py
      - name: Run schema regression suite
        run: python -m unittest discover -s specs/v2/tests -p 'test_*.py' -v
