name: B36 Opportunity Evidence Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "RESEARCH_EVIDENCE_SPEC_R4_2.md"
      - "audit_opportunity_evidence.py"
      - "audit_localization_semantic_parity.py"
      - "analyze_weather.py"
      - "opportunities.py"
      - "runtime_catalog_manifest_r4_2.json"
      - "runtime_catalog_v004_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_event_calendar_r4_2.json"
      - "regions.py"
      - "runtime_catalog_v004_r4_2_*.json"
      - "runtime_evidence_registry_r4_2.json"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - ".github/workflows/b36_research_evidence_audit.yml"
  push:
    branches:
      - main
      - codex/b36-opportunity-evidence-audit
      - codex/b37-reflection-evidence-audit
      - codex/b37-reflection-evidence-batch02
      - codex/b38-astro-evidence-audit
      - codex/b38-astro-evidence-audit-r2
      - codex/b39-final-evidence-audit
    paths:
      - "RESEARCH_EVIDENCE_SPEC_R4_2.md"
      - "audit_opportunity_evidence.py"
      - "audit_localization_semantic_parity.py"
      - "analyze_weather.py"
      - "opportunities.py"
      - "runtime_catalog_manifest_r4_2.json"
      - "runtime_catalog_v004_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_event_calendar_r4_2.json"
      - "regions.py"
      - "runtime_catalog_v004_r4_2_*.json"
      - "runtime_evidence_registry_r4_2.json"
      - "runtime_catalog_v004_r4_2_b15.compact.part*.b64"
      - ".github/workflows/b36_research_evidence_audit.yml"

jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Fetch frozen localization-debt baseline
        run: git fetch --no-tags --depth=1 origin 5f6bd312a0900b6b32e34919982a819ca6ef41d2
      - name: Compile audits
        run: python -m py_compile audit_opportunity_evidence.py audit_localization_semantic_parity.py opportunities.py regions.py
      - name: Run evidence audit
        run: python audit_opportunity_evidence.py
      - name: Run localization semantic-parity audit
        run: python audit_localization_semantic_parity.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: b36-research-evidence-audit
          path: |
            research_evidence_audit.json
            localization_semantic_parity_audit.json
          retention-days: 14
