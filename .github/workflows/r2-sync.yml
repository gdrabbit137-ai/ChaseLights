name: R2 data sync

# CL-PAGES-05: the heavy weather artefacts (weathergrid/ + weather_details/) are
# served from Cloudflare R2. The scheduled producers still commit them to git
# today, so this workflow mirrors whatever landed on main into the bucket —
# incrementally, using the push diff, so a routine tile refresh uploads a few
# files instead of the whole 1.2 GiB.

on:
  push:
    branches: [main]
    paths:
      - "weathergrid/**"
      - "weather_details/**"
      - "ops/pages/r2_sync.py"
      - ".github/workflows/r2-sync.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Upload every tracked file (slow, ~1.2 GiB)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r2-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror weather data into R2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: python -m pip install --quiet 'boto3>=1.34'

      # Runs on every trigger, including a docs-only touch of the sync script, so
      # a missing or rotated secret surfaces as a red check immediately instead of
      # the first time a tile refresh lands.
      - name: Verify R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )
          head = s3.list_objects_v2(Bucket=os.environ["R2_BUCKET"], MaxKeys=1)
          print("R2 reachable; objects present:", head.get("KeyCount", 0))
          PY

      - name: Resolve changed paths
        id: changed
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # force-push or unknown parent: the diff range is meaningless
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$before" "${{ github.sha }}" > /tmp/all.txt || true
          grep -E '^(weathergrid|weather_details)/' /tmp/all.txt > /tmp/changed.txt || true
          # a non-data commit (this workflow, or the sync script) must not trigger
          # a full 1.2 GiB re-upload
          if [ ! -s /tmp/changed.txt ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wc -l < /tmp/changed.txt | xargs echo "changed data files:"
          echo "mode=changed" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.changed.outputs.mode != 'none'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            python ops/pages/r2_sync.py --apply --files-from /tmp/changed.txt
          else
            python ops/pages/r2_sync.py --apply
          fi

      - name: Verify a known object
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://data.chaselights.app/weathergrid/index.json)
          echo "weathergrid/index.json -> $code"
          test "$code" = "200"
