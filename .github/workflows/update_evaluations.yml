name: Update V2 Opportunity Evaluations
# GUIDANCE-only batch evaluation refresh: Open-Meteo forecast + astronomy
# per contracted opportunity; publishes evaluations-latest.json for web-v2.

on:
  schedule:
    # 每 6 小時刷新（與 pilot 6h freshness 界限對齊）
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: chaselights-evaluations-update
  # CL-CI-43: a refresh that is 80% done must never be thrown away by the next
  # cron tick. Queue instead — two overlapping runs each rewrite the bundle and
  # the card artifact, and the loser's work is pure waste (the 11/23-11/25 runs
  # alternated cancelled/failure for exactly this reason).
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    # CL-PAGES-07: the heavy refreshes can run on Richard's Windows box
    # (C:\actions-runner-chaselights) without spending hosted minutes. Unset
    # repository variable CL_RUNNER = current behaviour (ubuntu-latest), so this
    # is a one-keystroke rollback rather than a rewrite.
    runs-on: ${{ vars.CL_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Hydrate weather_details from R2
        # CL-CI-43: weather_details/ left git (CL-PAGES-09) and the public data
        # repo owns the refresh. build_subject_cards still derives its
        # per-hour verdicts from weather_details/<region>/<place>.json, so
        # without this pull the regenerated card layer sees NO weather at all:
        # every day falls to honest-null, the three-tier contract collapses to
        # recommend+null, and the artifact-coupled gate reds (runs 44881229527
        # through 45708924071). The bucket is the source of truth; pull it.
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: chaselights-data
          R2_ENDPOINT: https://218303e56b40f3bc72f70bcc975fda64.r2.cloudflarestorage.com
        run: |
          python -m pip install --quiet 'boto3>=1.34'
          python ops/pages/r2_pull.py --prefix weather_details/ --dest . --workers 32
          shards=$(find weather_details -name '*.json' | wc -l)
          echo "hydrated weather_details shards: $shards"
          test "$shards" -ge 400
      - name: Run batch evaluation
        run: python packages/core-v2/tools/evaluate_batch.py --forecast-hours 168
      - name: Validate bundle against schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open('specs/v2/schema/evaluation-bundle-v0.2.0.schema.json', encoding='utf-8'))
          bundle = json.load(open('apps/web-v2/evaluations-latest.json', encoding='utf-8'))
          errors = list(jsonschema.Draft202012Validator(schema).iter_errors(bundle))
          assert not errors, errors[:3]
          assert bundle['guidance_only'] is True and bundle['live_recommendation'] is False
          # CL-DATA-80 fail-closed: every evaluated opportunity declares which
          # engine produced it and carries the 168h published horizon.
          assert bundle['forecast_hours'] == 168, bundle['forecast_hours']
          engines = {o.get('engine') for p in bundle['places'] for o in p['opportunities']}
          assert engines <= {'quality_engine_v2', 'legacy_boolean'} and None not in engines, engines
          assert 'quality_engine_v2' in engines, engines
          print('bundle OK:', bundle['place_count'], 'places /', bundle['opportunity_count'], 'opportunities; engines:', sorted(engines))
          PY
      - name: Regenerate subject-cards from the same bundle (CL-UI-70)
        # CHALLENGER-13 P6: the derived subject-cards layer (chips / card
        # second line) must come from the SAME evaluation run as the bundle
        # — regenerate it here, inside this job, so the bundle and its
        # derived artifact land in ONE commit (no stale-drift where the card
        # word layer contradicts the modal's hourly data). The committed
        # filename subject-cards-20261112T202312Z.json is a STABLE POINTER
        # pinned by assets/app.js (V2_SUBJECT_CARDS_FILE) and the CL-UI-62/
        # 63/64/65 tests; the true provenance lives inside the file
        # (derived_from.source_bundle + source_bundle_sha256).
        run: |
          newest_bundle=$(ls -t data/v2/evaluations/bundle-*.json | head -n 1)
          # CL-CI-37: --write-weather-snapshot freezes the consumed weather
          # inputs to a stable pointer committed alongside the artifact, so
          # the subject-cards determinism tests re-derive from committed
          # bytes instead of the sliding weather_details window (absent from
          # the CI sparse checkout entirely).
          python data/v2/tools/build_subject_cards.py --bundle "$newest_bundle" \
            --write-weather-snapshot data/v2/evaluations/subject-cards-weather-input.json \
            --out data/v2/evaluations/subject-cards-20261112T202312Z.json
      - name: Gate — artifact-coupled node tests stay green (CL-CI-36)
        # Root-cure for the "refresh breaks test pins" loop: the refresh must
        # never land a commit that reds the tests coupled to the regenerated
        # artifacts (evaluations bundle / subject-cards / details). The coupled
        # set is discovered dynamically (any *.test.mjs that reads those data
        # paths — no browser deps, no playwright needed); a failure fails the
        # job instead of shipping red tests to main. Data pins themselves are
        # banned in-suite by cl-ci-36-refresh-pins.test.mjs (dynamic anchors).
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Run artifact-coupled tests
        run: |
          # Browser/CDP gates are excluded here on purpose: this job has no
          # Chromium install and no weathergrid/ hydrate, so every CDP file
          # would ENOENT or render an empty card list (measured: spawn
          # C:/Program Files/.../chrome.exe ENOENT on ubuntu). Those gates run
          # in v2-integration, which hydrates both trees and installs Chromium —
          # no assertion is relaxed, only the venue is corrected.
          coupled=$(grep -rlE "'data', *'v2', *'evaluations|evaluations-latest|evaluations-details|subject-cards" apps/web-v2/tests --include='*.test.mjs' \
            | grep -vE 'cl-app-06-custom-places|cl-ui-118b-na-rows-expand|cl-ui-90-reminders-mockup|cl-e2e-131-semantic-sweep' \
            | grep -vE 'cl-ui-115-icon-set|cl-ui-117-now-sidecar|cl-ui-45-render-consistency|cl-ui-46-cp-flag-visibility' \
            | sort | tr '\n' ' ')
          echo "coupled test files:"
          echo "$coupled" | tr ' ' '\n' | sed '/^$/d'
          # --test-isolation=none is the canonical suite mode (w4-node/postmerge_verify);
          # default per-file isolation reds unrelated isolation-sensitive files.
          #
          # CL-CI-139 (2026-11-27): this step hung for ~2 h on two consecutive runs
          # (#69 at 08:59Z, #70 at 11:38Z) without ever reaching the commit step, and
          # the job log is not readable until the job ends, so the culprit could not
          # be named. Three bounds, each answering a different failure mode:
          #   --test-timeout   a single test that never settles fails BY NAME;
          #   --test-force-exit  the process exits when the run finishes even if a
          #                      test left a server/socket/child handle open (the
          #                      classic "runner prints everything then never exits");
          #   timeout 1500     catches a file whose MODULE hangs (no test started), and
          #                      leaves the partial TAP in the log so the last file
          #                      printed is the one to look at.
          # No assertion is relaxed: a hang becomes a named failure instead of silence.
          set -o pipefail
          timeout 1500 node --test --test-isolation=none \
            --test-timeout=180000 --test-force-exit $coupled || {
              rc=$?
              if [ "$rc" = "124" ]; then
                echo "::error::artifact-coupled tests exceeded 1500 s — the last file printed above never finished"
              fi
              exit "$rc"
            }
      - name: Commit evaluation bundle
        run: |
          ls -t data/v2/evaluations/bundle-*.json 2>/dev/null | tail -n +8 | xargs -r rm -f
          git config user.name "chaselights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web-v2/evaluations-latest.json apps/web-v2/evaluations-details data/v2/evaluations/
          git diff --cached --quiet || git commit -m "evaluations(v2): scheduled GUIDANCE bundle refresh ($(date -u +%FT%TZ))"
          # CL-CI-09: fetch-first retry protocol (ops-playbook snapshot-conflict
          # protocol) — run 42530174063 failed in this step because a concurrent
          # publisher (CL-DATA-40/41 regen chain) landed on main between
          # checkout and push. Before each push: fetch origin main and rebase
          # onto it if it advanced, then push; retried up to 3 times with
          # exponential backoff instead of a bare one-shot `git push`.
          pushed=false
          for i in 1 2 3; do
            if git fetch origin main --no-tags \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((2 ** (i - 1) * 5))  # 5s, 10s, 20s
          done
          if [[ "$pushed" != "true" ]]; then
            echo "Failed to publish evaluation bundle after fetch-first retries."
            exit 1
          fi
      - name: Build now sidecar (CL-DATA-115)
        # CL-DATA-115: the homepage card's `now` row no longer needs the per-place
        # weather_details shard (~2.3 MB each; hundreds of MB on a 124-card page).
        # This step reduces the SAME hydrated shards this run already pulled to
        # ONE small artifact — apps/web-v2/now-latest.json — stamped with the
        # bundle's own generated_at + filename, so a stale sidecar is detectable.
        # It derives no verdict and re-runs no evaluation: it only picks the
        # current hour per place in the place's own timezone, and it judges
        # freshness PER SHARD (`updated_at` / `data_stale`), omitting places whose
        # own shard is stale instead of stamping them with the bundle's hour.
        #
        # Refusal semantics (exit 3 stale / 5 coverage / 6 unknown zone): the tool
        # deletes the artifact, this step publishes THAT DELETION and then fails,
        # so the site 404s and the card falls back to the day chip. Leaving the
        # previous now block standing would show an older run as "now".
        run: |
          # Deterministic bundle pick: sort | tail is filename order, and the
          # filename IS the UTC stamp. `ls -t` (mtime) picked the wrong bundle
          # whenever several commits shared an mtime in a fresh checkout.
          newest_bundle=$(ls data/v2/evaluations/bundle-*.json | sort | tail -n 1)
          echo "now sidecar source bundle: $newest_bundle"
          # CL-DATA-115 review: a host without an IANA database (Windows runners,
          # slim images) made ZoneInfo silently fall back to UTC and mislabel the
          # hour. Install tzdata and fail here if a zone still does not resolve.
          python -m pip install --quiet 'tzdata>=2024.1'
          python -c 'import zoneinfo; [zoneinfo.ZoneInfo(z) for z in ("Asia/Taipei", "Pacific/Honolulu", "Europe/London")]'
          set +e
          python data/v2/tools/build_now_sidecar.py --bundle "$newest_bundle" \
            --weather-dir weather_details \
            --out apps/web-v2/now-latest.json
          sidecar_status=$?
          set -e
          git config user.name "chaselights-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ "$sidecar_status" -ne 0 ]]; then
            # The tool removed apps/web-v2/now-latest.json on refusal. Publish the
            # removal (same fetch-first retry protocol) and then fail the run.
            echo "::error::now sidecar refused (exit $sidecar_status); withdrawing the artifact so the client falls back to the day chip"
            git add -A apps/web-v2/now-latest.json
            if git diff --cached --quiet; then
              echo "no previous now-latest.json to withdraw"
              exit "$sidecar_status"
            fi
            git commit -m "data(v2): withdraw stale now sidecar ($(date -u +%FT%TZ))"
            pushed=false
            for i in 1 2 3; do
              if git fetch origin main --no-tags \
                && git rebase origin/main \
                && git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((2 ** (i - 1) * 5))  # 5s, 10s, 20s
            done
            if [[ "$pushed" != "true" ]]; then
              echo "Failed to publish the now sidecar withdrawal after fetch-first retries."
            fi
            exit "$sidecar_status"
          fi
          sidecar_bytes=$(stat -c%s apps/web-v2/now-latest.json)
          echo "now-latest.json bytes: $sidecar_bytes"
          test "$sidecar_bytes" -lt 409600  # CL-DATA-115 budget: < 400 KB
          git add apps/web-v2/now-latest.json
          git diff --cached --quiet || git commit -m "data(v2): compact now sidecar refresh ($(date -u +%FT%TZ))"
          # Same fetch-first retry protocol as the bundle commit above (CL-CI-09):
          # a concurrent publisher must never cost this run its sidecar.
          pushed=false
          for i in 1 2 3; do
            if git fetch origin main --no-tags \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((2 ** (i - 1) * 5))  # 5s, 10s, 20s
          done
          if [[ "$pushed" != "true" ]]; then
            echo "Failed to publish the now sidecar after fetch-first retries."
            exit 1
          fi
