name: Update V2 Opportunity Evaluations
# GUIDANCE-only batch evaluation refresh: Open-Meteo forecast + astronomy
# per contracted opportunity; publishes evaluations-latest.json for web-v2.

on:
  schedule:
    # 每 6 小時刷新（與 pilot 6h freshness 界限對齊）
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: chaselights-evaluations-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Run batch evaluation
        run: python packages/core-v2/tools/evaluate_batch.py --forecast-hours 72
      - name: Validate bundle against schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open('specs/v2/schema/evaluation-bundle-v0.1.schema.json', encoding='utf-8'))
          bundle = json.load(open('apps/web-v2/evaluations-latest.json', encoding='utf-8'))
          errors = list(jsonschema.Draft202012Validator(schema).iter_errors(bundle))
          assert not errors, errors[:3]
          assert bundle['guidance_only'] is True and bundle['live_recommendation'] is False
          print('bundle OK:', bundle['place_count'], 'places /', bundle['opportunity_count'], 'opportunities')
          PY
      - name: Commit evaluation bundle
        run: |
          ls -t data/v2/evaluations/bundle-*.json 2>/dev/null | tail -n +8 | xargs -r rm -f
          git config user.name "chaselights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web-v2/evaluations-latest.json data/v2/evaluations/
          git diff --cached --quiet || git commit -m "evaluations(v2): scheduled GUIDANCE bundle refresh ($(date -u +%FT%TZ))"
          git push
