name: Update V2 Opportunity Evaluations
# GUIDANCE-only batch evaluation refresh: Open-Meteo forecast + astronomy
# per contracted opportunity; publishes evaluations-latest.json for web-v2.

on:
  schedule:
    # 每 6 小時刷新（與 pilot 6h freshness 界限對齊）
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: chaselights-evaluations-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Run batch evaluation
        run: python packages/core-v2/tools/evaluate_batch.py --forecast-hours 168
      - name: Validate bundle against schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open('specs/v2/schema/evaluation-bundle-v0.1.schema.json', encoding='utf-8'))
          bundle = json.load(open('apps/web-v2/evaluations-latest.json', encoding='utf-8'))
          errors = list(jsonschema.Draft202012Validator(schema).iter_errors(bundle))
          assert not errors, errors[:3]
          assert bundle['guidance_only'] is True and bundle['live_recommendation'] is False
          print('bundle OK:', bundle['place_count'], 'places /', bundle['opportunity_count'], 'opportunities')
          PY
      - name: Regenerate subject-cards from the same bundle (CL-UI-70)
        # CHALLENGER-13 P6: the derived subject-cards layer (chips / card
        # second line) must come from the SAME evaluation run as the bundle
        # — regenerate it here, inside this job, so the bundle and its
        # derived artifact land in ONE commit (no stale-drift where the card
        # word layer contradicts the modal's hourly data). The committed
        # filename subject-cards-20261112T202312Z.json is a STABLE POINTER
        # pinned by assets/app.js (V2_SUBJECT_CARDS_FILE) and the CL-UI-62/
        # 63/64/65 tests; the true provenance lives inside the file
        # (derived_from.source_bundle + source_bundle_sha256).
        run: |
          newest_bundle=$(ls -t data/v2/evaluations/bundle-*.json | head -n 1)
          python data/v2/tools/build_subject_cards.py --bundle "$newest_bundle" \
            --out data/v2/evaluations/subject-cards-20261112T202312Z.json
      - name: Commit evaluation bundle
        run: |
          ls -t data/v2/evaluations/bundle-*.json 2>/dev/null | tail -n +8 | xargs -r rm -f
          git config user.name "chaselights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web-v2/evaluations-latest.json apps/web-v2/evaluations-details data/v2/evaluations/
          git diff --cached --quiet || git commit -m "evaluations(v2): scheduled GUIDANCE bundle refresh ($(date -u +%FT%TZ))"
          # CL-CI-09: fetch-first retry protocol (ops-playbook snapshot-conflict
          # protocol) — run 42530174063 failed in this step because a concurrent
          # publisher (CL-DATA-40/41 regen chain) landed on main between
          # checkout and push. Before each push: fetch origin main and rebase
          # onto it if it advanced, then push; retried up to 3 times with
          # exponential backoff instead of a bare one-shot `git push`.
          pushed=false
          for i in 1 2 3; do
            if git fetch origin main --no-tags \
              && git rebase origin/main \
              && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((2 ** (i - 1) * 5))  # 5s, 10s, 20s
          done
          if [[ "$pushed" != "true" ]]; then
            echo "Failed to publish evaluation bundle after fetch-first retries."
            exit 1
          fi
