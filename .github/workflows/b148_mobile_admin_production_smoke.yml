name: B148 Mobile Admin Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile_admin_production_smoke.py"
      - "test_mobile_admin_production_smoke_contract.py"
      - ".github/workflows/b148_mobile_admin_production_smoke.yml"
      - "B148_MOBILE_ADMIN_PRODUCTION_SMOKE.md"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/app.css"
      - "mobile_admin_production_smoke.py"
      - "test_mobile_admin_production_smoke_contract.py"
      - ".github/workflows/b148_mobile_admin_production_smoke.yml"
      - "B148_MOBILE_ADMIN_PRODUCTION_SMOKE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate mobile-production-smoke contract
        run: |
          python -m py_compile mobile_admin_production_smoke.py
          python -m unittest -v test_mobile_admin_production_smoke_contract.py

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Wait for exact GitHub Pages homepage publication
        run: |
          expected_html_sha="$(sha256sum index.html | awk '{print $1}')"
          expected_js_sha="$(sha256sum assets/app.js | awk '{print $1}')"
          expected_css_sha="$(sha256sum assets/app.css | awk '{print $1}')"
          ready=0

          for i in {1..24}; do
            nonce="${GITHUB_SHA}-${i}-$(date +%s)"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/index.html?pages_probe=${nonce}" \
              -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/assets/app.js?pages_probe=${nonce}" \
              -o /tmp/live-app.js || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/assets/app.css?pages_probe=${nonce}" \
              -o /tmp/live-app.css || true

            if [[ -s /tmp/live-index.html && -s /tmp/live-app.js && -s /tmp/live-app.css ]]; then
              live_html_sha="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
              live_js_sha="$(sha256sum /tmp/live-app.js | awk '{print $1}')"
              live_css_sha="$(sha256sum /tmp/live-app.css | awk '{print $1}')"

              echo "attempt=$i"
              echo "html expected=$expected_html_sha live=$live_html_sha"
              echo "js   expected=$expected_js_sha live=$live_js_sha"
              echo "css  expected=$expected_css_sha live=$live_css_sha"

              if [[ "$live_html_sha" == "$expected_html_sha" && \
                    "$live_js_sha" == "$expected_js_sha" && \
                    "$live_css_sha" == "$expected_css_sha" ]]; then
                ready=1
                break
              fi
            fi

            echo "Production homepage assets do not yet match this main commit (attempt $i/24)"
            sleep 15
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Homepage production assets did not converge to current main bytes in time"
            exit 1
          fi

      - name: Run deployed mobile admin picker smoke
        run: |
          python mobile_admin_production_smoke.py \
            --url "https://chaselights.app/index.html" \
            --screenshot "artifacts/mobile-admin-production-smoke.png"

      - name: Upload production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-admin-production-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
