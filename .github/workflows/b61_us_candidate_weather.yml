name: B61 US Candidate Weather QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "regions.py"
      - "ci_weather_impact.py"
      - "analyze_weather.py"
      - "fetch_data.py"
      - "opportunities.py"
      - "runtime_catalog_v004_r4_2.json"
      - "runtime_catalog_manifest_r4_2.json"
      - "runtime_evidence_registry_r4_2.json"
      - "opportunity_runtime.py"
      - "runtime_dependencies.py"
      - "access_state.py"
      - "spatial_weather.py"
      - "marine_state.py"
      - "tide_state.py"
      - ".github/workflows/b61_us_candidate_weather.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: b61-us-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Detect impacted weather regions
        id: weather_regions
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ci_weather_impact.py

      - name: Generate US candidate weather
        if: github.event_name != 'pull_request' || steps.weather_regions.outputs.us == 'true'
        run: python analyze_weather.py us

      - name: Validate US partial-migration contract
        if: github.event_name != 'pull_request' || steps.weather_regions.outputs.us == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("us_weather.json").read_text(encoding="utf-8"))
          spots = summary.get("spots") if isinstance(summary, dict) else summary

          assert summary.get("schema_version") == 10, summary.get("schema_version")
          for spot in spots:
              assert all("themes" not in day for day in (spot.get("daily") or [])), (
                  spot["spot_id"], "published_daily_theme_duplicate"
              )
          assert len(spots) == 70, len(spots)
          assert len({s["spot_id"] for s in spots}) == 70
          assert not Path("us_weather_details.json").exists(), "regional detail file must remain retired"

          shard_dir = Path("weather_details") / "us"
          shard_files = sorted(shard_dir.glob("us-*.json"))
          assert len(shard_files) == 70, len(shard_files)
          shard_ids = set()
          for shard_path in shard_files:
              shard = json.loads(shard_path.read_text(encoding="utf-8"))
              detail = shard.get("spot") or {}
              assert shard.get("spot_id") == detail.get("spot_id"), shard_path.name
              assert detail.get("spot_id"), shard_path.name
              shard_ids.add(detail["spot_id"])

          researched = [s for s in spots if s.get("opportunities")]
          pending = [s for s in spots if not s.get("opportunities")]
          assert [s["spot_id"] for s in researched] == [f"us-{i:03d}" for i in range(1, 66)], [s["spot_id"] for s in researched]
          assert len(pending) == 5

          expected = {
              "us-001": {"us-001-P01", "us-001-P02", "us-001-P03"},
              "us-002": {"us-002-P01"},
              "us-003": {"us-003-P01", "us-003-P02"},
              "us-004": {"us-004-P01"},
              "us-005": {"us-005-P01", "us-005-P02"},
              "us-006": {"us-006-P01", "us-006-P02"},
              "us-007": {"us-007-P01", "us-007-P02"},
              "us-008": {"us-008-P01"},
              "us-009": {"us-009-P01"},
              "us-010": {"us-010-P01"},
              "us-011": {"us-011-P01", "us-011-P02"},
              "us-012": {"us-012-P01", "us-012-P02"},
              "us-013": {"us-013-P01", "us-013-P02"},
              "us-014": {"us-014-P01", "us-014-P02", "us-014-P03"},
              "us-015": {"us-015-P01", "us-015-P02"},
              "us-016": {"us-016-P01", "us-016-P02"},
              "us-017": {"us-017-P01"},
              "us-018": {"us-018-P01", "us-018-P02"},
              "us-019": {"us-019-P01", "us-019-P02"},
              "us-020": {"us-020-P01", "us-020-P02"},
              "us-021": {"us-021-P01"},
              "us-022": {"us-022-P01", "us-022-P02"},
              "us-023": {"us-023-P01"},
              "us-024": {"us-024-P01", "us-024-P02"},
              "us-025": {"us-025-P01", "us-025-P02"},
              "us-026": {"us-026-P01", "us-026-P02"},
              "us-027": {"us-027-P01"},
              "us-028": {"us-028-P01"},
              "us-029": {"us-029-P01"},
              "us-030": {"us-030-P01"},
              "us-031": {"us-031-P01"},
              "us-032": {"us-032-P01"},
              "us-033": {"us-033-P01"},
              "us-034": {"us-034-P01"},
              "us-035": {"us-035-P01", "us-035-P02"},
              "us-036": {"us-036-P01"},
              "us-037": {"us-037-P01", "us-037-P02"},
              "us-038": {"us-038-P01"},
              "us-039": {"us-039-P01", "us-039-P02"},
              "us-040": {"us-040-P01"},
              "us-041": {"us-041-P01", "us-041-P02"},
              "us-042": {"us-042-P01"},
              "us-043": {"us-043-P01"},
              "us-044": {"us-044-P01", "us-044-P02"},
              "us-045": {"us-045-P01"},
              "us-046": {"us-046-P01", "us-046-P02"},
              "us-047": {"us-047-P01"},
              "us-048": {"us-048-P01", "us-048-P02"},
              "us-049": {"us-049-P01"},
              "us-050": {"us-050-P01", "us-050-P02"},
              "us-051": {"us-051-P01", "us-051-P02"},
              "us-052": {"us-052-P01", "us-052-P02"},
              "us-053": {"us-053-P01"},
              "us-054": {"us-054-P01"},
              "us-055": {"us-055-P01", "us-055-P02"},
              "us-056": {"us-056-P01", "us-056-P02"},
              "us-057": {"us-057-P01", "us-057-P02"},
              "us-058": {"us-058-P01", "us-058-P02"},
              "us-059": {"us-059-P01", "us-059-P02"},
              "us-060": {"us-060-P01", "us-060-P02"},
              "us-061": {"us-061-P01", "us-061-P02"},
              "us-062": {"us-062-P01"},
              "us-063": {"us-063-P01"},
              "us-064": {"us-064-P01"},
              "us-065": {"us-065-P01", "us-065-P02"},
          }
          for spot in researched:
              assert spot.get("timezone"), (spot["spot_id"], spot.get("timezone"))
              actual = {o["opportunity_id"] for o in spot["opportunities"]}
              assert actual == expected[spot["spot_id"]], (spot["spot_id"], actual)
              for day in spot.get("daily") or []:
                  winner = day.get("all") or {}
                  assert not winner.get("research_pending"), (spot["spot_id"], day.get("date"), winner)
                  daily_ids = set((day.get("opportunities") or {}).keys())
                  assert daily_ids <= expected[spot["spot_id"]], (spot["spot_id"], daily_ids)

          pending_errors = []
          for spot in pending:
              for day in spot.get("daily") or []:
                  winner = day.get("all") or {}
                  if winner.get("score") is not None:
                      pending_errors.append((spot["spot_id"], day.get("date"), "legacy_score_leak", winner.get("score")))
                  if not winner.get("research_pending"):
                      pending_errors.append((spot["spot_id"], day.get("date"), "missing_research_pending"))
          assert pending_errors == [], pending_errors[:20]
          assert shard_ids == {s["spot_id"] for s in spots}

          report = {
              "summary_count": len(spots),
              "detail_shard_count": len(shard_files),
              "researched_place_ids": [s["spot_id"] for s in researched],
              "research_pending_count": len(pending),
              "researched_opportunity_counts": {s["spot_id"]: len(s["opportunities"]) for s in researched},
          }
          Path("b61_us_candidate_validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload US candidate output
        if: always() && (github.event_name != 'pull_request' || steps.weather_regions.outputs.us == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: b61-us-candidate-weather
          path: |
            us_weather.json
            b61_us_candidate_validation.json
          retention-days: 7
