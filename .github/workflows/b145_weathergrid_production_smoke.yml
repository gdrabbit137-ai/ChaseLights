name: B145 WeatherGrid Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "weathergrid_production_smoke.py"
      - "test_weathergrid_production_smoke_contract.py"
      - ".github/workflows/b145_weathergrid_production_smoke.yml"
      - "B145_WEATHERGRID_PRODUCTION_SMOKE.md"
      - "B147_WEATHERGRID_PRODUCTION_FRESHNESS.md"
      - "test_weathergrid_production_freshness.py"
      - "B147_WEATHERGRID_PRODUCTION_FRESHNESS.md"
      - "test_weathergrid_production_freshness.py"
  push:
    branches: [main]
    paths:
      - "weather-map.html"
      - "assets/weather-map.js"
      - "assets/weather-map.css"
      - "weathergrid/jma_msm_tw_cloud_browser.json"
      - "weathergrid/jma_msm_tw_cloud_qc.json"
      - "weathergrid/himawari9_tw_cloud_browser.json"
      - "weathergrid/himawari9_tw_cloud_qc.json"
      - "weathergrid_production_smoke.py"
      - "test_weathergrid_production_smoke_contract.py"
      - ".github/workflows/b145_weathergrid_production_smoke.yml"
      - "B145_WEATHERGRID_PRODUCTION_SMOKE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate production-smoke contract
        run: |
          python -m py_compile weathergrid_production_smoke.py
          python -m unittest -v \
            test_weathergrid_production_smoke_contract.py \
            test_weathergrid_production_freshness.py

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Selenium and CJK font
        run: |
          python -m pip install --disable-pip-version-check selenium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Wait for exact GitHub Pages publication
        run: |
          expected_html_sha="$(sha256sum weather-map.html | awk '{print $1}')"
          expected_js_sha="$(sha256sum assets/weather-map.js | awk '{print $1}')"
          expected_css_sha="$(sha256sum assets/weather-map.css | awk '{print $1}')"
          ready=0

          for i in {1..24}; do
            nonce="${GITHUB_SHA}-${i}-$(date +%s)"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/weather-map.html?pages_probe=${nonce}" \
              -o /tmp/live-weather-map.html || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/assets/weather-map.js?pages_probe=${nonce}" \
              -o /tmp/live-weather-map.js || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://chaselights.app/assets/weather-map.css?pages_probe=${nonce}" \
              -o /tmp/live-weather-map.css || true

            if [[ -s /tmp/live-weather-map.html && -s /tmp/live-weather-map.js && -s /tmp/live-weather-map.css ]]; then
              live_html_sha="$(sha256sum /tmp/live-weather-map.html | awk '{print $1}')"
              live_js_sha="$(sha256sum /tmp/live-weather-map.js | awk '{print $1}')"
              live_css_sha="$(sha256sum /tmp/live-weather-map.css | awk '{print $1}')"

              echo "attempt=$i"
              echo "html expected=$expected_html_sha live=$live_html_sha"
              echo "js   expected=$expected_js_sha live=$live_js_sha"
              echo "css  expected=$expected_css_sha live=$live_css_sha"

              if [[ "$live_html_sha" == "$expected_html_sha" && \
                    "$live_js_sha" == "$expected_js_sha" && \
                    "$live_css_sha" == "$expected_css_sha" ]]; then
                ready=1
                break
              fi
            fi

            echo "Production assets do not yet match this main commit (attempt $i/24)"
            sleep 15
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::WeatherGrid production assets did not converge to the current main bytes in time"
            exit 1
          fi

      - name: Run deployed WeatherGrid browser smoke
        run: |
          python weathergrid_production_smoke.py \
            --url "https://chaselights.app/weather-map.html" \
            --screenshot "artifacts/weathergrid-production-smoke.png"

      - name: Upload production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weathergrid-production-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
