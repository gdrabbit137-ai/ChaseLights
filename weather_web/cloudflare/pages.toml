# ═══════════════════════════════════════════════════════════════
# ChaseLights — Cloudflare Pages 部署設定
# ═══════════════════════════════════════════════════════════════
# 部署前端（靜態檔案）：
#   1. cd weather_web/cloudflare
#   2. npm install -g wrangler
#   3. wrangler pages deploy ../templates/ --name=chaselights
#
# 部署 API Worker：
#   1. cd weather_web/cloudflare
#   2. wrangler deploy
#
# 設定 Pages Functions：
#   將 worker.js 複製到 functions/api/[[path]].js
#   Pages 會自動將 /api/* 路由到這個 Worker
# ═══════════════════════════════════════════════════════════════

# Pages 專案名稱
name = "chaselights"

# 相容性日期
compatibility_date = "2026-09-01"

# 部署目錄（templates/ 裡的 HTML + static/ 裡的 CSS）
[build]
  command = "echo 'Static site, no build needed'"
  publish = "../templates"

# 靜態檔案路由（將 /static/* 對應到 static/ 目錄）
[[redirects]]
  from = "/static/*"
  to = "/../static/:splat"
  status = 200

# API 路由（由 Pages Functions 處理）
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200