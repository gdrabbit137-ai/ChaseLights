# ═══════════════════════════════════════════════════════════════
# PhotoWeather — Cloudflare Workers 部署設定
# ═══════════════════════════════════════════════════════════════
# 安裝 wrangler CLI:
#   npm install -g wrangler
#
# 登入:
#   wrangler login
#
# 部署:
#   wrangler deploy
# ═══════════════════════════════════════════════════════════════

name = "photoweather-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# ─── 環境變數 ─────────────────────────────────────────────────
# 後端 Python API 伺服器的位址
# 正式上線時改為你 VPS 的真實 IP:PORT
[vars]
BACKEND_URL = "http://localhost:5000"

# 開發環境
[env.development]
vars = { BACKEND_URL = "http://localhost:5000" }

# 正式環境
[env.production]
vars = { BACKEND_URL = "https://your-vps-ip:5000" }

# ─── 路由 ─────────────────────────────────────────────────────
# 沒有特別的路由設定，全部透過 fetch 事件處理

# ─── 限制 ─────────────────────────────────────────────────────
# 每天 100,000 次請求（免費方案）
# 每個 Worker 記憶體 128MB
# 每次執行時間上限 30 秒（免費 10 秒）