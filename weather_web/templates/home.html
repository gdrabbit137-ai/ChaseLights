<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoWeather — 攝影天氣助手</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0f1a; color: #d0d8e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
}
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px; background: #0d1520;
  border-bottom: 1px solid #1a2a3a;
}
.header h1 { font-size: 18px; color: #ffd54f; font-weight: 600; letter-spacing: 0.5px; }
.lang-btn {
  padding: 4px 12px; border-radius: 4px; border: 1px solid #2a3a4a;
  background: transparent; color: #667788; cursor: pointer; font-size: 12px;
  transition: all 0.2s; margin-left: 6px;
}
.lang-btn:hover { background: #1a2a3a; color: #c0d0e0; }
.lang-btn.active { background: #2a3a5a; color: #ffd54f; border-color: #ffd54f44; }

.hero {
  text-align: center; padding: 48px 20px 32px;
}
.hero h2 { font-size: 26px; color: #f0f0f0; font-weight: 500; margin-bottom: 10px; }
.hero p { font-size: 14px; color: #667788; line-height: 1.7; }

.region-grid {
  display: grid; gap: 16px; max-width: 860px; margin: 0 auto; padding: 0 20px 48px;
}
.region-card {
  background: linear-gradient(135deg, #111a28 0%, #0d1520 100%);
  border: 1px solid #1a2a3a; border-radius: 10px; padding: 20px 24px;
  transition: all 0.2s;
}
.region-card:hover { border-color: #ffd54f33; background: #131e30; }
.region-card h3 { font-size: 17px; color: #f0f0f0; margin-bottom: 6px; font-weight: 500; }
.region-card .region-desc { font-size: 12px; color: #667788; margin-bottom: 14px; }
.sub-regions { display: flex; gap: 8px; flex-wrap: wrap; }
.sub-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px; border-radius: 6px;
  background: #1a2a3a; color: #b0c0d0;
  text-decoration: none; font-size: 13px; transition: all 0.2s;
  border: 1px solid #2a3a4a;
}
.sub-btn:hover { background: #2a3a5a; border-color: #ffd54f44; color: #ffd54f; }

.footer {
  text-align: center; padding: 24px; color: #445566; font-size: 12px;
  border-top: 1px solid #1a2a3a; margin-top: 10px;
}
.sub-btn .sub { font-size: 11px; color: #667788; margin-left: 6px; }

.footer {
}
#update-info { margin-top: 8px; font-size: 12px; color: #556677; }
</style>
</head>
<body>

<div class="header">
  <h1>📷 PhotoWeather</h1>
  <div>
    <button class="lang-btn active" id="lang-zh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="hero">
  <h2 id="hero-title">🌤️ 攝影天氣助手</h2>
  <p id="hero-desc">選擇地區，查看未來三天最佳攝影景點推薦<br>天氣感知評分・季節限定提示</p>
</div>

<div class="region-grid" id="region-grid">
  <!-- 由 JS 動態渲染 -->
</div>

<div style="text-align:center;margin:8px 0 32px">
  <a class="sub-btn" href="/weather-guide" id="guide-link" style="cursor:pointer;display:inline-flex">🌤️ 天氣對策指南</a>
</div>

<div class="footer">
  <span id="footer-text">PhotoWeather © 2026 · 資料來源 Open-Meteo API</span>
</div>

let currentLang = 'zh';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + lang).classList.add('active');
  renderPage();
  }
  function loadSubRegion(region, sub) {
  window.location.href = `/summary?region=${region}&sub=${sub}`;
}

function renderPage() {
  const t = LANG[currentLang];
    document.getElementById('hero-title').innerHTML = t.title;
    document.getElementById('hero-desc').innerHTML = t.desc;
    document.getElementById('footer-text').textContent = t.footer;
    const guideLink = document.getElementById('guide-link');
    if (guideLink) guideLink.textContent = t.guide;

  const grid = document.getElementById('region-grid');
  grid.innerHTML = t.regions.map(r => {
      const subs = r.subs || [];
      return `
        <div class="region-card">
          <h3>${r.name}</h3>
          <div class="region-desc">${r.desc}</div>
          <div class="sub-regions">
            ${subs.map(s => `<a class="sub-btn" href="${s.href}" style="cursor:pointer">${s.label}</a>`).join('')}
          </div>
        </div>
      `;
    }).join('');
    }

    renderPage();
</script>
</body>
</html>
