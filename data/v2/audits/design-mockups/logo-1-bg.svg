<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="案1 adaptive 背景層">
  <!-- ============================================================
       案 1「稜線初光」· Android adaptive icon 背景層
       規格：108dp 畫布；背景層必須「可延伸」— 本層為單向漸層，
       遮罩放大/位移時邊緣連續、無斷裂（純漸層無邊界圖形）。
       ============================================================ -->
  <defs>
    <linearGradient id="fbg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#0D1B12"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#fbg1)"/>
</svg>
