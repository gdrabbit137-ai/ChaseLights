    </linearGradient>
  </defs>
  <!-- 光束 -->
  <path d="M67 44 L40 40 L40 52 Z" fill="url(#fbeam2)"/>
  <!-- 星點 -->
  <circle cx="86" cy="30" r="1.4" fill="#A7F3D0" opacity="0.8"/>
