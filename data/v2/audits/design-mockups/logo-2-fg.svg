<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="案2 adaptive 前景層">
  <!-- ============================================================
       案 2「燈塔光束」· Android adaptive icon 前景層
       規格：108dp 畫布；內容收在中心 66dp 安全圓內；
       光束允許帶透明漸層（裝飾性出血可接受，主體不出圈）。
       ============================================================ -->
  <defs>
    <linearGradient id="fbeam2" x1="67" y1="44" x2="40" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.8"/>
