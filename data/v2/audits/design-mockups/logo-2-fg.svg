  <path d="M36 78 L60 64 L72 68 L72 78 Z" fill="#14532D" opacity="0.6"/>
  <path d="M46 78 L66 68 L72 70 L72 78 Z" fill="#166534"/>
  <!-- 燈塔 -->
  <path d="M64 68 L65.4 54 L68.6 54 L70 68 Z" fill="#FFFFFF"/>
  <rect x="62.6" y="50" width="8.8" height="4.4" rx="0.8" fill="#166534"/>
