<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ChaseLights logo 案2：燈塔光束">
  <!-- ============================================================
       ChaseLights DESIGN-8 · logo 案 2/3「燈塔光束」
       主題：追逐燈火 — 岬角燈塔＋掃掠光束（致敬東引/三貂角燈塔意象）
       色系：深色底 #0B0F1A→#0C1410 ＋ 綠語義 #22C55E/#4ADE80
       16px 模擬：燈點亮斑＋光束楔形＋深色岬角剪影仍可辨
       ============================================================ -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#0C1410"/>
    </linearGradient>
    <linearGradient id="beam2" x1="388" y1="176" x2="70" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq2"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <g clip-path="url(#sq2)">
    <!-- 光束：燈室為頂點向左上展開 -->
    <path d="M388 176 L70 78 L70 216 Z" fill="url(#beam2)"/>
    <!-- 星點 -->
    <circle cx="452" cy="96" r="6" fill="#A7F3D0" opacity="0.85"/>
    <circle cx="480" cy="150" r="4" fill="#A7F3D0" opacity="0.7"/>
    <circle cx="420" cy="56" r="4" fill="#A7F3D0" opacity="0.7"/>
    <!-- 岬角：後層 / 前層 -->
    <path d="M512 512 V304 L392 268 L288 320 L288 512 Z" fill="#14532D" opacity="0.6"/>
    <path d="M512 512 V344 L404 312 L332 352 L332 512 Z" fill="#166534"/>
    <!-- 燈塔 -->
    <path d="M380 268 L386 190 L398 190 L404 268 Z" fill="#E6EBF2"/>
    <rect x="384" y="208" width="16" height="12" fill="#166534"/>
    <rect x="382" y="238" width="20" height="12" fill="#166534"/>
    <rect x="374" y="168" width="36" height="22" rx="3" fill="#166534"/>
    <circle cx="392" cy="179" r="9" fill="#4ADE80"/>
    <path d="M370 168 L414 168 L392 148 Z" fill="#E6EBF2"/>
    <rect x="368" y="262" width="48" height="10" rx="3" fill="#166534"/>
  </g>
</svg>
