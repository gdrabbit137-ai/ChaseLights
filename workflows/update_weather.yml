name: Update ChaseLights Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false  # 防止單一矩陣任務失敗影響其他任務
      matrix:
        region: [tw, jp, us]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weather analysis for ${{ matrix.region }}
        run: |
          python analyze_weather.py ${{ matrix.region }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *_weather.json
          
          # 防止併發 Git Push 衝突的重試機制
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update ${{ matrix.region }} weather data [skip ci]"
            
            # 嘗試重試 5 次 pull --rebase + push
            for i in {1..5}; do
              git pull --rebase && git push && break || sleep 5
            done
          fi
