<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChaseLights — 攝影條件評估</title>
<style>
:root{--ink:#1c2430;--mut:#5b6673;--line:#e3e7ec;--bg:#fbfcfd;--card:#fff;--ok:#1a7f4b;--no:#b3453a;--unk:#8a6d1f}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
header h1{font-size:18px;margin:0;font-weight:600}
.hlinks{display:flex;gap:14px;align-items:center}
.hlinks a{color:#2456a6;text-decoration:none;font-size:14px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;margin-left:6px;font-size:13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#eef3fb;border-color:#2456a6}
main{max-width:980px;margin:0 auto;padding:18px}
.notice{border:1px solid #e8d9a0;background:#fdf8e7;border-radius:8px;padding:10px 14px;font-size:13px;color:#6b5a1e;margin-bottom:16px;line-height:1.55}
.meta{font-size:12px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 16px;font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#1c2430;color:#fff;border-color:#1c2430}
.place{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.place h2{font-size:16px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.place h2 .tz{font-size:12px;color:var(--mut);font-weight:400}
.opp{display:flex;gap:12px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.opp:last-child{border-bottom:0}
.opp .name{font-size:14px;min-width:180px}
.opp .genre{font-size:12px;color:var(--mut)}
.chip{font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.chip.ok{background:#e5f4ec;color:var(--ok)}
.chip.no{background:#f9e9e7;color:var(--no)}
.chip.unk{background:#f6efdc;color:var(--unk)}
.hours{font-size:12px;color:var(--mut)}
.detail{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 4px}
.detail td,.detail th{border-top:1px solid var(--line);padding:4px 8px;text-align:left}
.live{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.live-block{border:1px solid var(--line);border-radius:8px;padding:8px}
.live-title{font-weight:600;margin-bottom:6px}
.live-table{width:100%;border-collapse:collapse;font-size:12px}
.live-table td,.live-table th{border-top:1px solid var(--line);padding:4px 8px;text-align:left}
.hourly .best-row{background:rgba(64,140,255,.18)}
.tag-now{color:#4fa3ff;font-weight:700}
.hourly-title{font-weight:600;margin:10px 0 4px}
.hourly-loading{color:var(--mut)}
.detail th{color:var(--mut);font-weight:500}
footer{padding:18px;text-align:center;font-size:12px;color:var(--mut)}
details summary{cursor:pointer;font-size:13px;color:#2456a6;padding:2px 0}
</style>
</head>
<body>
<header>
  <h1 id="t-title">攝影條件評估</h1>
  <div class="hlinks">
    <a href="index.html" id="t-home">Home</a>
    <span class="lang">
      <button data-lang="zh-TW" aria-pressed="true">繁</button>
      <button data-lang="en">EN</button>
      <button data-lang="ja">日</button>
    </span>
  </div>
</header>
<main>
  <div class="notice" id="notice"></div>
  <div class="meta" id="meta"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>
<footer id="footer"></footer>
<script type="module">
const I18N={
 "zh-TW":{title:"攝影條件評估",home:"首頁",guide:"GUIDANCE 參考",ok:"條件符合",no:"條件未符",unk:"資料不足",
  good:"符合時段（當地近似時間）",noneGood:"無符合時段",detail:"條件明細",cond:"條件",tier:"層級",verdict:"判定",
  passHours:"符合小時數",updated:"資料產生時間",valid:"預報窗口",places:"景點組",opps:"機會",prov:"資料來源",
  tz:"時間為當地近似（顯示用）",genre:"題材",noData:"此機會無法評估（無已驗證座標）",
  now:"現在",nextGood:"下一個符合時段",value:"現值",thr:"門檻",inWin:"窗內",outWin:"窗外",declared:"宣告成立",time:"時間",verdictLabel:"判定",
  hourTable:"逐時評估（當地近似時間）",
  tiers:{MAIN:"主",MODIFIER:"修正",BONUS:"加分",SHOOT:"拍攝"},
  verdicts:{PASS:"符合",FAIL:"未符",UNKNOWN:"未知"}},
 en:{title:"Photography Condition Evaluation",home:"Home",guide:"GUIDANCE only",ok:"Conditions met",no:"Conditions not met",unk:"Insufficient data",
  good:"Qualifying hours (approx. local time)",noneGood:"No qualifying hours",detail:"Condition detail",cond:"Condition",tier:"Tier",verdict:"Verdict",
  passHours:"Qualifying hours",updated:"Generated at",valid:"Forecast window",places:"place groups",opps:"opportunities",prov:"Data source",
  tz:"Times shown in approximate local clock (display only)",genre:"Genre",noData:"Not evaluable (no verified coordinate)",
  now:"Now",nextGood:"Next qualifying window",value:"Value",thr:"Threshold",inWin:"in window",outWin:"out of window",declared:"declared",time:"Time",verdictLabel:"Status",
  hourTable:"Hourly assessment (approx. local time)",
  tiers:{MAIN:"MAIN",MODIFIER:"MODIFIER",BONUS:"BONUS",SHOOT:"SHOOT"},
  verdicts:{PASS:"PASS",FAIL:"FAIL",UNKNOWN:"UNKNOWN"}},
 ja:{title:"撮影条件評価",home:"ホーム",guide:"GUIDANCE参考",ok:"条件を満たす",no:"条件を満たさず",unk:"データ不足",
  good:"適合時間帯（現地近似時刻）",noneGood:"適合時間帯なし",detail:"条件明細",cond:"条件",tier:"層",verdict:"判定",
  passHours:"適合時間数",updated:"生成時刻",valid:"予報期間",places:"地点グループ",opps:"機会",prov:"データ源",
  tz:"時刻は現地近似（表示用）",genre:"ジャンル",noData:"評価不可（検証済み座標なし）",
  now:"現在",nextGood:"次の適合時間帯",value:"現在値",thr:"閾値",inWin:"窓内",outWin:"窓外",declared:"申告済み",time:"時刻",verdictLabel:"判定",
  hourTable:"時間別評価（現地近似時刻）",
  tiers:{MAIN:"主",MODIFIER:"修正",BONUS:"ボーナス",SHOOT:"撮影"},
  verdicts:{PASS:"適合",FAIL:"不適合",UNKNOWN:"不明"}}
};
const METRICS={
 cloud_cover_low:{"zh-TW":"低雲",en:"Low cloud",ja:"下層雲",unit:"%"},
 cloud_cover_mid:{"zh-TW":"中雲",en:"Mid cloud",ja:"中層雲",unit:"%"},
 cloud_cover_high:{"zh-TW":"高雲",en:"High cloud",ja:"上層雲",unit:"%"},
 cloud_cover_total:{"zh-TW":"總雲量",en:"Total cloud",ja:"雲量",unit:"%"},
 cloud_cover_mid_and_high:{"zh-TW":"中高雲",en:"Mid+high cloud",ja:"中上層雲",unit:"%"},
 wind_speed_10m:{"zh-TW":"風速",en:"Wind",ja:"風速",unit:"m/s"},
 wind_speed_850hpa:{"zh-TW":"850hPa風速",en:"850hPa wind",ja:"850hPa風速",unit:"m/s"},
 precipitation:{"zh-TW":"降水",en:"Precipitation",ja:"降水",unit:"mm"},
 precipitation_probability:{"zh-TW":"降水機率",en:"Precip probability",ja:"降水確率",unit:"%"},
 aod_550nm:{"zh-TW":"氣膠光學厚度",en:"Aerosol optical depth",ja:"エアロゾル光学的厚度",unit:""},
 visibility:{"zh-TW":"能見度",en:"Visibility",ja:"視程",unit:"km"},
 relative_humidity_2m:{"zh-TW":"相對濕度",en:"Humidity",ja:"相対湿度",unit:"%"},
 relative_humidity_925hpa:{"zh-TW":"925hPa濕度",en:"925hPa humidity",ja:"925hPa湿度",unit:"%"},
 relative_humidity_850hpa:{"zh-TW":"850hPa濕度",en:"850hPa humidity",ja:"850hPa湿度",unit:"%"},
 temperature_2m:{"zh-TW":"氣溫",en:"Temperature",ja:"気温",unit:"°C"},
 temperature_delta_850_925_c:{"zh-TW":"逆溫指標",en:"Inversion index",ja:"逆転指標",unit:"°C"},
 lcl_height_m_agl:{"zh-TW":"雲底高度(LCL)",en:"Cloud base (LCL)",ja:"雲底高度(LCL)",unit:"m"},
 sunrise_time_window:{"zh-TW":"日出窗口",en:"Sunrise window",ja:"日の出窓",unit:""},
 sunset_window:{"zh-TW":"日落窗口",en:"Sunset window",ja:"日没窓",unit:""},
 moon_illumination_fraction:{"zh-TW":"月照亮百分比",en:"Moon illumination fraction",ja:"月照率",unit:"%"},
 moon_target_separation_deg:{"zh-TW":"月目標角距",en:"Moon separation",ja:"月と対象の角距離",unit:"°"},
 river_flow_state:{"zh-TW":"河川流量狀態",en:"River flow state",ja:"河川流量状態",unit:""},
 blue_hour_window:{"zh-TW":"藍調窗口",en:"Blue hour window",ja:"ブルーアワー窓",unit:""},
 golden_hour_window:{"zh-TW":"黃金時刻窗",en:"Golden hour window",ja:"ゴールデンアワー窓",unit:""},
 astronomical_darkness:{"zh-TW":"天文黑暗",en:"Astronomical darkness",ja:"天文学的暗闇",unit:""},
 moon_altitude:{"zh-TW":"月高角",en:"Moon altitude",ja:"月高度",unit:"°"},
 moon_illuminance_proxy:{"zh-TW":"月照強度",en:"Moon illumination",ja:"月照強度",unit:""},
 galactic_core_altitude:{"zh-TW":"銀河核心高度",en:"Galactic core altitude",ja:"銀河中心高度",unit:"°"},
 seasonal_state:{"zh-TW":"花季狀態",en:"Seasonal state",ja:"季節状態",unit:""},
 water_surface_state:{"zh-TW":"水面狀態",en:"Water surface state",ja:"水面状態",unit:""},
 landform_present:{"zh-TW":"地形存在",en:"Landform present",ja:"地形存在",unit:""}
};
function metricLabel(m){
 const def=METRICS[m];return def?def[LANG]:m;
}
const GENRE={
 cloud_sea:{"zh-TW":"雲海",en:"Sea of clouds",ja:"雲海"},
 sunrise:{"zh-TW":"日出",en:"Sunrise",ja:"ご来光"},
 sunset:{"zh-TW":"夕景",en:"Sunset",ja:"夕景"},
 golden_hour:{"zh-TW":"黃金時刻",en:"Golden hour",ja:"ゴールデンアワー"},
 blue_hour_city:{"zh-TW":"城市藍調",en:"City blue hour",ja:"都市ブルーアワー"},
 city_night:{"zh-TW":"城市夜景",en:"City night",ja:"都市夜景"},
 night_sky:{"zh-TW":"星空",en:"Night sky",ja:"星空"},
 mountain_view:{"zh-TW":"山景展望",en:"Mountain view",ja:"山岳展望"},
 overlook:{"zh-TW":"展望台",en:"Overlook",ja:"展望台"},
 reflection:{"zh-TW":"倒影",en:"Reflection",ja:"鏡面反射"},
 overcast_soft:{"zh-TW":"柔和陰天",en:"Soft overcast",ja:"ソフトな曇天"},
 seasonal_plant:{"zh-TW":"季節植物",en:"Seasonal plants",ja:"季節の植物"},
 geological_landform:{"zh-TW":"地質地景",en:"Geological landform",ja:"地質地形"},
 waterfall:{"zh-TW":"瀑布",en:"Waterfall",ja:"滝"}
};
let LANG=localStorage.getItem("cl-lang")||"zh-TW";
let DATA=null,DAY=null,OPEN=new Set();
const $=s=>document.querySelector(s);
function T(){return I18N[LANG]}
const PROVISIONAL_RE=/\s*\((?:provisional[^)]*|暫定[^)]*|仮[・譯][^)]*)\)\s*/gi;
function cleanName(raw,lang,oid){
 let v=raw&&(raw[lang]||"").trim();
 if(!v||/pending review|レビュー待ち|待審/.test(v)) v=(raw&&raw["zh-TW"])||oid;
 return v.replace(PROVISIONAL_RE,"").trim()||oid;
}
function chip(state){
 const t=T();
 if(state==="GUIDANCE_SATISFIED")return `<span class="chip ok">${t.ok}</span>`;
 if(state==="UNFAVORABLE")return `<span class="chip no">${t.no}</span>`;
 return `<span class="chip unk">${t.unk}</span>`;
}
function dayLabel(d){
 const dt=new Date(d+"T12:00:00");
 const wd=new Intl.DateTimeFormat(LANG,{weekday:"short"}).format(dt);
 const md=`${String(dt.getMonth()+1)}/${String(dt.getDate())}`;
 return `${md} ${wd}`;
}
function fmtLocal(iso){
 const d=new Date(iso);
 const age=Math.max(0,(Date.now()-d.getTime())/3600000);
 const label=new Intl.DateTimeFormat(LANG,{dateStyle:"short",timeStyle:"short"}).format(d);
 const hours=age<1?null:Math.round(age);
 const rel=hours===null?null:(hours<=6?{ "zh-TW":`${hours} 小時前`,en:`${hours}h ago`,ja:`${hours}時間前` }[LANG]:null);
 return rel?`${label} (${rel})`:label;
}
function fmtHours(list){
 if(!list||!list.length)return T().noneGood;
 // collapse consecutive HH:MM into ranges
 const mins=list.map(h=>{const[a,b]=h.split(":");return +a*60+ +b}).sort((x,y)=>x-y);
 const out=[];let s=mins[0],p=mins[0];
 for(let i=1;i<=mins.length;i++){
  if(i<mins.length&&mins[i]===p+60){p=mins[i];continue}
  const f=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  out.push(s===p?f(s):`${f(s)}–${f(Math.min(p+59,1439))}`);
  if(i<mins.length){s=p=mins[i]}
 }
 return out.join("、")||T().noneGood;
}
const DETAILS={};
function loadDetail(pid){
 if(DETAILS[pid])return Promise.resolve(DETAILS[pid]);
 return fetch(`evaluations-details/${encodeURIComponent(pid)}.json?v=${DATA.generated_at}`,{cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{DETAILS[pid]=d;return d});
}
function fmtThreshold(op,th,t){
 if(op==="none"||th===null||th===undefined)return "";
 if(op==="between"&&Array.isArray(th))return `${th[0]}–${th[1]}`;
 const sym={lt:"<",lte:"≤",gt:">",gte:"≥",eq:"="}[op]||op;
 return `${sym}${th}`;
}
function fmtValue(v,t){
 if(v===null||v===undefined)return "—";
 if(v===true)return t.inWin;
 if(v===false)return t.outWin;
 if(v==="declared")return t.declared;
 return String(v);
}
function liveBlock(snap,title){
 if(!snap)return "";
 const t=T();
 const rows=snap.conditions.map(c=>{
  const th=fmtThreshold(c.operator,c.threshold,t);
  return `<tr><td>${metricLabel(c.metric)}</td><td>${fmtValue(c.value,t)}</td><td>${th}</td><td>${t.verdicts[c.verdict]||c.verdict}</td></tr>`;
 }).join("");
 return `<div class="live-block"><div class="live-title">${title} · ${snap.local}</div><table class="live-table"><tr><th>${t.cond}</th><th>${t.value}</th><th>${t.thr}</th><th>${t.verdict}</th></tr>${rows}</table></div>`;
}
function hourTableHTML(pd,o,dayKey,t){
 const opp=pd&&pd.opportunities&&pd.opportunities.find(x=>x.opportunity_id===o.opportunity_id);
 if(!opp)return `<div class="hourly-loading">—</div>`;
 const day=opp.days.find(x=>x.local_date===dayKey);
 if(!day)return `<div class="hourly-loading">—</div>`;
 const nowLocal=o.live&&o.live.now?o.live.now.local:null;
 const cols=["cloud_cover_low","cloud_cover_mid_and_high","wind_speed_10m","precipitation","aod_550nm","visibility"].filter(m=>day.hours.some(h=>h.conditions.some(c=>c.metric===m)));
 let html=`<div class="timeline-table-wrap" style="overflow-x:auto"><table class="detail hourly"><tr><th>${t.time}</th><th>${t.verdictLabel}</th>${cols.map(m=>`<th>${metricLabel(m)}</th>`).join("")}</tr>`;
 for(const h of day.hours){
  const vals=cols.map(m=>{
   const c=h.conditions.find(x=>x.metric===m);
   if(!c)return "<td>—</td>";
   const v=fmtValue(c.value,T());
   return `<td>${v==="—"?"—":v}</td>`;
  }).join("");
  const cls=h.status==="GUIDANCE_SATISFIED"?' class="best-row"':"";
  html+=`<tr${cls}><td>${h.local}${nowLocal&&h.local===nowLocal.slice(11)?' <span class="tag-now">●</span>':""}</td><td>${t.verdicts[h.status==="GUIDANCE_SATISFIED"?"PASS":h.status==="UNFAVORABLE"?"FAIL":"UNKNOWN"]}</td>${vals}</tr>`;
 }
 return html+"</table></div>";
}
function render(){
 const t=T();
 $("#t-title").textContent=t.title;$("#t-home").textContent=t.home;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
 $("#notice").textContent=DATA.limitations_i18n[LANG];
 $("#meta").textContent=`${t.updated}: ${fmtLocal(DATA.generated_at)} ｜ ${t.valid}: ${DATA.valid_from} – ${DATA.valid_until} ｜ ${DATA.place_count} ${t.places} ｜ ${DATA.opportunity_count} ${t.opps} ｜ ${t.prov}: ${DATA.provider.name} (${DATA.provider.licence})`;
 const tabs=$("#tabs");tabs.innerHTML="";
 DATA.days.forEach(d=>{
  const b=document.createElement("button");b.textContent=dayLabel(d);b.setAttribute("aria-selected",String(d===DAY));
  b.onclick=()=>{DAY=d;render()};tabs.appendChild(b)});
 if(!DAY)DAY=DATA.days[0];
 const c=$("#content");c.innerHTML="";
 for(const place of DATA.places){
  const opps=place.opportunities.filter(o=>o.days.some(x=>x.local_date===DAY));
  if(!opps.length)continue;
  const card=document.createElement("section");card.className="place";
  const name=cleanName(place.name_i18n,LANG,place.place_id);
  const head=document.createElement("h2");
  head.innerHTML=`<span>${name}</span><span class="tz">${place.timezone_display.iana?place.timezone_display.iana+" · ":""}${t.tz}</span>`;
  head.onclick=()=>{const key=place.place_id;OPEN.has(key)?OPEN.delete(key):OPEN.add(key);render()};
  card.appendChild(head);
  const isOpen=OPEN.has(place.place_id);
  for(const o of opps){
   if(!isOpen&&opps.length>1){/* collapsed: show first opp only as summary */}
   const day=o.days.find(x=>x.local_date===DAY);
   const row=document.createElement("div");row.className="opp";
   const genre=GENRE[o.genre_template]?GENRE[o.genre_template][LANG]:o.genre_template;
   row.innerHTML=`<span class="name">${cleanName(o.name_i18n,LANG,o.opportunity_id)}</span>
    <span class="genre">${genre}</span>${chip(day.state)}
    <span class="hours">${day.state==="GUIDANCE_SATISFIED"?fmtHours(day.good_hours):""}</span>`;
   card.appendChild(row);
   if(isOpen){
    const det=document.createElement("details");det.open=true;
    det.innerHTML=`<summary>${t.detail}</summary>`;
    // live snapshot blocks (from bundle, no extra fetch)
    const liveBox=document.createElement("div");liveBox.className="live";
    liveBox.innerHTML=liveBlock(o.live&&o.live.now,t.now)+liveBlock(o.live&&o.live.next_good,t.nextGood);
    det.appendChild(liveBox);
    // V1-style hourly table (lazy per-place detail fetch)
    const holder=document.createElement("div");holder.className="hourly-holder";
    holder.innerHTML=`<div class="hourly-title">${t.hourTable}</div><div class="hourly-loading">…</div>`;
    det.appendChild(holder);
    det.addEventListener("toggle",()=>{
     if(!det.open||holder.dataset.done)return;
     loadDetail(place.place_id).then(pd=>{
      holder.dataset.done="1";
      holder.innerHTML=`<div class="hourly-title">${t.hourTable}</div>`+hourTableHTML(pd,o,DAY,t);
     }).catch(()=>{holder.innerHTML=`<div class="hourly-title">${t.hourTable}</div><div class="hourly-loading">—</div>`;});
    });
    if(det.open){det.dispatchEvent(new Event("toggle"));}
    card.appendChild(det);
   }
  }
  // collapse behaviour: when closed show only summary rows (already all rows; fine)
  c.appendChild(card);
 }
 $("#footer").textContent=`${DATA.provider.name} ${DATA.provider.licence} · ChaseLights V2 evaluation ${DATA.evaluation_bundle_version}`;
}
function oShort(o,lang){
 return cleanName(o.name_i18n,lang,o.opportunity_id);
}
function enrich(){
 // derive valid window + per-day condition aggregates are precomputed server-side
}
fetch("evaluations-latest.json?v=" + Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
 DATA=d;
 const days=new Set();for(const p of DATA.places)for(const o of p.opportunities)for(const x of o.days)days.add(x.local_date);
 DATA.days=[...days].sort();
 DATA.valid_from=DATA.days[0];DATA.valid_until=DATA.days[DATA.days.length-1];
 DATA.generated_at_display=DATA.generated_at;
 render();
 document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;localStorage.setItem("cl-lang",LANG);render()});
});
</script>
</body>
</html>
