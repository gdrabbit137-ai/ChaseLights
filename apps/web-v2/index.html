<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ChaseLights V2 — 攝影預報</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" id="skip-link" data-i18n-text="skipToContent" href="#content">跳至主要內容</a>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◉</span><div><strong>ChaseLights <span class="v2">V2</span></strong><small id="subtitle"></small></div></div>
    <label class="language"><span id="language-label"></span>
      <select id="language" data-i18n-aria="languageAria" aria-label="語言選擇"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select>
    </label>
  </header>
  <main id="content" tabindex="-1">
    <section class="intro" id="forecast-home" aria-labelledby="headline">
      <div><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p id="intro"></p><p class="eval-entry"><a id="evaluations-link" href="./evaluations.html"></a></p></div>
    </section>
    <section class="forecast-empty" aria-labelledby="forecast-status">
      <p class="meta" id="date-status"></p>
      <h2 id="forecast-status"></h2>
      <p id="forecast-help"></p>
      <button id="browse-research" type="button" aria-expanded="false" aria-controls="research-browser"></button>
    </section>
    <section id="research-browser" hidden aria-labelledby="research-heading">
      <div class="research-heading"><h2 id="research-heading" tabindex="-1"></h2><button id="close-research" type="button"></button></div>
      <p class="research-scope" id="research-scope"></p>
      <div class="data-state" id="data-state" data-status="loading">
        <p id="data-status" role="status" aria-live="polite"></p>
        <button id="retry" type="button"></button>
      </div>
      <div class="workspace">
        <aside class="sidebar" id="sidebar" data-i18n-aria="placesAria" aria-label="景點清單">
          <div class="sidebar-top"><h2 id="places-heading"></h2><span id="place-count"></span></div>
          <p class="meta" id="sort-status"></p>
          <button id="open-filters" type="button" aria-expanded="false" aria-controls="filter-panel"></button>
          <div id="filter-panel">
            <button id="close-filters" type="button"></button>
            <label class="search-label" for="search" id="search-label"></label>
            <input id="search" type="search" autocomplete="off">
            <fieldset id="topic-filters"><legend id="topic-heading"></legend><div id="topic-options"></div></fieldset>
            <button id="clear-filters" type="button"></button>
          </div>
          <div id="places-list" class="places-list" aria-live="polite"></div>
          <button id="clear-search" type="button" hidden></button>
        </aside>
        <section id="detail" class="detail" aria-live="polite" data-i18n-aria="opportunitiesAria" aria-label="攝影題材與研究資料"></section>
      </div>
    </section>
    <details class="tools" id="data-tools">
      <summary id="tools-heading"></summary>
      <section class="import-panel">
        <div><h2 id="import-heading"></h2><p id="import-help"></p></div>
        <label class="upload"><span id="upload-label"></span><input id="file" type="file" accept=".json,application/json"></label>
      </section>
      <details id="source-details">
        <summary id="source-heading"></summary>
        <section class="source-strip" id="source-strip" data-i18n-aria="provenanceAria" aria-label="資料來源與時效">
          <div><span id="source-label"></span><strong id="source-value"></strong><span id="source-commit-label"></span><strong id="source-commit-value"></strong></div>
          <div><span id="updated-label"></span><strong id="updated-value"></strong></div>
          <div><span id="loaded-label"></span><strong id="loaded-value"></strong></div>
        </section>
      </details>
    </details>
    <footer><p id="footer-copy"></p></footer>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
