<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./assets/site-nav.css?v=clui117">
  <link rel="stylesheet" href="./assets/app.css?v=clui137">
  <style>
    /* CL-UI-90: reminders page — mockup-first rebuild (Stage 3a).
       Spec source (逐字實作): origin/task/DESIGN-3 head 3d455f121
       data/v2/audits/design-mockups/mockup-reminders.html — the
       region→place→subject three-tier add flow + parallel keyword search +
       add preview, the reminder card (place + subject chip + mono next-trigger
       + switch/edit/delete), the amber consecutive-unfit streak and the
       standard empty state. All colors/radii/spacing/heights reference the
       live --cl-* tokens (app.css :root) — no color redefinition here.
       Behavior layer unchanged: notify_rules CRUD endpoints, bell semantics,
       favorites isolation, login gate (CL-UI-58/61 contracts). */
    .rem-header{max-width:760px;margin:0 auto;padding:var(--cl-sp-5) var(--cl-sp-4) 0}
    .rem-title-row{display:flex;align-items:baseline;gap:var(--cl-sp-3);flex-wrap:wrap}
    .rem-title-row h1{white-space:nowrap}
    .rem-title-row h1{margin:0;font-size:var(--cl-fs-20);font-weight:600;color:var(--cl-text-1)}
    .rem-count{font-size:var(--cl-fs-13);color:var(--cl-text-3);white-space:nowrap}
    /* CL-UI-126: the language switcher rides the TOP NAVBAR (one instance of
       #lang-select; the page header no longer carries a duplicate). */
    .site-nav-lang{display:inline-flex;align-items:center;flex:none}
    .site-nav-lang .lang-dropdown{height:32px;min-height:32px;padding:0 8px;border-radius:8px;
      background:var(--cl-bg-3);color:var(--cl-text-1);border:1px solid var(--cl-border-strong);font-size:.82rem;font-weight:600}
    @media (max-width: 768px) {
      /* logo-only brand keeps the bottom bar from overflowing at 390px */
      .site-nav-brand{font-size:0}
      .site-nav-lang .lang-dropdown{max-width:80px;font-size:.72rem;padding:0 2px}
    }
    .rem-wrap{max-width:760px;margin:0 auto;padding:var(--cl-sp-4) var(--cl-sp-4) 80px}
    .rem-panel{background:var(--cl-bg-1);border:1px solid var(--cl-border);border-radius:var(--cl-r-md);
      padding:var(--cl-sp-4);margin-bottom:var(--cl-sp-4)}
    .rem-panel h2{margin:0 0 var(--cl-sp-3);font-size:var(--cl-fs-14);font-weight:600;color:var(--cl-text-1)}
    /* ── 新增提醒：三層選單＋關鍵字搜尋並行（mockup .add-flow）── */
    .rem-add-flow{display:flex;align-items:center;gap:var(--cl-sp-2);flex-wrap:wrap}
    .rem-add-flow .rem-arrow{color:var(--cl-text-3);font-size:var(--cl-fs-12);flex:none}
    .rem-add-flow select,.rem-search{height:var(--cl-control-h);padding:0 var(--cl-sp-3);
      background:var(--cl-bg-2);border:1px solid var(--cl-border);border-radius:var(--cl-r-sm);
      color:var(--cl-text-1);font-size:var(--cl-fs-13)}
    .rem-add-flow select:focus-visible,.rem-search:focus-visible{outline:1px solid var(--cl-border-strong)}
    .rem-add-flow #rem-place{flex:1;min-width:180px}
    .rem-search{display:block;width:100%;margin-top:var(--cl-sp-2)}
    .rem-results{list-style:none;margin:var(--cl-sp-3) 0 0;padding:0;border-top:1px solid var(--cl-border)}
    .rem-results li{display:flex;align-items:center;gap:var(--cl-sp-2);padding:var(--cl-sp-2) 0;
      border-bottom:1px solid var(--cl-border);min-width:0}
    .rem-results li.rem-rr-note{color:var(--cl-text-3);font-size:var(--cl-fs-12);border-bottom:none}
    .rem-results .rem-rr-main{flex:1;min-width:0;overflow:hidden}
    .rem-results .rem-rr-name{display:block;font-size:var(--cl-fs-13);font-weight:600;color:var(--cl-text-1);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rem-results .rem-rr-sub{display:block;color:var(--cl-text-3);font-size:var(--cl-fs-12);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rem-results .rem-rr-hint{color:var(--cl-text-3);font-size:var(--cl-fs-12)}
    .rem-results button{height:30px;padding:0 10px;border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);
      background:var(--cl-bg-2);color:var(--cl-text-2);font-size:var(--cl-fs-12);white-space:nowrap;flex:none;cursor:pointer}
    .rem-results button:hover:not([disabled]){background:var(--cl-bg-3);color:var(--cl-text-1);border-color:var(--cl-border-strong)}
    .rem-results button[disabled]{opacity:.55;cursor:default}
    /* 加入預覽列（三層選齊後出現；未選齊主按鈕 disabled） */
    .rem-preview{display:flex;align-items:center;gap:var(--cl-sp-2);margin-top:var(--cl-sp-3);
      padding:var(--cl-sp-2) var(--cl-sp-3);background:var(--cl-bg-2);border:1px solid var(--cl-border-strong);
      border-radius:var(--cl-r-sm);font-size:var(--cl-fs-13);color:var(--cl-text-1)}
    .rem-preview[hidden]{display:none}
    .rem-preview .rem-p-ic{flex:none}
    .rem-preview .rem-p-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rem-preview .rem-add-btn{height:32px;padding:0 var(--cl-sp-4);border-radius:var(--cl-r-xs);
      border:1px solid var(--cl-border-strong);background:var(--cl-bg-3);color:var(--cl-text-1);
      font-size:var(--cl-fs-13);font-weight:600;white-space:nowrap;flex:none;cursor:pointer}
    .rem-add-btn:hover:not([disabled]){background:var(--cl-bg-2)}
    .rem-add-btn[disabled]{opacity:.45;cursor:default}
    .rem-hint{font-size:var(--cl-fs-12);color:var(--cl-text-3);margin:var(--cl-sp-2) 0 0}
    /* ── 提醒卡（mockup .rem-card 解剖：一行主狀態）────────── */
    .rem-card{background:var(--cl-bg-1);border:1px solid var(--cl-border);border-radius:var(--cl-r-md);
      padding:var(--cl-sp-3) var(--cl-sp-4);margin-bottom:var(--cl-sp-2);display:flex;gap:var(--cl-sp-3);
      align-items:center;min-width:0}
    .rem-card:hover{border-color:var(--cl-border-strong)}
    .rem-card.rem-off .rem-main{opacity:.55}
    .rem-main{flex:1;min-width:0}
    .rem-line1{display:flex;align-items:center;gap:var(--cl-sp-2);min-width:0}
    .rem-place{font-size:var(--cl-fs-14);font-weight:600;color:var(--cl-text-1);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rem-subject-chip{display:inline-flex;align-items:center;height:var(--cl-chip-h);padding:0 var(--cl-sp-2);flex:none;
      max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);background:var(--cl-bg-1);
      font-size:var(--cl-fs-12);color:var(--cl-text-2)}
    .rem-line2{display:flex;align-items:center;gap:var(--cl-sp-2);margin-top:2px;
      font-size:var(--cl-fs-12);color:var(--cl-text-3);min-width:0}
    .rem-region{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;max-width:60%}
    .rem-next{margin-left:auto;font-family:var(--cl-mono);font-size:var(--cl-fs-12);
      color:var(--cl-green-text);flex:none}
    .rem-next.rem-next-warn{color:var(--cl-amber-text)}
    .rem-next.rem-next-off{color:var(--cl-grey-text)}
    .rem-acts{display:flex;gap:var(--cl-sp-2);flex:none;align-items:center}
    .rem-acts .rem-edit-btn{height:30px;padding:0 10px;border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);
      background:var(--cl-bg-2);color:var(--cl-text-2);font-size:var(--cl-fs-12);white-space:nowrap;cursor:pointer}
    .rem-acts .rem-edit-btn:hover{background:var(--cl-bg-3);color:var(--cl-text-1);border-color:var(--cl-border-strong)}
    .rem-acts .rem-del{height:30px;padding:0 10px;border-radius:var(--cl-r-xs);border:1px solid var(--cl-red-border);
      background:transparent;color:var(--cl-red-text);font-size:var(--cl-fs-12);white-space:nowrap;cursor:pointer}
    .rem-acts .rem-del:hover{background:var(--cl-red-bg)}
    /* 開關 switch（design-system 元件：36×20 圓角軌道＋滑塊） */
    .rem-switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--cl-bg-3);
      border:1px solid var(--cl-border-strong);cursor:pointer;flex:none;transition:background .15s;padding:0}
    .rem-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
      background:var(--cl-text-3);transition:all .15s}
    .rem-switch::before{content:"";position:absolute;inset:-12px} /* invisible 44px-class touch target */
    .rem-switch.rem-on{background:var(--cl-green-bg);border-color:var(--cl-green-border)}
    .rem-switch.rem-on::after{left:18px;background:var(--cl-green)}
    /* ── CL-UI-99: 自訂條件表單（第三層選「自訂條件…」時展開）────────── */
    .rem-cc-panel{margin-top:var(--cl-sp-3);border:1px solid var(--cl-border);border-radius:var(--cl-r-md);
      padding:var(--cl-sp-3) var(--cl-sp-4);background:var(--cl-bg-2)}
    .rem-cc-panel[hidden]{display:none}
    .rem-cc-title{margin:0 0 var(--cl-sp-2);font-size:var(--cl-fs-12);color:var(--cl-text-2)}
    .rem-cc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--cl-sp-2) var(--cl-sp-3)}
    .rem-cc-field{display:flex;flex-direction:column;gap:2px;min-width:0}
    .rem-cc-name{font-size:var(--cl-fs-12);color:var(--cl-text-2);font-weight:600}
    .rem-cc-field input{height:32px;min-height:32px;padding:0 8px;border-radius:var(--cl-r-xs);
      border:1px solid var(--cl-border-strong);background:var(--cl-bg-1);color:var(--cl-text-1);
      font-size:var(--cl-fs-13);width:100%;box-sizing:border-box}
    .rem-cc-field input:focus{outline:1.5px solid var(--cl-green-border);outline-offset:0}
    .rem-cc-hint{font-size:11px;color:var(--cl-text-3);line-height:1.35}
    .rem-cc-window{display:flex;align-items:center;gap:6px}
    .rem-cc-window .rem-cc-dash{color:var(--cl-text-3);flex:none}
    .rem-cc-window input{height:32px;min-height:32px;padding:0 6px;border-radius:var(--cl-r-xs);
      border:1px solid var(--cl-border-strong);background:var(--cl-bg-1);color:var(--cl-text-1);
      font-size:var(--cl-fs-13);min-width:0;flex:1;box-sizing:border-box}
    /* 提醒卡第三行：自訂條件摘要（mono，muted — 詳細氣象屬 expanded 層的語意不進卡片敘事） */
    .rem-line3{margin-top:2px;min-width:0}
    .rem-cc-summary{font-family:var(--cl-mono);font-size:var(--cl-fs-12);color:var(--cl-text-3);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
    /* CL-UX-01 Part B: 排程摘要同款 mono/muted，語意獨立於自訂條件那一行 */
    .rem-sched-summary{font-family:var(--cl-mono);font-size:var(--cl-fs-12);color:var(--cl-text-3);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
    /* ── 空狀態（design-system §9：dashed 框＋圖示＋主張＋動作鈕）── */
    .rem-empty{display:flex;flex-direction:column;align-items:center;gap:var(--cl-sp-2);
      padding:var(--cl-sp-6) var(--cl-sp-4);background:var(--cl-bg-1);
      border:1px dashed var(--cl-border-strong);border-radius:var(--cl-r-md);text-align:center}
    .rem-empty[hidden]{display:none}
    .rem-empty .rem-e-ic{font-size:28px;opacity:.7}
    .rem-empty .rem-e-t{font-size:var(--cl-fs-14);font-weight:600;color:var(--cl-text-1)}
    .rem-empty .rem-e-d{font-size:var(--cl-fs-13);color:var(--cl-text-3);max-width:340px}
    .rem-empty .rem-e-btn{margin-top:var(--cl-sp-2);height:var(--cl-btn-h);padding:0 var(--cl-sp-4);
      border-radius:var(--cl-r-xs);border:1px solid var(--cl-border-strong);background:var(--cl-bg-3);
      color:var(--cl-text-1);font-size:var(--cl-fs-14);font-weight:600;cursor:pointer}
    /* 登入面板（沿用 rem-login-panel 語義，改 design-system 面板殼） */
    .rem-login{text-align:center;padding:var(--cl-sp-2) 0}
    .rem-login p{margin:0 0 var(--cl-sp-2);font-size:var(--cl-fs-13);color:var(--cl-text-2)}
    .rem-login a{display:inline-block;margin:6px;padding:10px 16px;border-radius:var(--cl-r-sm);
      border:1px solid var(--cl-border-strong);background:var(--cl-bg-2);color:var(--cl-text-1);
      text-decoration:none;font-size:var(--cl-fs-13)}
    .rem-login a:hover{background:var(--cl-bg-3)}
    .rem-state{color:var(--cl-text-3);font-size:var(--cl-fs-13);text-align:center;padding:var(--cl-sp-4) 0}
    .rem-notice{position:fixed;bottom:12px;left:12px;right:12px;margin:0 auto;max-width:420px;
      padding:8px 12px;border:1px solid var(--cl-border-strong);background:var(--cl-bg-1);color:var(--cl-text-1);
      font-size:var(--cl-fs-13);border-radius:var(--cl-r-sm);z-index:10001;text-align:center}
    .rem-notice[hidden]{display:none}
    /* 390 節奏（mockup：按鈕列縱排全寬、44px 觸控目標維持 thumb 可達） */
    @media (max-width: 390px) {
      .rem-add-flow #rem-place{flex:1 1 100%}
      .rem-line2 .rem-next{font-size:11px}
    }
    /* 通用窄幅（<=480px）：觸控目標 44px 級距 */
    @media (max-width: 480px) {
      .rem-acts{flex-direction:column;gap:4px;align-items:stretch}
      .rem-acts .rem-edit-btn,.rem-acts .rem-del{height:44px;min-height:44px}
      .rem-results button{min-height:44px}
    }
    /* ── CL-APP-09 追加3：我的分頁（我的提醒／我的題材）＋我的題材管理區 ── */
    .rem-tabs{display:flex;gap:var(--cl-sp-2);margin-top:var(--cl-sp-3)}
    .rem-tab{height:var(--cl-control-h);min-height:44px;padding:0 var(--cl-sp-4);border:1px solid var(--cl-border);
      border-radius:999px;background:transparent;color:var(--cl-text-3);font-weight:500;cursor:pointer}
    .rem-tab.on{border:1.5px solid var(--cl-border-strong);color:var(--cl-text-1);font-weight:600;background:var(--cl-bg-1)}
    .rem-count-row{max-width:760px;margin:var(--cl-sp-3) auto 0;padding:0 var(--cl-sp-4);color:var(--cl-text-3);font-size:var(--cl-fs-13)}
    .sslib-wrap{display:flex;flex-direction:column;gap:var(--cl-sp-3)}
    .sslib-head{display:flex;gap:var(--cl-sp-3);align-items:center;flex-wrap:wrap}
    .sslib-title{font-size:var(--cl-fs-20);font-weight:700;color:var(--cl-text-1)}
    .sslib-desc{font-size:var(--cl-fs-13);color:var(--cl-text-3)}
    .sslib-quota{margin-left:auto;font-size:var(--cl-fs-12);color:var(--cl-text-3);font-family:var(--cl-mono)}
    .sslib-add{height:var(--cl-btn-h);min-height:44px;padding:0 var(--cl-sp-4);border-radius:999px;border:1.5px solid var(--cl-border-strong);
      background:transparent;color:var(--cl-text-1);font-weight:600;cursor:pointer}
    .sslib-group{border:1px solid var(--cl-border);border-radius:var(--cl-r-md);padding:var(--cl-sp-3) var(--cl-sp-4);background:var(--cl-bg-1)}
    .sslib-group-head{display:flex;gap:var(--cl-sp-2);align-items:center;margin-bottom:var(--cl-sp-2)}
    .sslib-place-name{font-weight:600;color:var(--cl-text-1)}
    .sslib-count{font-family:var(--cl-mono);font-size:var(--cl-fs-12);color:var(--cl-text-3)}
    .sslib-group-add{margin-left:auto;height:32px;min-height:44px;padding:0 var(--cl-sp-3);border-radius:var(--cl-r-xs);border:1px solid var(--cl-border-strong);
      background:transparent;color:var(--cl-text-1);cursor:pointer}
    .sslib-row{display:flex;gap:var(--cl-sp-2);align-items:center;flex-wrap:wrap;padding:var(--cl-sp-2) 0;border-top:1px solid var(--cl-border);cursor:pointer}
    .sslib-row-name{font-weight:500;color:var(--cl-text-1)}
    .sslib-row-sum{font-family:var(--cl-mono);font-size:var(--cl-fs-12);color:var(--cl-text-3)}
    .sslib-row-actions{margin-left:auto;display:flex;gap:var(--cl-sp-2)}
    .sslib-act{height:32px;min-height:44px;padding:0 var(--cl-sp-3);border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);
      background:transparent;color:var(--cl-text-1);cursor:pointer}
    .sslib-act-del{color:var(--cl-red-text)}
    .sslib-act-del.sslib-armed{border-color:var(--cl-red-border);background:var(--cl-red-bg);color:var(--cl-red-text);font-weight:600}
    .sslib-badge{font-size:var(--cl-fs-12);padding:1px var(--cl-sp-2);border-radius:var(--cl-r-xs);border:1px solid var(--cl-border-strong);color:var(--cl-grey-text)}
    .sslib-badge-priv{color:var(--cl-grey-text)}
    .sslib-empty,.sslib-login{border:1px solid var(--cl-border);border-radius:var(--cl-r-md);padding:var(--cl-sp-5);color:var(--cl-text-3);font-size:var(--cl-fs-14)}
    .sslib-empty .t{color:var(--cl-text-1);font-weight:600;margin-bottom:var(--cl-sp-2)}
    .sslib-loading{color:var(--cl-text-3);font-size:var(--cl-fs-13)}
    /* 條件表單 overlay（CL-APP-06 彈窗契約：永不高於視窗＋內部捲動） */
    .sslib-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--cl-bg-1) 72%, black);display:none;z-index:1000}
    .sslib-overlay.open{display:flex;align-items:center;justify-content:center;padding:var(--cl-sp-4)}
    .sslib-modal{background:var(--cl-bg-1);border:1px solid var(--cl-border-strong);border-radius:var(--cl-r-md);
      max-width:640px;width:100%;max-height:calc(100vh - 2*var(--cl-sp-4));box-sizing:border-box;overflow-y:auto;padding:var(--cl-sp-5)}
    body.sslib-lock{overflow:hidden}
    .sslib-m-head{display:flex;gap:var(--cl-sp-3);align-items:flex-start;margin-bottom:var(--cl-sp-4)}
    .sslib-m-head .name{font-size:var(--cl-fs-20);font-weight:700;color:var(--cl-text-1)}
    .sslib-m-head .sub{font-size:var(--cl-fs-12);color:var(--cl-text-3);font-family:var(--cl-mono)}
    /* CL-UI-126: picker region switcher (台灣/日本/美國/阿拉斯加/夏威夷) */
    .sslib-region{display:flex;gap:var(--cl-sp-2);flex-wrap:wrap;margin:0 0 var(--cl-sp-3)}
    .sslib-region-btn{height:32px;min-height:32px;padding:0 var(--cl-sp-3);border-radius:999px;
      border:1px solid var(--cl-border);background:var(--cl-bg-2);color:var(--cl-text-2);
      font-size:var(--cl-fs-12);white-space:nowrap;cursor:pointer}
    .sslib-region-btn:hover{border-color:var(--cl-border-strong);color:var(--cl-text-1)}
    .sslib-region-btn.on{border-color:var(--cl-green);background:var(--cl-bg-3);color:var(--cl-text-1);font-weight:600}
    .sslib-close{margin-left:auto;height:var(--cl-control-h);min-height:44px;min-width:44px;border:1px solid var(--cl-border);border-radius:var(--cl-r-sm);background:transparent;color:var(--cl-text-1);cursor:pointer}
    .sslib-fld{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--cl-sp-3)}
    .sslib-fld label{font-size:var(--cl-fs-13);color:var(--cl-text-3)}
    .sslib-fld .hint{font-size:var(--cl-fs-12);color:var(--cl-text-3)}
    .sslib-inp,.sslib-sel,.sslib-search{height:var(--cl-control-h);border:1px solid var(--cl-border-strong);border-radius:var(--cl-r-sm);
      background:var(--cl-bg-1);color:var(--cl-text-1);padding:0 var(--cl-sp-2)}
    .sslib-inp:focus,.sslib-sel:focus,.sslib-search:focus{outline:1.5px solid var(--cl-border-strong)}
    .sslib-sem-wrap{display:flex;gap:var(--cl-sp-2);align-items:center;flex-wrap:wrap}
    .sslib-sem-map{font-size:var(--cl-fs-12);color:var(--cl-text-3);font-family:var(--cl-mono)}
    .sslib-params{display:grid;grid-template-columns:1fr 1fr;gap:var(--cl-sp-2) var(--cl-sp-3)}
    .sslib-fld.wide{grid-column:1 / -1}
    .sslib-win{display:flex;gap:var(--cl-sp-2);align-items:center}
    .sslib-win input{height:var(--cl-control-h);flex:1;border:1px solid var(--cl-border-strong);border-radius:var(--cl-r-sm);background:var(--cl-bg-1);color:var(--cl-text-1)}
    .sslib-months{display:flex;gap:var(--cl-sp-2);flex-wrap:wrap}
    .sslib-mo{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--cl-border);border-radius:var(--cl-r-xs);padding:0 var(--cl-sp-2);height:32px;min-height:44px;color:var(--cl-text-1)}
    .sslib-advanced summary{cursor:pointer;color:var(--cl-text-3);height:44px;display:flex;align-items:center}
    .sslib-preview{font-size:var(--cl-fs-12);color:var(--cl-text-3);margin-bottom:var(--cl-sp-3)}
    .sslib-preview .k{color:var(--cl-text-1);font-family:var(--cl-mono)}
    .sslib-submit{height:var(--cl-btn-h);min-height:44px;width:100%;border:none;border-radius:var(--cl-r-md);
      background:var(--cl-green-text);color:var(--cl-bg-1);font-weight:600;cursor:pointer}
    .sslib-toast{position:fixed;left:50%;bottom:calc(64px + var(--cl-sp-3));transform:translateX(-50%) translateY(8px);
      background:var(--cl-bg-1);border:1px solid var(--cl-border-strong);border-radius:var(--cl-r-md);padding:var(--cl-sp-2) var(--cl-sp-4);
      color:var(--cl-text-1);font-size:var(--cl-fs-13);opacity:0;pointer-events:none;transition:opacity .2s;max-width:min(92vw,480px);z-index:1001;white-space:pre-line}
    .sslib-toast.show{opacity:1}
    /* 選景點 picker */
    .sslib-pick-sec{font-size:var(--cl-fs-13);color:var(--cl-text-3);margin:var(--cl-sp-3) 0 var(--cl-sp-2)}
    .sslib-pick-list{display:flex;flex-direction:column;gap:var(--cl-sp-2);max-height:220px;overflow-y:auto}
    .sslib-pick-item{display:flex;gap:var(--cl-sp-2);align-items:center;height:var(--cl-control-h);min-height:44px;padding:0 var(--cl-sp-3);
      border:1px solid var(--cl-border);border-radius:var(--cl-r-sm);background:transparent;color:var(--cl-text-1);cursor:pointer;text-align:left}
    .sslib-pick-item:hover{border-color:var(--cl-border-strong)}
    .sslib-pick-none{color:var(--cl-text-3);font-size:var(--cl-fs-13);padding:var(--cl-sp-2) 0}
    @media (max-width: 480px) {
      .sslib-params{grid-template-columns:1fr}
      .sslib-quota{margin-left:0;width:100%}
      .sslib-row-actions{margin-left:0;width:100%}
    }
    /* ── CL-UX-01 Part B：預設提醒規則面板＋單點覆寫面板 ─────────────
       同一組控制項（data-f 契約）用在預設面板與卡片內覆寫面板，讀值/寫值
       共用 reminders-page.js 的 readSchedule/writeSchedule。 */
    .rem-def-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:var(--cl-sp-3) var(--cl-sp-4)}
    .rem-def-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .rem-def-name{font-size:var(--cl-fs-12);color:var(--cl-text-2);font-weight:600}
    .rem-def-opt{display:flex;align-items:center;gap:6px;font-size:var(--cl-fs-13);color:var(--cl-text-1);
      min-height:32px;cursor:pointer}
    .rem-def-opt input[type="radio"]{accent-color:var(--cl-green)}
    .rem-def-field select{height:32px;padding:0 8px;border-radius:var(--cl-r-xs);border:1px solid var(--cl-border-strong);
      background:var(--cl-bg-2);color:var(--cl-text-1);font-size:var(--cl-fs-13)}
    /* CL-UX-02: one row of seven equal-width capsules — no square box, no
       tick glyph. Selected = bright green fill; unselected = dark outline.
       The checkbox stays in the DOM (a11y/contract) but is visually hidden. */
    .rem-def-wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
    .rem-def-wds[hidden]{display:none}
    .rem-def-wd{position:relative;display:inline-flex;align-items:center;justify-content:center;
      height:36px;min-height:36px;padding:0;border:1px solid var(--cl-border-strong);border-radius:999px;
      background:transparent;color:var(--cl-text-2);font-size:var(--cl-fs-12);cursor:pointer;
      text-align:center;overflow:hidden;white-space:nowrap}
    .rem-def-wd input{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}
    .rem-def-wd:has(input:checked){background:var(--cl-green);border-color:var(--cl-green);
      color:var(--cl-bg-0);font-weight:600}
    .rem-def-wd:has(input:focus-visible){outline:2px solid var(--cl-green-border);outline-offset:2px}
    .rem-def-wd:has(input:disabled){opacity:.45;cursor:default}
    /* CL-UX-02: look-ahead quick capsules (1 / 3 / 5 / 7 days) */
    .rem-def-leads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
    .rem-def-lead{position:relative;display:inline-flex;align-items:center;justify-content:center;
      height:36px;min-height:36px;padding:0;border:1px solid var(--cl-border-strong);border-radius:999px;
      background:transparent;color:var(--cl-text-2);font-size:var(--cl-fs-12);cursor:pointer;
      text-align:center;white-space:nowrap}
    .rem-def-lead input{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}
    .rem-def-lead:has(input:checked){background:var(--cl-green);border-color:var(--cl-green);
      color:var(--cl-bg-0);font-weight:600}
    .rem-def-lead:has(input:focus-visible){outline:2px solid var(--cl-green-border);outline-offset:2px}
    /* CL-UX-02: collapsible defaults — summary row + 修改預設, panel hidden */
    .rem-def-head{display:flex;align-items:center;gap:var(--cl-sp-3);flex-wrap:wrap}
    .rem-def-head h2{margin:0}
    .rem-def-toggle{margin-left:auto;height:32px;min-height:32px;padding:0 var(--cl-sp-3);border-radius:999px;
      border:1px solid var(--cl-border-strong);background:transparent;color:var(--cl-text-1);
      font-size:var(--cl-fs-12);font-weight:600;cursor:pointer;white-space:nowrap}
    .rem-def-toggle:hover{background:var(--cl-bg-2)}
    .rem-def-body[hidden]{display:none}
    .rem-def-body{margin-top:var(--cl-sp-3)}
    /* CL-UX-02: iOS standalone top safe area — pad the header and mask the
       status-bar strip so scrolling text never sits under the clock. */
    .rem-header{padding-top:calc(var(--cl-sp-5) + env(safe-area-inset-top, 0px))}
    .cl-safe-top-mask{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top, 0px);
      background:var(--cl-bg-0);z-index:9000;pointer-events:none}
    .rem-def-field input[type="time"]{height:32px;min-height:32px;padding:0 8px;border-radius:var(--cl-r-xs);
      border:1px solid var(--cl-border-strong);background:var(--cl-bg-2);color:var(--cl-text-1);
      font-size:var(--cl-fs-13);width:100%;box-sizing:border-box}
    .rem-def-summary{margin:var(--cl-sp-3) 0 0;font-family:var(--cl-mono);font-size:var(--cl-fs-12);
      color:var(--cl-text-2);line-height:1.5}
    .rem-def-acts{display:flex;gap:var(--cl-sp-2);margin-top:var(--cl-sp-3)}
    /* 面板內的動作鈕（.rem-add-btn/.rem-edit-btn 在別處是子選擇器限定，這裡補齊） */
    .rem-def-acts .rem-add-btn,.rem-ovr-acts .rem-add-btn{height:var(--cl-btn-h);min-height:36px;
      padding:0 var(--cl-sp-4);border-radius:var(--cl-r-xs);border:1px solid var(--cl-border-strong);
      background:var(--cl-bg-3);color:var(--cl-text-1);font-size:var(--cl-fs-13);font-weight:600;
      white-space:nowrap;cursor:pointer}
    .rem-def-acts .rem-add-btn:hover,.rem-ovr-acts .rem-add-btn:hover{background:var(--cl-bg-2)}
    .rem-ovr-acts .rem-edit-btn{height:var(--cl-btn-h);min-height:36px;padding:0 var(--cl-sp-4);
      border-radius:var(--cl-r-xs);border:1px solid var(--cl-border);background:var(--cl-bg-2);
      color:var(--cl-text-2);font-size:var(--cl-fs-13);white-space:nowrap;cursor:pointer}
    .rem-ovr-acts .rem-edit-btn:hover{background:var(--cl-bg-3);color:var(--cl-text-1);
      border-color:var(--cl-border-strong)}
    /* 卡片內覆寫面板：卡片轉 flex-wrap，面板整列獨占 */
    .rem-card{flex-wrap:wrap}
    .rem-ovr{flex:0 0 100%;margin-top:var(--cl-sp-3);padding-top:var(--cl-sp-3);
      border-top:1px solid var(--cl-border)}
    .rem-ovr[hidden]{display:none}
    .rem-ovr-acts{display:flex;gap:var(--cl-sp-2);margin-top:var(--cl-sp-3);flex-wrap:wrap}
    @media (max-width: 480px) {
      .rem-def-grid{grid-template-columns:1fr}
      .rem-ovr-acts .rem-add-btn,.rem-ovr-acts .rem-edit-btn{min-height:44px}
      .rem-def-acts .rem-add-btn{min-height:44px;width:100%}
      .rem-def-wd{min-height:44px}
      /* 4 顆動作鈕在窄幅會把主文壓成細條：主文整列、動作鈕橫排在下方 */
      .rem-main{flex:1 1 100%}
      .rem-acts{flex-direction:row;flex-wrap:wrap;width:100%;justify-content:flex-end;
        align-items:center;gap:var(--cl-sp-2)}
      .rem-acts .rem-edit-btn,.rem-acts .rem-del{height:36px;min-height:36px}
      /* 排程摘要句在窄幅換行，不讓「僅✓推薦」被省略號吃掉 */
      .rem-sched-summary{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
    }
  </style>
</head>

  <!-- CL-I18N-12A: resolve the language BEFORE the shell scripts boot.
       site-nav.js / member-auth.js read #lang-select at start-up, so a select
       still showing the zh-TW markup default painted Chinese nav and login
       buttons on ?lang=en until the next change event. -->
  <script>
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var stored = null; try { stored = localStorage.getItem('chaselights_lang'); } catch (e) {}
      var nav = navigator.language || 'zh-TW';
      var pick = q || stored || (/^ja/i.test(nav) ? 'ja' : (/^en/i.test(nav) ? 'en' : 'zh-TW'));
      if (['zh-TW', 'en', 'ja'].indexOf(pick) < 0) pick = 'zh-TW';
      var sel = document.getElementById('lang-select');
      if (sel) sel.value = pick;
      document.documentElement.lang = pick;
    } catch (e) { /* keep the markup default */ }
  })();
  </script>
