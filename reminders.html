<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChaseLights — 我的拍攝提醒</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="./assets/site-nav.css?v=clui62">
  <link rel="stylesheet" href="./assets/app.css?v=clui68">
  <style>
    /* CL-UI-58: reminders page — mobile-first (390px contract), follows the
       genre-eval page shell pattern (inline page styles, shared nav shell). */
    .rem-header{max-width:760px;margin:0 auto;padding:14px 12px 0}
    .rem-header h1{margin:0 0 10px;font-size:1.15rem}
    .rem-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .rem-wrap{max-width:760px;margin:0 auto;padding:0 12px 80px}
    .rem-panel{border:1px solid var(--line,rgba(255,255,255,.12));border-radius:10px;
      background:var(--panel,#141a22);padding:14px;margin-bottom:14px}
    .rem-row{border:1px solid var(--line,rgba(255,255,255,.12));border-radius:8px;
      padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .rem-row .rem-names{flex:1;min-width:180px}
    .rem-row .rem-names b{display:block;font-size:.95rem}
    .rem-row .rem-names .rem-sub{color:#8fa1b3;font-size:.82rem}
    .rem-row .rem-meta{color:#8fa1b3;font-size:.78rem}
    .rem-switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;min-height:44px}
    .rem-switch input{accent-color:#2f81f7;width:18px;height:18px;cursor:pointer}
    .rem-del{padding:8px 12px;min-height:44px;border-radius:8px;border:1px solid rgba(248,81,73,.4);
      background:transparent;color:#f85149;cursor:pointer;font-size:.82rem}
    .rem-del:hover{background:rgba(248,81,73,.12)}
    .rem-add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .rem-add-row select,.rem-add-row input{padding:8px 10px;min-height:44px;border-radius:8px;
      border:1px solid var(--line,rgba(255,255,255,.15));background:var(--panel,#141a22);color:inherit;font-size:.9rem}
    .rem-add-row input{flex:1;min-width:140px}
    .rem-add-btn{padding:8px 14px;min-height:44px;border-radius:8px;border:1px solid transparent;
      background:#2f81f7;color:#fff;cursor:pointer;font-size:.88rem;white-space:nowrap}
    .rem-add-btn[disabled]{opacity:.5;cursor:default}
    .rem-search{width:100%;margin-top:8px}
    .rem-results{list-style:none;margin:10px 0 0;padding:0}
    .rem-results li{display:flex;justify-content:space-between;gap:10px;align-items:center;
      border-top:1px solid var(--line,rgba(255,255,255,.08));padding:8px 0}
    .rem-results .rem-rr-sub{color:#8fa1b3;font-size:.8rem}
    .rem-results button{padding:6px 10px;min-height:44px;border-radius:8px;border:1px solid rgba(47,129,247,.5);
      background:transparent;color:#58a6ff;cursor:pointer;font-size:.8rem;white-space:nowrap}
    .rem-login{text-align:center;padding:8px 0}
    .rem-login a{display:inline-block;margin:6px;padding:10px 16px;border-radius:8px;
      border:1px solid var(--line,rgba(255,255,255,.2));color:inherit;text-decoration:none}
    .rem-state{color:#8fa1b3;font-size:.9rem;text-align:center;padding:16px 0}
    .rem-notice{position:fixed;bottom:12px;left:12px;right:12px;margin:0 auto;max-width:420px;
      padding:8px 12px;border:1px solid #475569;background:#111827;color:#e2e8f0;font-size:13px;
      border-radius:8px;z-index:10001;text-align:center}
    .rem-notice[hidden]{display:none}
    @media (max-width: 390px) {
      .rem-add-row select{flex:1 1 100%}
      .rem-row .rem-names{min-width:100%}
    }
  </style>
</head>
<body>

  <nav class="site-nav" aria-label="全站導覽">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="./index.html">📸 ChaseLights</a>
      <div class="site-nav-links">
        <a class="site-nav-item" data-nav-target="cards" href="./index.html" data-i18n="nav_cards">卡片</a>
        <a class="site-nav-item" data-nav-target="weather" href="./weather-map.html" data-i18n="nav_weathermap">天氣圖</a>
        <a class="site-nav-item" data-nav-target="reminders" data-active="page" href="./reminders.html" data-i18n="nav_reminders">提醒</a>
        <div class="site-nav-more" data-member-area>
          <span class="site-nav-item" data-member-name hidden>會員</span>
          <button class="site-nav-more-btn" type="button" data-member-toggle
                  aria-haspopup="true" aria-expanded="false" data-ma-i18n="ma_login" hidden>登入</button>
          <button class="site-nav-more-btn" type="button" data-member-logout
                  data-ma-i18n="ma_logout" hidden>登出</button>
          <div class="site-nav-menu" data-member-menu hidden>
            <a data-ma-line href="/api/v1/auth/line/start" data-ma-i18n="ma_line">使用 LINE 登入</a>
            <a data-ma-google href="/api/v1/auth/google/start" data-ma-i18n="ma_google">使用 Google 登入</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <header class="rem-header">
    <h1>🔔 <span id="page-title">我的拍攝提醒</span></h1>
    <div class="rem-controls">
      <select id="lang-select" class="control-dropdown lang-dropdown" aria-label="語言">
        <option value="zh-TW" selected>🌐 繁體中文</option>
        <option value="en">🌐 English</option>
        <option value="ja">🌐 日本語</option>
      </select>
    </div>
  </header>

  <div class="rem-wrap">
    <section class="rem-panel" id="rem-login-panel" hidden>
      <div class="rem-login" id="rem-login-body"></div>
    </section>

    <section class="rem-panel" id="rem-list-panel" hidden>
      <h2 id="rem-list-title" style="margin:0 0 10px;font-size:1rem"></h2>
      <div id="rem-list"></div>
    </section>

    <section class="rem-panel" id="rem-add-panel" hidden>
      <h2 id="rem-add-title" style="margin:0 0 10px;font-size:1rem"></h2>
      <div class="rem-add-row">
        <select id="rem-region" aria-label="地區"></select>
        <select id="rem-place" aria-label="景點"></select>
        <select id="rem-subject" aria-label="題材"></select>
        <button id="rem-add-submit" class="rem-add-btn" type="button"></button>
      </div>
      <input id="rem-search" class="rem-search" type="search" autocomplete="off">
      <ul id="rem-results" class="rem-results"></ul>
    </section>

    <p id="rem-state" class="rem-state"></p>
  </div>

  <script src="./assets/site-nav.js"></script>
  <script src="./assets/member-auth.js?v=clui67"></script>
  <script src="./assets/reminders-client.js?v=clui68"></script>
  <script src="./assets/reminders-page.js?v=clui68"></script>
</body>
</html>
